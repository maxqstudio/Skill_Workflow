name: TEMP SW2-08 Docs Sync

on:
  push:
    branches:
      - work/sw2-08-regression-adoption-validation

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-08-regression-adoption-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit deterministic docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs PROJECT_PROFILE.yaml
          if git diff --cached --quiet; then
            echo "NO_DOC_DRIFT"
            exit 0
          fi
          git commit -m "SW2-08: synchronize sequence truth projection"
          git push origin HEAD:work/sw2-08-regression-adoption-validation
