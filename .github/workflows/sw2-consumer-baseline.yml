name: SW2 Consumer Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  max-grounding-baseline:
    name: Consumer Baseline (max-grounding)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Skill Workflow candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify Skill Workflow candidate provenance
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SKILL_HEAD=$expected"
          echo "ACTUAL_SKILL_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Checkout pinned max-grounding consumer
        uses: actions/checkout@v4
        with:
          repository: maxqstudio/max-grounding
          ref: 4c45a23c48b7954bbfb0ab86bcc92c975f345a1f
          path: consumer
          fetch-depth: 0

      - name: Verify consumer provenance
        shell: bash
        run: |
          expected="4c45a23c48b7954bbfb0ab86bcc92c975f345a1f"
          actual="$(git -C consumer rev-parse HEAD)"
          echo "EXPECTED_CONSUMER_HEAD=$expected"
          echo "ACTUAL_CONSUMER_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure pinned consumer governance cost
        run: >-
          python scripts/benchmark_governance.py
          --root consumer
          --repeats 3
          --expected-head 4c45a23c48b7954bbfb0ab86bcc92c975f345a1f
          --label "SW2-00 max-grounding consumer baseline"
          --output ../artifacts/performance/sw2-00-max-grounding.json

      - name: Upload consumer baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw2-00-max-grounding-baseline
          path: artifacts/performance/sw2-00-max-grounding.json
          if-no-files-found: error
          retention-days: 14
