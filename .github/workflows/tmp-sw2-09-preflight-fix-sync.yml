name: TEMP SW2-09 Preflight Fix Sync

on:
  push:
    branches:
      - work/sw2-09-v2-stable-release

permissions:
  contents: write

jobs:
  sync-preflight-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-09-v2-stable-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove temporary workflow from final tree
        run: rm -f .github/workflows/tmp-sw2-09-preflight-fix-sync.yml
      - name: Prove release preflight and public docs regressions
        run: |
          python scripts/selftest_release_preflight.py
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
      - name: Regenerate and validate SW2-09 sequence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          acceptance = json.loads((root / '.workflow' / 'acceptance.json').read_text(encoding='utf-8'))
          session_id = acceptance['sequence_session']
          session_path = root / 'docs' / 'sequence' / 'sessions' / f'{session_id}.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [
              sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.',
              '--output-json', actual['graph'], '--output-mermaid', actual['diagram'],
          ]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)

          generated = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = generated['source_digest']
          session['actual']['source_digest'] = digest
          if session.get('human_view'):
              session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          human = session.get('human_view') or {}
          if human:
              subprocess.run([
                  sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
                  '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
                  '--output-json', human['graph'], '--output-mermaid', human['diagram'],
                  '--output-markdown', human['document'], '--session-id', session_id,
              ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report'],
          ], check=True)
          if human:
              subprocess.run([
                  sys.executable, 'scripts/validate_sequence_human_view.py', '--root', '.',
                  '--session', session_path.as_posix(),
              ], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_sessions.py', '--root', '.'], check=True)
          print(f'SW2_09_SEQUENCE_DIGEST={digest}')
          PY
      - name: Synchronize Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit clean preflight repair projection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SW2-09: sync publication preflight repair"
          git push origin HEAD:work/sw2-09-v2-stable-release
