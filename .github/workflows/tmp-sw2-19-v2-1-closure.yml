name: TEMP SW2-19 V2.1 Closure

on:
  push:
    branches:
      - ops/sw2-19-v2-1-closure-runner
    paths:
      - .github/workflows/tmp-sw2-19-v2-1-closure.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_SHA: 81b76ccad6785538d898a0fd5767e1b426a2eb56
      RELEASE_TREE: e53543885eebd42bb1eeb813dbf08cc8eb4ba92f
      VERSION: v2.1.0
      CLOSURE_BRANCH: work/sw2-19-v2-1-closure
      PUBLICATION_RUN: "37384892850"
      PUBLICATION_ARTIFACT_ID: "11377810204"
      PUBLICATION_ARTIFACT_DIGEST: sha256:fbdd9d219a44b6de67b1678d67815f5a2c4d1cbda024ca02be1974002b2a250e
      RELEASE_ID: "404150971"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact released main tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release identity and closure lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          tag_sha="$(git ls-remote origin "refs/tags/$VERSION" | awk '{print $1}')"
          test "$tag_sha" = "$RELEASE_SHA"
          branch_sha="$(git ls-remote origin "refs/heads/$CLOSURE_BRANCH" | awk '{print $1}')"
          test "$branch_sha" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > "$RUNNER_TEMP/live-release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'live-release.json').read_text(encoding='utf-8'))
          assert release['id'] == int(os.environ['RELEASE_ID']), release
          assert release['tag_name'] == os.environ['VERSION'], release
          assert release['target_commitish'] == os.environ['RELEASE_SHA'], release
          assert release['draft'] is False and release['prerelease'] is False, release
          print('LIVE_V2_1_IDENTITY=PASS')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote SW2-19 R4 and lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          release_sha = os.environ['RELEASE_SHA']
          release_tree = os.environ['RELEASE_TREE']
          run_id = os.environ['PUBLICATION_RUN']
          artifact_id = os.environ['PUBLICATION_ARTIFACT_ID']
          artifact_digest = os.environ['PUBLICATION_ARTIFACT_DIGEST']
          release_id = os.environ['RELEASE_ID']

          acceptance = load('.workflow/acceptance.json')
          found = False
          for req in acceptance.get('requirements', []):
              if req.get('id') == 'SW2-19-R4':
                  if req.get('status') != 'NOT_PROVEN':
                      raise RuntimeError('SW2_19_R4_NOT_PUBLICATION_PENDING')
                  req['status'] = 'PASS'
                  req['evidence'] = (
                      f'Stable v2.1.0 publication is accepted from exact tested main {release_sha} '
                      f'with tree {release_tree}. Publication run {run_id} passed strict exact-head '
                      'governance finalize and V2.1 preflight with publication_authority=true while only '
                      'SW2-19-R4 was publication-pending before publication; live tag identity and GitHub '
                      f'release target identity both passed against the exact tested SHA. Publication artifact '
                      f'{artifact_id} has {artifact_digest}; GitHub release id is {release_id}. The v2.1.0 tag '
                      'is immutable release evidence and must not be moved or retargeted.'
                  )
                  found = True
                  break
          if not found:
              raise RuntimeError('SW2_19_R4_MISSING')
          write('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          if state.get('phase') != 'SW2-19':
              raise RuntimeError('STATE_PHASE_NOT_SW2_19')
          state['status'] = 'V2_1_STABLE_RELEASED'
          state['working_branch'] = 'main'
          state['last_accepted_branch'] = 'main'
          state['last_accepted_sha'] = release_sha
          state['blockers'] = []
          state['blocked_actions'] = [
              'Do not move, retarget, delete-and-recreate, or silently replace the stable v2.1.0 tag as a normal rollback path.',
              'Do not move, retarget, delete-and-recreate, or silently replace the historical v2.0.0 tag.',
              'Do not claim that GitHub automatically blocks merges or requires checks while no repository ruleset is configured.',
              'Do not weaken accepted Skill Workflow V2.1 guarantees without a new governed acceptance boundary.',
          ]
          state['next_authorized_actions'] = [
              f'Treat v2.1.0 at {release_sha} as the accepted stable V2.1 release baseline.',
              'For defects in the stable release, repair forward under a new governed patch release; never retarget an existing stable tag.',
              'Before new feature or compatibility work changes accepted V2.1 guarantees, declare a new governed roadmap phase and acceptance boundary.',
          ]
          state['not_proven'] = [
              'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.'
          ]
          statement = (
              f'SW2-19 V2.1 stable publication is accepted on exact release main {release_sha} with tree '
              f'{release_tree}. Publication run {run_id} passed strict finalize/preflight with '
              f'publication_authority=true; v2.1.0 tag and GitHub release id {release_id} both target the '
              f'exact SHA; publication artifact {artifact_id} has {artifact_digest}.'
          )
          proven = list(state.get('proven', []))
          if statement not in proven:
              proven.append(statement)
          state['proven'] = proven
          write('.workflow/state.json', state)
          print('SW2_19_R4_PROMOTION=PASS')
          PY

      - name: Regenerate Project Truth
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .

      - name: Assert closure diff scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed_exact = {'.workflow/acceptance.json', '.workflow/state.json'}
          changed = [line for line in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines() if line]
          unexpected = [p for p in changed if p not in allowed_exact and not (p.startswith('docs/') and p.endswith('.md'))]
          if unexpected:
              raise SystemExit('UNEXPECTED_CLOSURE_DIFF:' + ','.join(unexpected))
          if not allowed_exact.issubset(changed):
              raise SystemExit('MISSING_CLOSURE_AUTHORITY_DIFF')
          print('CLOSURE_DIFF_SCOPE=PASS')
          print('\n'.join(changed))
          PY

      - name: Commit closure candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow/acceptance.json .workflow/state.json docs
          git commit -m 'SW2-19: close V2.1 stable release'
          echo "CLOSURE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate exact clean closure candidate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/governance_engine.py \
            --root . \
            --base "$RELEASE_SHA" \
            --mode finalize \
            --expected-head "$CLOSURE_SHA" \
            --report "$RUNNER_TEMP/closure-governance.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'closure-governance.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS', report
          assert report['final_acceptance_authority'] is True, report
          assert report['expected_head'] == os.environ['CLOSURE_SHA'], report
          print('SW2_19_CLOSURE_FINALIZE=PASS')
          PY

      - name: Push clean closure candidate
        shell: bash
        run: |
          set -euo pipefail
          lease="$(git ls-remote origin "refs/heads/$CLOSURE_BRANCH" | awk '{print $1}')"
          test "$lease" = "$RELEASE_SHA"
          git push origin "HEAD:refs/heads/$CLOSURE_BRANCH"

      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw2-19-v2.1-closure-${{ env.RELEASE_SHA }}
          path: |
            ${{ runner.temp }}/live-release.json
            ${{ runner.temp }}/closure-governance.json
