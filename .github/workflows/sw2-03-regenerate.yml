name: SW2-03 Regenerate Evidence

on:
  push:
    branches:
      - work/sw2-03-sequence-v2

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout branch authority
        uses: actions/checkout@v4
        with:
          ref: work/sw2-03-sequence-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source without dirtying worktree
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q scripts

      - name: Run Sequence V2 regressions
        run: |
          python scripts/selftest_sequence_call_resolution.py
          python scripts/selftest_sequence_human_view.py

      - name: Regenerate full machine evidence
        run: >-
          python scripts/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/SW2-03-GOVERNANCE.actual.json
          --output-mermaid docs/sequence/generated/SW2-03-GOVERNANCE.actual.mmd
          --entry scripts/generate_sequence_actual.py::main
          --entry scripts/validate_sequence_contract.py::main
          --entry scripts/validate_sequence_sessions.py::main

      - name: Generate bounded human projection
        run: >-
          python scripts/sequence_human_view.py
          --root .
          --actual-json docs/sequence/generated/SW2-03-GOVERNANCE.actual.json
          --actual-mermaid docs/sequence/generated/SW2-03-GOVERNANCE.actual.mmd
          --output-json docs/sequence/generated/SW2-03-GOVERNANCE.human.json
          --output-mermaid docs/sequence/generated/SW2-03-GOVERNANCE.human.mmd
          --output-markdown docs/sequence/views/SW2-03-GOVERNANCE.md
          --session-id SW2-03-GOVERNANCE

      - name: Bind source digest fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          actual = json.load(open('docs/sequence/generated/SW2-03-GOVERNANCE.actual.json', encoding='utf-8'))
          human = json.load(open('docs/sequence/generated/SW2-03-GOVERNANCE.human.json', encoding='utf-8'))
          digest = str(actual.get('source_digest', '')).strip()
          assert digest and digest != 'PENDING_GENERATION', actual
          assert human.get('source_digest') == digest, human

          session_path = Path('docs/sequence/sessions/SW2-03-GOVERNANCE.json')
          session = json.load(session_path.open(encoding='utf-8'))
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.load(acceptance_path.open(encoding='utf-8'))
          acceptance['sequence_sync_status'] = 'PASS'
          acceptance['truth_gates']['SEQUENCE_SYNC'] = 'PASS'
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print(f'SW2_03_SOURCE_DIGEST={digest}')
          PY

      - name: Validate machine and human sequence evidence
        run: |
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-03-GOVERNANCE.json --report artifacts/sequence/SW2-03-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-03-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .

      - name: Set up Node for Mermaid renderer
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Prove Mermaid renderability
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/puppeteer-config.json" <<'JSON'
          {"args":["--no-sandbox"]}
          JSON
          npx -y -p @mermaid-js/mermaid-cli@12.0.0 mmdc \
            -p "$RUNNER_TEMP/puppeteer-config.json" \
            -i docs/sequence/generated/SW2-03-GOVERNANCE.human.mmd \
            -o "$RUNNER_TEMP/SW2-03-GOVERNANCE.svg"
          test -s "$RUNNER_TEMP/SW2-03-GOVERNANCE.svg"

      - name: Regenerate Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          # Clean-worktree cross-document validation runs on the post-commit cleanup candidate.
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-03-GOVERNANCE.json --report artifacts/sequence/SW2-03-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-03-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
          python scripts/validate_project_truth.py --root .

      - name: Assert evidence remains phase-scoped
        shell: bash
        run: |
          python - <<'PY'
          import json

          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert [r['id'] for r in acceptance['requirements']] == ['SW2-03-R1', 'SW2-03-R2', 'SW2-03-R3', 'SW2-03-R4']
          assert all(r['status'] == 'NOT_PROVEN' for r in acceptance['requirements']), acceptance['requirements']
          assert acceptance['sequence_sync_status'] == 'PASS', acceptance
          assert acceptance['truth_gates']['SEQUENCE_SYNC'] == 'PASS', acceptance

          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claim_map = {c['id']: c for c in claims['claims']}
          assert claim_map['TRUTH-SW2-SEQUENCE-FIDELITY']['status'] == 'NOT_PROVEN'
          assert claim_map['TRUTH-SW2-SEQUENCE-PRESENTATION']['status'] == 'NOT_PROVEN'

          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-03' and state['status'] == 'IN_PROGRESS', state
          assert state['working_branch'] == 'work/sw2-03-sequence-v2', state
          assert state['last_accepted_sha'] == 'f79917550fe42f98110f1a11915ad9699e5244e6', state

          actual = json.load(open('docs/sequence/generated/SW2-03-GOVERNANCE.actual.json', encoding='utf-8'))
          human = json.load(open('docs/sequence/generated/SW2-03-GOVERNANCE.human.json', encoding='utf-8'))
          projection = human['projection']
          assert human['source_digest'] == actual['source_digest']
          assert projection['machine_node_count'] == len(actual['nodes'])
          assert projection['machine_edge_count'] == len(actual['edges'])
          assert projection['internal_machine_edges_collapsed'] + projection['cross_component_machine_edges'] == len(actual['edges'])
          assert sum(e['machine_edge_count'] for e in human['edges']) == projection['cross_component_machine_edges']
          assert human['complexity']['absolute_numeric_limit'] is None
          print('SW2_03_REGEN_ASSERTIONS=PASS')
          PY

      - name: Commit regenerated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo "NO_REGEN_DIFF"; exit 0; }
          git commit -m "gov(sw2-03): regenerate Sequence V2 evidence"
          git push origin HEAD:work/sw2-03-sequence-v2
