name: SW2-04 Authority Handoff

on:
  push:
    branches:
      - work/sw2-04-documentation-system-v2

permissions:
  contents: write

jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ACCEPTED_MAIN: "2ff1d1501a7762baedcd848ebc117b7760b7c738"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-04-documentation-system-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert branch starts from accepted main
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$ACCEPTED_MAIN" || test "$(git rev-parse HEAD)" = "$ACCEPTED_MAIN"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          echo "SW2_04_ACCEPTED_MAIN_BINDING=PASS"

      - name: Synchronize SW2-04 authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ACCEPTED = '2ff1d1501a7762baedcd848ebc117b7760b7c738'
          BRANCH = 'work/sw2-04-documentation-system-v2'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          state = load('.workflow/state.json')
          assert state['phase'] == 'SW2-04' and state['status'] == 'IN_PROGRESS', state
          state['last_accepted_branch'] = 'main'
          state['last_accepted_sha'] = ACCEPTED
          state['working_branch'] = BRANCH
          proof = (
              'SW2-03 merged to main as 2ff1d1501a7762baedcd848ebc117b7760b7c738 with tree '
              'equivalent to tested cleanup candidate 2581370dc757221f162bda744cd174f2e047c7cc. '
              'Post-merge main passed Self Governance 37094279185, Governance Selftest 37094279257 '
              'on Ubuntu and Windows, dynamic-current-session SW2 Sequence Evidence 37094279177, '
              'SW2 Engine Performance 37094279196, and SW2 Consumer Engine Performance 37094279186.'
          )
          if proof not in state.setdefault('proven', []):
              state['proven'].append(proof)
          state['next_authorized_actions'] = [
              'Audit the current public README, generated docs, machine indexes, and navigation boundaries against SW2-04-R1..R4.',
              'Implement the smallest deterministic Documentation System V2 structure that separates public guidance from machine indexes/evidence.',
              'Keep every SW2-04 requirement and documentation claim NOT_PROVEN until dedicated clean acceptance evidence exists.'
          ]
          write('.workflow/state.json', state)

          acceptance = load('.workflow/acceptance.json')
          assert acceptance['sequence_session'] == 'SW2-04-GOVERNANCE'
          commands = []
          for command in acceptance.get('test_commands', []):
              if command.startswith('python scripts/governance_engine.py --root . --base '):
                  command = f'python scripts/governance_engine.py --root . --base {ACCEPTED} --mode finalize --expected-head <EXACT_HEAD>'
              commands.append(command)
          acceptance['test_commands'] = commands
          write('.workflow/acceptance.json', acceptance)

          session_path = Path('docs/sequence/sessions/SW2-04-GOVERNANCE.json')
          session = load(session_path)
          session['implementation_base_sha'] = ACCEPTED
          write(session_path, session)

          print('SW2_04_AUTHORITY_HANDOFF=PASS')
          PY

      - name: Regenerate Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-04-GOVERNANCE.json --report artifacts/sequence/SW2-04-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-04-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert fail-closed phase state
        shell: bash
        run: |
          python - <<'PY'
          import json
          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          session = json.load(open('docs/sequence/sessions/SW2-04-GOVERNANCE.json', encoding='utf-8'))
          assert state['last_accepted_sha'] == '2ff1d1501a7762baedcd848ebc117b7760b7c738'
          assert state['working_branch'] == 'work/sw2-04-documentation-system-v2'
          assert all(r['status'] == 'NOT_PROVEN' for r in acceptance['requirements'])
          assert session['implementation_base_sha'] == '2ff1d1501a7762baedcd848ebc117b7760b7c738'
          print('SW2_04_HANDOFF_ASSERTIONS=PASS')
          PY

      - name: Commit authority handoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence/SW2-04-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_HANDOFF_DIFF"; exit 1; }
          git commit -m "gov(sw2-04): bind accepted main authority"
          git push origin HEAD:work/sw2-04-documentation-system-v2
