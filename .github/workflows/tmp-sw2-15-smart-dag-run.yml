name: TEMP SW2-15 Smart DAG Runner

on:
  push:
    branches: [work/sw2-15-smart-validation-dag]
    paths: [.github/workflows/tmp-sw2-15-smart-dag-run.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch and focused regressions
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python artifacts/tmp/sw2_15_smart_dag_apply.txt
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
      - name: Regenerate governed evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path('.').resolve(); sp=root/'docs/sequence/sessions/SW2-15-GOVERNANCE.json'; s=json.loads(sp.read_text(encoding='utf-8'))
          a=s['actual']; cmd=[sys.executable,'scripts/generate_sequence_actual.py','--root','.','--output-json',a['graph'],'--output-mermaid',a['diagram']]
          for e in a['entries']: cmd += ['--entry',e]
          subprocess.run(cmd,check=True)
          g=json.loads((root/a['graph']).read_text(encoding='utf-8')); d=g['source_digest']; s['actual']['source_digest']=d; s['human_view']['source_digest']=d
          sp.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          h=s['human_view']
          subprocess.run([sys.executable,'scripts/sequence_human_view.py','--root','.','--actual-json',a['graph'],'--actual-mermaid',a['diagram'],'--output-json',h['graph'],'--output-mermaid',h['diagram'],'--output-markdown',h['document'],'--session-id',s['session_id']],check=True)
          subprocess.run([sys.executable,'scripts/validate_sequence_contract.py','--root','.','--session',str(sp.relative_to(root))],check=True)
          PY
          python scripts/sync_project_truth.py --root .
      - name: Commit source and generated evidence locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/governance_engine.py scripts/selftest_governance_engine.py .workflow docs artifacts/sequence
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'SW2-15: implement Smart Validation DAG'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prove clean committed candidate
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base 71c0269a5f2cf7fc98cf05e79c5c9494a32dfae4 --mode verify --expected-head "$HEAD_SHA" --report /tmp/sw2-15-verify.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_public_docs.py --root .
      - name: Push implementation
        shell: bash
        run: git push origin HEAD:work/sw2-15-smart-validation-dag
