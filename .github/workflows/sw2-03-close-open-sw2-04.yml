name: SW2-03 Close and Open SW2-04

on:
  push:
    branches:
      - work/sw2-03-sequence-v2

permissions:
  contents: write

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SW2_03_ACCEPTED_CANDIDATE: "7823dd1b6be1de59c1f28406c050df343a3d1934"

    steps:
      - name: Checkout branch authority
        uses: actions/checkout@v4
        with:
          ref: work/sw2-03-sequence-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert accepted SW2-03 candidate is ancestor
        shell: bash
        run: |
          git merge-base --is-ancestor "$SW2_03_ACCEPTED_CANDIDATE" HEAD
          echo "SW2_03_ACCEPTED_CANDIDATE_BINDING=PASS"

      - name: Apply phase transition fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          roadmap = load('.workflow/roadmap.json')
          assert roadmap['current_phase'] == 'SW2-03', roadmap
          phases = {phase['id']: phase for phase in roadmap['phases']}
          assert phases['SW2-03']['status'] == 'CURRENT', phases['SW2-03']
          assert phases['SW2-04']['status'] == 'PLANNED', phases['SW2-04']
          phases['SW2-03']['status'] = 'COMPLETE'
          phases['SW2-04']['status'] = 'CURRENT'
          roadmap['current_phase'] = 'SW2-04'
          write('.workflow/roadmap.json', roadmap)

          state = load('.workflow/state.json')
          assert state['phase'] == 'SW2-03' and state['status'] == 'IN_PROGRESS', state
          closure = (
              'SW2-03 Sequence V2 is accepted on exact cleanup candidate '
              '7823dd1b6be1de59c1f28406c050df343a3d1934: Self Governance 37093982357, '
              'Governance Selftest 37093982276 on Ubuntu and Windows, dynamic-current-session '
              'SW2 Sequence Evidence 37093982364 with blocking Mermaid render, SW2 Engine '
              'Performance 37093982407, and SW2 Consumer Engine Performance 37093982235 all '
              'succeeded. Sequence V2 consumer vendoring and SKILL contract synchronization were '
              'also proven before closure.'
          )
          if closure not in state.setdefault('proven', []):
              state['proven'].append(closure)
          state['phase'] = 'SW2-04'
          state['status'] = 'IN_PROGRESS'
          state['not_proven'] = [
              'SW2-04 concise public README/landing-page quality is NOT_PROVEN until the public documentation information architecture is implemented and reviewed.',
              'SW2-04 separation between public guidance and machine indexes/evidence is NOT_PROVEN until deterministic generators and validators enforce the new locations.',
              'SW2-04 generated-document determinism and drift detection after documentation restructuring are NOT_PROVEN until regression evidence passes.',
              'Repository merge enforcement is still absent on main; actual alignment remains a SW2-07 exit criterion.'
          ]
          state['next_authorized_actions'] = [
              'Run clean permanent CI on the SW2-04 phase-open transition candidate.',
              'Merge PR #9 only after the exact phase-open cleanup SHA passes all permanent CI.',
              'After post-merge main acceptance, create work/sw2-04-documentation-system-v2 from exact accepted main and update working-branch/last-accepted authority before implementation.'
          ]
          state['blocked_actions'] = [
              'Do not mark any SW2-04 requirement PASS before implementation-specific evidence exists.',
              'Do not manually edit deterministic generated project Markdown as semantic authority.',
              'Do not remove or hide machine indexes/evidence merely to make public documentation shorter.',
              'Do not weaken Project Truth, cross-document, Human Comprehension, or sequence gates while restructuring documentation.',
              'Do not choose or add a repository license in SW2-04; license authority remains an Owner decision and SW2-07 scope.'
          ]
          write('.workflow/state.json', state)

          old_acceptance = load('.workflow/acceptance.json')
          comprehension = old_acceptance['human_comprehension_questions']
          acceptance = {
              'schema_version': 1,
              'evidence_boundary': 'SW2-04 acceptance covers Documentation System V2 only: public-facing documentation must become concise and navigable while deterministic generated Project Truth and machine evidence remain independently auditable and drift-detectable. Existing SW2-01 through SW2-03 governance, mode-safety, and Sequence V2 guarantees are inherited authority and must not be weakened. Runtime/E2E is not applicable to this repository documentation-system phase unless stronger runtime evidence becomes necessary.',
              'human_comprehension_questions': comprehension,
              'human_comprehension_status': 'PASS',
              'requirements': [
                  {
                      'id': 'SW2-04-R1',
                      'requirement': 'README is a concise public landing page that explains purpose, value, getting started, support, and maintenance without embedding the full governance reference manual.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until README/public landing-page restructuring is implemented and validated against the accepted documentation information architecture.'
                  },
                  {
                      'id': 'SW2-04-R2',
                      'requirement': 'Concept, guide, reference, architecture, and sequence documentation have stable public locations and navigation.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until the public documentation tree, navigation, redirects/migration handling where applicable, and cross-document validation are implemented.'
                  },
                  {
                      'id': 'SW2-04-R3',
                      'requirement': 'Machine indexes and evidence no longer dominate human-facing documentation while remaining fully available and auditable.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until machine indexes/evidence are separated from public guidance with deterministic references and no loss of acceptance evidence.'
                  },
                  {
                      'id': 'SW2-04-R4',
                      'requirement': 'Generated documentation remains deterministic and drift-detectable after the documentation-system restructuring.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until compiler, sync, cross-document, Human Comprehension, and clean-worktree regressions pass on the restructured documentation system.'
                  }
              ],
              'runtime_checks': [],
              'runtime_status': 'NOT_APPLICABLE',
              'sequence_mode': 'DURING',
              'sequence_session': 'SW2-04-GOVERNANCE',
              'sequence_sync_status': 'NOT_PROVEN',
              'test_commands': [
                  'python -m compileall -q scripts',
                  'python scripts/selftest_governance_engine.py',
                  'python scripts/selftest_sequence_call_resolution.py',
                  'python scripts/selftest_sequence_human_view.py',
                  'python scripts/selftest_cross_document_regressions.py',
                  'python scripts/selftest_project_truth_compiler.py',
                  'python scripts/selftest_strict_project_workflow.py',
                  'python scripts/validate_sequence_sessions.py --root .',
                  'python scripts/validate_handoff.py --root .',
                  'python scripts/governance_engine.py --root . --base f79917550fe42f98110f1a11915ad9699e5244e6 --mode finalize --expected-head <EXACT_HEAD>'
              ],
              'truth_gates': {
                  'BEHAVIORAL_SYNC': 'NOT_APPLICABLE',
                  'CROSS_DOCUMENT_CONSISTENCY': 'NOT_PROVEN',
                  'DOC_LAYOUT': 'PASS',
                  'DOC_READABILITY': 'PASS',
                  'DOC_SOURCE_TRACEABILITY': 'NOT_PROVEN',
                  'DOC_TEST_TRACEABILITY': 'NOT_PROVEN',
                  'HUMAN_COMPREHENSION': 'PASS',
                  'PROJECT_DOCS_NORMALIZED': 'PASS',
                  'PROJECT_DOCS_SYNC': 'PASS',
                  'PROJECT_STATE_SYNC': 'NOT_PROVEN',
                  'PROVENANCE_SYNC': 'NOT_PROVEN',
                  'REFERENCE_SYNC': 'NOT_PROVEN',
                  'ROADMAP_SYNC': 'NOT_PROVEN',
                  'RUNTIME_E2E': 'NOT_APPLICABLE',
                  'SEMANTIC_SYNC': 'NOT_PROVEN',
                  'SEQUENCE_SYNC': 'NOT_PROVEN',
                  'SOURCE_TESTS': 'NOT_PROVEN',
                  'STRUCTURAL_SYNC': 'NOT_PROVEN',
                  'TEST_RUNTIME_TRACEABILITY': 'NOT_APPLICABLE'
              }
          }
          write('.workflow/acceptance.json', acceptance)

          claims = load('.workflow/claims.json')
          claim_map = {claim['id']: claim for claim in claims['claims']}
          new_claims = [
              {
                  'id': 'TRUTH-SW2-DOCS-PUBLIC-IA',
                  'claim': 'Documentation System V2 provides a concise public landing page and stable public information architecture without treating machine indexes as the primary human entry point.',
                  'documents': ['ROADMAP.md', 'DOC_SYNC_MATRIX.md', 'PROJECT_TRUTH_SYNC.md'],
                  'runtime_evidence': [],
                  'source_owners': ['SKILL.md', 'scripts/generate_project_docs.py', 'scripts/validate_project_docs.py'],
                  'status': 'NOT_PROVEN',
                  'tests': ['scripts/selftest_project_truth_compiler.py', 'scripts/selftest_strict_project_workflow.py']
              },
              {
                  'id': 'TRUTH-SW2-DOCS-SEPARATION',
                  'claim': 'Public guidance and deterministic machine indexes/evidence are separated without weakening generated-document determinism, drift detection, or acceptance traceability.',
                  'documents': ['ROADMAP.md', 'DOC_SYNC_MATRIX.md', 'PROJECT_TRUTH_SYNC.md'],
                  'runtime_evidence': [],
                  'source_owners': ['SKILL.md', 'scripts/generate_project_docs.py', 'scripts/validate_project_docs.py', 'scripts/validate_cross_document_consistency.py'],
                  'status': 'NOT_PROVEN',
                  'tests': ['scripts/selftest_cross_document_regressions.py', 'scripts/selftest_project_truth_compiler.py', 'scripts/selftest_strict_project_workflow.py']
              }
          ]
          for claim in new_claims:
              if claim['id'] not in claim_map:
                  claims['claims'].append(claim)
          existing_relations = {(r['claim_id'], r['other_claim_id'], r['relation']) for r in claims.get('relations', [])}
          relations = [
              {
                  'claim_id': 'TRUTH-SW2-DOCS-PUBLIC-IA',
                  'other_claim_id': 'TRUTH-SW-DOCS-DETERMINISTIC',
                  'relation': 'REQUIRES',
                  'notes': 'Public documentation restructuring is valid only if deterministic generated Project Truth remains intact.'
              },
              {
                  'claim_id': 'TRUTH-SW2-DOCS-SEPARATION',
                  'other_claim_id': 'TRUTH-SW-DOCS-DETERMINISTIC',
                  'relation': 'REQUIRES',
                  'notes': 'Separating machine indexes from public guidance must preserve deterministic generation and drift detection.'
              }
          ]
          for relation in relations:
              key = (relation['claim_id'], relation['other_claim_id'], relation['relation'])
              if key not in existing_relations:
                  claims.setdefault('relations', []).append(relation)
          write('.workflow/claims.json', claims)

          old_session_path = Path('docs/sequence/sessions/SW2-03-GOVERNANCE.json')
          old_session = load(old_session_path)
          old_session['scope'] = 'HISTORICAL'
          old_session['status'] = 'COMPLETE'
          write(old_session_path, old_session)

          session = {
              'schema_version': 1,
              'session_id': 'SW2-04-GOVERNANCE',
              'phase': 'SW2-04',
              'mode': 'DURING',
              'scope': 'CURRENT',
              'status': 'IN_PROGRESS',
              'critical': True,
              'implementation_base_sha': '7823dd1b6be1de59c1f28406c050df343a3d1934',
              'evidence_boundary': 'SW2-04 DURING evidence binds the documentation compiler/validation pipeline at phase opening. Static extraction proves source-visible structure only; public information-architecture quality, README concision, machine/public separation, and post-restructure determinism remain NOT_PROVEN until dedicated SW2-04 evidence exists.',
              'plan': {
                  'required': False,
                  'contract': '',
                  'diagram': '',
                  'frozen': False,
                  'frozen_commit': '',
                  'sha256': ''
              },
              'actual': {
                  'graph': 'docs/sequence/generated/SW2-04-GOVERNANCE.actual.json',
                  'diagram': 'docs/sequence/generated/SW2-04-GOVERNANCE.actual.mmd',
                  'entries': [
                      'scripts/generate_project_docs.py::main',
                      'scripts/validate_project_docs.py::main',
                      'scripts/validate_doc_quality.py::main',
                      'scripts/validate_human_comprehension.py::main'
                  ],
                  'source_digest': 'PENDING_GENERATION'
              },
              'human_view': {
                  'graph': 'docs/sequence/generated/SW2-04-GOVERNANCE.human.json',
                  'diagram': 'docs/sequence/generated/SW2-04-GOVERNANCE.human.mmd',
                  'document': 'docs/sequence/views/SW2-04-GOVERNANCE.md',
                  'granularity': 'module',
                  'policy_id': 'module-collapse-v1',
                  'source_digest': 'PENDING_GENERATION'
              },
              'runtime_trace': {'required': False, 'graph': ''},
              'test_traceability_required': True,
              'tests': [
                  'scripts/selftest_sequence_human_view.py',
                  'scripts/selftest_cross_document_regressions.py',
                  'scripts/selftest_project_truth_compiler.py',
                  'scripts/selftest_strict_project_workflow.py'
              ],
              'acceptance_report': 'artifacts/sequence/SW2-04-GOVERNANCE.acceptance.json'
          }
          write('docs/sequence/sessions/SW2-04-GOVERNANCE.json', session)
          print('SW2_03_CLOSED=PASS')
          print('SW2_04_OPEN_FAIL_CLOSED=PASS')
          PY

      - name: Generate SW2-04 opening sequence evidence
        run: >-
          python scripts/generate_sequence_actual.py
          --root .
          --output-json docs/sequence/generated/SW2-04-GOVERNANCE.actual.json
          --output-mermaid docs/sequence/generated/SW2-04-GOVERNANCE.actual.mmd
          --entry scripts/generate_project_docs.py::main
          --entry scripts/validate_project_docs.py::main
          --entry scripts/validate_doc_quality.py::main
          --entry scripts/validate_human_comprehension.py::main

      - name: Generate SW2-04 bounded human projection
        run: >-
          python scripts/sequence_human_view.py
          --root .
          --actual-json docs/sequence/generated/SW2-04-GOVERNANCE.actual.json
          --actual-mermaid docs/sequence/generated/SW2-04-GOVERNANCE.actual.mmd
          --output-json docs/sequence/generated/SW2-04-GOVERNANCE.human.json
          --output-mermaid docs/sequence/generated/SW2-04-GOVERNANCE.human.mmd
          --output-markdown docs/sequence/views/SW2-04-GOVERNANCE.md
          --session-id SW2-04-GOVERNANCE

      - name: Bind SW2-04 source digest and sequence gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          actual_path = Path('docs/sequence/generated/SW2-04-GOVERNANCE.actual.json')
          human_path = Path('docs/sequence/generated/SW2-04-GOVERNANCE.human.json')
          session_path = Path('docs/sequence/sessions/SW2-04-GOVERNANCE.json')
          acceptance_path = Path('.workflow/acceptance.json')

          actual = json.loads(actual_path.read_text(encoding='utf-8'))
          human = json.loads(human_path.read_text(encoding='utf-8'))
          digest = str(actual.get('source_digest', '')).strip()
          assert digest and digest != 'PENDING_GENERATION', actual
          assert human.get('source_digest') == digest, human

          session = json.loads(session_path.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['sequence_sync_status'] = 'PASS'
          acceptance['truth_gates']['SEQUENCE_SYNC'] = 'PASS'
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print(f'SW2_04_SOURCE_DIGEST={digest}')
          PY

      - name: Regenerate deterministic Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-04-GOVERNANCE.json --report artifacts/sequence/SW2-04-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-04-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert SW2-04 remains fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert [r['id'] for r in acceptance['requirements']] == ['SW2-04-R1', 'SW2-04-R2', 'SW2-04-R3', 'SW2-04-R4']
          assert all(r['status'] == 'NOT_PROVEN' for r in acceptance['requirements']), acceptance['requirements']
          assert acceptance['sequence_session'] == 'SW2-04-GOVERNANCE'
          assert acceptance['sequence_sync_status'] == 'PASS'
          assert acceptance['truth_gates']['SEQUENCE_SYNC'] == 'PASS'
          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claim_map = {c['id']: c for c in claims['claims']}
          assert claim_map['TRUTH-SW2-DOCS-PUBLIC-IA']['status'] == 'NOT_PROVEN'
          assert claim_map['TRUTH-SW2-DOCS-SEPARATION']['status'] == 'NOT_PROVEN'
          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          roadmap = json.load(open('.workflow/roadmap.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-04' and state['status'] == 'IN_PROGRESS', state
          assert roadmap['current_phase'] == 'SW2-04', roadmap
          phase_map = {p['id']: p for p in roadmap['phases']}
          assert phase_map['SW2-03']['status'] == 'COMPLETE'
          assert phase_map['SW2-04']['status'] == 'CURRENT'
          old_session = json.load(open('docs/sequence/sessions/SW2-03-GOVERNANCE.json', encoding='utf-8'))
          new_session = json.load(open('docs/sequence/sessions/SW2-04-GOVERNANCE.json', encoding='utf-8'))
          assert old_session['scope'] == 'HISTORICAL' and old_session['status'] == 'COMPLETE'
          assert new_session['scope'] == 'CURRENT' and new_session['status'] == 'IN_PROGRESS'
          print('SW2_04_FAIL_CLOSED_ASSERTIONS=PASS')
          PY

      - name: Commit phase transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo "NO_PHASE_TRANSITION_DIFF"; exit 1; }
          git commit -m "gov: close SW2-03 and open SW2-04 fail-closed"
          git push origin HEAD:work/sw2-03-sequence-v2
