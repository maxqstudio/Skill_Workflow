name: SW2 Final Evidence Regeneration

on:
  push:
    branches:
      - work/sw2-00-baseline-self-governance
    paths:
      - .github/workflows/sw2-final-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/work/sw2-00-baseline-self-governance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate canonical project truth
        run: python scripts/sync_project_truth.py --root .

      - name: Regenerate current SW2 sequence evidence
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py \
            --root . \
            --output-json docs/sequence/generated/SW2-00-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-00-GOVERNANCE.actual.mmd \
            --entry scripts/sync_project_truth.py::main
          python - <<'PY'
          import json
          from pathlib import Path
          graph = json.loads(Path('docs/sequence/generated/SW2-00-GOVERNANCE.actual.json').read_text(encoding='utf-8'))
          path = Path('docs/sequence/sessions/SW2-00-GOVERNANCE.json')
          session = json.loads(path.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = graph['source_digest']
          path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-00-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .

      - name: Validate targeted cross-document regressions
        shell: bash
        run: |
          python scripts/selftest_cross_document_regressions.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit generated evidence only
        shell: bash
        run: |
          git add PROJECT_PROFILE.yaml .workflow/acceptance.json .workflow/generated/code_facts.json docs/*.md docs/sequence/generated/SW2-00-GOVERNANCE.actual.json docs/sequence/generated/SW2-00-GOVERNANCE.actual.mmd docs/sequence/sessions/SW2-00-GOVERNANCE.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "NO_GENERATED_DRIFT"
            exit 0
          fi
          git commit -m "docs(sw2): regenerate final SW2-00 evidence"
          git push origin HEAD:work/sw2-00-baseline-self-governance
