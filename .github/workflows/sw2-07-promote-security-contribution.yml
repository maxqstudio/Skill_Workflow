name: SW2-07 Promote Security Contribution Evidence

on:
  push:
    branches:
      - work/sw2-07-public-project-hardening

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      FEATURE_HEAD: "7d80c427619ccad4bee2fec1545847e1b3ca52ba"
      ACCEPTED_MAIN: "f391fe9dc5d208803118090bbe6a174e8f6c7c63"
      BRANCH: "work/sw2-07-public-project-hardening"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-07-public-project-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact feature lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$FEATURE_HEAD"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          test "$(git diff --name-only "$FEATURE_HEAD"..HEAD)" = ".github/workflows/sw2-07-promote-security-contribution.yml"

      - name: Promote R2 only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          exact = "7d80c427619ccad4bee2fec1545847e1b3ca52ba"
          evidence = (
              "Exact clean candidate 7d80c427619ccad4bee2fec1545847e1b3ca52ba: "
              "Self Governance 37113203365, Governance Selftest 37113203386 on Ubuntu and Windows, "
              "SW2 Sequence Evidence 37113203376, SW2 Engine Performance 37113203374, and "
              "SW2 Consumer Engine Performance 37113203358 all succeeded. Governance Selftest included blocking public-documentation, "
              "repository-health, cross-document, read-only verify, and STRICT regressions on both operating systems."
          )

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))
          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")

          acceptance = load('.workflow/acceptance.json')
          by_id = {item['id']: item for item in acceptance['requirements']}
          assert by_id['SW2-07-R1']['status'] == 'NOT_PROVEN'
          assert by_id['SW2-07-R2']['status'] == 'NOT_PROVEN'
          assert by_id['SW2-07-R3']['status'] == 'NOT_PROVEN'
          assert by_id['SW2-07-R4']['status'] == 'NOT_PROVEN'
          by_id['SW2-07-R2']['status'] = 'PASS'
          by_id['SW2-07-R2']['evidence'] = evidence
          save('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          proof = (
              "SW2-07-R2 security and contribution paths are accepted on exact clean candidate "
              "7d80c427619ccad4bee2fec1545847e1b3ca52ba: CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, "
              "README/handbook navigation, repository-health validation, and permanent cross-platform regression all passed; "
              "Self Governance 37113203365 and Governance Selftest 37113203386 (Ubuntu/Windows) are the primary acceptance evidence."
          )
          if proof not in state['proven']:
              state['proven'].append(proof)
          state['not_proven'] = [
              item for item in state['not_proven']
              if 'security and contribution paths' not in item
          ]
          assert len(state['blockers']) == 2
          save('.workflow/state.json', state)
          PY

      - name: Regenerate deterministic Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Assert promotion remains fail closed
        shell: bash
        run: |
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python - <<'PY'
          import json
          a=json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          status={x['id']:x['status'] for x in a['requirements']}
          assert status == {
              'SW2-07-R1':'NOT_PROVEN',
              'SW2-07-R2':'PASS',
              'SW2-07-R3':'NOT_PROVEN',
              'SW2-07-R4':'NOT_PROVEN',
          }
          print('R2_PROMOTED_R1_R3_R4_BLOCKED=PASS')
          PY

      - name: Commit promotion locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs
          git diff --cached --quiet && { echo "FAIL NO_PROMOTION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-07): accept security and contribution paths"

      - name: Validate clean committed promotion read only
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base "$ACCEPTED_MAIN" --mode verify --expected-head "$expected"
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated promotion
        shell: bash
        run: git push origin HEAD:"$BRANCH"
