name: TEMP SW2-21 Phase Open V3

on:
  push:
    branches:
      - work/sw2-21-closure-defect-lifecycle
    paths:
      - .github/workflows/tmp-sw2-21-phase-open-v3.yml

permissions:
  contents: write

jobs:
  phase-open:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-21-closure-defect-lifecycle
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply SW2-21 authority transition
        run: python artifacts/tmp/sw2_21_phase_open.py

      - name: Generate initial SW2-21 projection and create local freeze anchor
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-21-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd += ['--entry', entry]
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([sys.executable, 'scripts/sequence_human_view.py', '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'], '--output-json', human['graph'], '--output-mermaid', human['diagram'], '--output-markdown', human['document'], '--session-id', session['session_id']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.', '--session', session_path.as_posix(), '--report', session['acceptance_report']], check=True)
          PY
          python scripts/sync_project_truth.py --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs artifacts/sequence
          git commit -m 'SW2-21: establish historical freeze anchor'
          echo "FREEZE_ANCHOR=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Freeze newly historical SW2-20 evidence at local anchor
        shell: bash
        run: |
          python scripts/validate_sequence_sessions.py \
            --root . \
            --freeze-historical \
            --frozen-commit "$FREEZE_ANCHOR" \
            --authorize-migration 'SW2-21 phase-open freezes accepted SW2-20 evidence after exact main acceptance'

      - name: Remove transient helpers from local acceptance tree
        shell: bash
        run: |
          git rm .github/workflows/tmp-sw2-21-phase-open.yml
          git rm .github/workflows/tmp-sw2-21-phase-open-v2.yml
          git rm .github/workflows/tmp-sw2-21-phase-open-v3.yml
          git rm artifacts/tmp/sw2_21_phase_open.py

      - name: Regenerate helper-free current sequence and Project Truth
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-21-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd += ['--entry', entry]
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([sys.executable, 'scripts/sequence_human_view.py', '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'], '--output-json', human['graph'], '--output-mermaid', human['diagram'], '--output-markdown', human['document'], '--session-id', session['session_id']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.', '--session', session_path.as_posix(), '--report', session['acceptance_report']], check=True)
          PY
          python scripts/sync_project_truth.py --root .
          python scripts/validate_documentation_contract.py --root . --write-report

      - name: Validate exact helper-free phase-open tree
        shell: bash
        run: |
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_repository_health.py --root .

      - name: Commit final phase-open authority without workflow mutation
        shell: bash
        run: |
          git add -A
          git restore --staged \
            .github/workflows/tmp-sw2-21-phase-open.yml \
            .github/workflows/tmp-sw2-21-phase-open-v2.yml \
            .github/workflows/tmp-sw2-21-phase-open-v3.yml || true
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Temporary workflow unexpectedly staged'
            exit 1
          fi
          git commit -m 'SW2-21: complete governed phase-open evidence'
          git push origin HEAD:work/sw2-21-closure-defect-lifecycle
