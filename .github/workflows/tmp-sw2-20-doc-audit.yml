name: TEMP SW2-20 Documentation Audit

on:
  push:
    branches:
      - work/sw2-20-documentation-inventory-freshness
    paths:
      - .github/workflows/tmp-sw2-20-doc-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-20-documentation-inventory-freshness
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Strengthen documentation contract and permanent public-doc gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('scripts/validate_documentation_contract.py')
          text = contract.read_text(encoding='utf-8')
          old = '''LICENSE_NEGATIVE_RE = re.compile(\n    r"(?i)(?:no\\s+(?:owner-approved\\s+)?(?:public\\s+)?license|"\n    r"(?:public\\s+)?license\\s+(?:has\\s+)?not\\s+(?:yet\\s+)?been\\s+(?:selected|approved)|"\n    r"license\\s+choice\\s+(?:is\\s+)?(?:pending|not\\s+approved))"\n)'''
          new = '''LICENSE_NEGATIVE_RE = re.compile(\n    r"(?i)(?:(?:this\\s+repository\\s+)?does\\s+not\\s+currently\\s+declare\\s+an?\\s+owner-approved\\s+(?:public\\s+)?license|"\n    r"no\\s+(?:owner-approved\\s+)?(?:public\\s+)?license|"\n    r"(?:public\\s+)?license\\s+(?:has\\s+)?not\\s+(?:yet\\s+)?been\\s+(?:selected|approved)|"\n    r"license\\s+choice\\s+(?:is\\s+)?(?:pending|not\\s+approved))"\n)'''
          if text.count(old) != 1:
              raise RuntimeError('LICENSE_NEGATIVE_RE_ANCHOR')
          contract.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('scripts/selftest_documentation_contract.py')
          text = test.read_text(encoding='utf-8')
          old = '''            ("CONTRIBUTING.md", "# Contributing\\n\\nThe public license has not yet been selected.\\n", "STALE_LICENSE_STATE"),\n        )'''
          new = '''            ("CONTRIBUTING.md", "# Contributing\\n\\nThe public license has not yet been selected.\\n", "STALE_LICENSE_STATE"),\n            ("CONTRIBUTING.md", "# Contributing\\n\\nThis repository does not currently declare an Owner-approved public license.\\n", "STALE_LICENSE_STATE"),\n        )'''
          if text.count(old) != 1:
              raise RuntimeError('DOCUMENTATION_SELFTEST_LICENSE_CASE_ANCHOR')
          text = text.replace(old, new, 1).replace(
              'DOCUMENTATION_STALE_SEMANTICS=PASS cases=6',
              'DOCUMENTATION_STALE_SEMANTICS=PASS cases=7',
              1,
          )
          test.write_text(text, encoding='utf-8', newline='\n')

          public = Path('scripts/validate_public_docs.py')
          text = public.read_text(encoding='utf-8')
          import_anchor = 'from pathlib import Path\n\nfrom validate_doc_quality import GENERATED_MARKER, normalized_shape\n'
          import_replacement = 'from pathlib import Path\n\nimport validate_documentation_contract as documentation_contract\nfrom validate_doc_quality import GENERATED_MARKER, normalized_shape\n'
          if text.count(import_anchor) != 1:
              raise RuntimeError('PUBLIC_DOC_IMPORT_ANCHOR')
          text = text.replace(import_anchor, import_replacement, 1)
          return_anchor = '''    return {\n        "schema_version": 1,'''
          integration = '''    documentation_contract_status = "NOT_APPLICABLE"\n    if (root / ".git").exists():\n        documentation_report = documentation_contract.build_report(root)\n        documentation_contract_status = str(documentation_report.get("result", "FAIL"))\n        expected_coverage = documentation_contract.report_text(documentation_report)\n        coverage_path = root / documentation_contract.REPORT_PATH\n        if not coverage_path.is_file():\n            failures.append("DOCUMENTATION_COVERAGE_REPORT_MISSING:" + documentation_contract.REPORT_PATH)\n        else:\n            try:\n                actual_coverage = coverage_path.read_text(encoding="utf-8", errors="strict")\n            except Exception as exc:\n                failures.append("DOCUMENTATION_COVERAGE_REPORT_READ_FAILURE:" + type(exc).__name__)\n            else:\n                if actual_coverage != expected_coverage:\n                    failures.append("DOCUMENTATION_COVERAGE_REPORT_STALE:" + documentation_contract.REPORT_PATH)\n        for finding in documentation_report.get("freshness_failures", []):\n            if not isinstance(finding, dict):\n                continue\n            failures.append(\n                "DOCUMENTATION_FRESHNESS:"\n                + str(finding.get("kind", "UNKNOWN"))\n                + ":"\n                + str(finding.get("path", "UNKNOWN"))\n                + ":"\n                + str(finding.get("line", 0))\n            )\n\n    return {\n        "schema_version": 1,'''
          if text.count(return_anchor) != 1:
              raise RuntimeError('PUBLIC_DOC_RETURN_ANCHOR')
          text = text.replace(return_anchor, integration, 1)
          result_anchor = '        "canonical_consumer_layout_changed": False,\n        "failures": failures,\n'
          result_replacement = '        "canonical_consumer_layout_changed": False,\n        "documentation_contract": documentation_contract_status,\n        "failures": failures,\n'
          if text.count(result_anchor) != 1:
              raise RuntimeError('PUBLIC_DOC_RESULT_ANCHOR')
          text = text.replace(result_anchor, result_replacement, 1)
          evidence_old = '''            "This gate proves public documentation structure, navigation, source-authored/generated-layer separation, "\n            "required migration/rollback guidance, and obvious README reference-manual regressions. It does not by itself "\n            "prove that an operational rollback has been executed against an external consumer."'''
          evidence_new = '''            "This gate proves public documentation structure, navigation, source-authored/generated-layer separation, "\n            "deterministic tracked-document coverage/freshness, required migration/rollback guidance, and obvious README "\n            "reference-manual regressions. It does not by itself prove that an operational rollback has been executed "\n            "against an external consumer."'''
          if text.count(evidence_old) != 1:
              raise RuntimeError('PUBLIC_DOC_EVIDENCE_ANCHOR')
          public.write_text(text.replace(evidence_old, evidence_new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Remove helper from local acceptance tree
        shell: bash
        run: git rm .github/workflows/tmp-sw2-20-doc-audit.yml

      - name: Run documentation contract regressions
        run: |
          python -m compileall -q scripts
          python scripts/selftest_public_docs.py

      - name: Generate and verify documentation coverage
        run: |
          python scripts/validate_documentation_contract.py --root . --write-report
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_public_docs.py --root .

      - name: Regenerate current SW2-20 sequence evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          acceptance = json.loads((root / '.workflow/acceptance.json').read_text(encoding='utf-8'))
          session_id = str(acceptance['sequence_session'])
          session_path = root / 'docs/sequence/sessions' / f'{session_id}.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
              '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session_id,
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report'],
          ], check=True)
          PY

      - name: Regenerate Project Truth and validate helper-free tree
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_documentation_contract.py --root . --write-report
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_repository_health.py --root .

      - name: Commit governed SW2-20 documentation contract
        shell: bash
        run: |
          git restore --staged .github/workflows/tmp-sw2-20-doc-audit.yml
          git add scripts .workflow docs artifacts/sequence
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Temporary workflow unexpectedly staged'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SW2-20: enforce documentation inventory and freshness'
          git push origin HEAD:work/sw2-20-documentation-inventory-freshness

      - name: Upload documentation coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw2-20-documentation-coverage
          path: .workflow/generated/documentation_coverage.json
          if-no-files-found: error
          retention-days: 14
