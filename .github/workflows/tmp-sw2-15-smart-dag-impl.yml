name: TEMP SW2-15 Smart DAG Implementation

on:
  push:
    branches:
      - work/sw2-15-smart-validation-dag
    paths:
      - .github/workflows/tmp-sw2-15-smart-dag-impl.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Smart Validation DAG implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('scripts/governance_engine.py')
          text = engine_path.read_text(encoding='utf-8')

          anchor = '''FINALIZE_NODE_NAMES = (\n    "compile_scripts",\n    "engine_regression",\n    "sequence_regression",\n    "cross_document_regression",\n    "compiler_selftest",\n    "strict_workflow_selftest",\n    "sync_project_truth",\n    "validate_human_comprehension",\n    "validate_sequence_sessions",\n    "validate_handoff",\n    "validate_cross_document_consistency",\n    "validate_project_truth",\n    "governed_state_clean",\n)\n\n\n'''
          addition = '''DEVELOP_NODE_ORDER = (\n    "compile_scripts",\n    "engine_regression",\n    "sequence_regression",\n    "cross_document_regression",\n    "compiler_selftest",\n    "sync_project_truth",\n    "validate_project_docs",\n    "validate_cross_document_consistency",\n    "impact_only",\n)\nDEVELOP_DEPENDENCIES: dict[str, tuple[str, ...]] = {\n    "compile_scripts": (),\n    "engine_regression": ("compile_scripts",),\n    "sequence_regression": ("compile_scripts",),\n    "cross_document_regression": ("compile_scripts",),\n    "compiler_selftest": ("compile_scripts",),\n    "sync_project_truth": (),\n    "validate_project_docs": (),\n    "validate_cross_document_consistency": ("sync_project_truth",),\n    "impact_only": (),\n}\nVERIFY_NODE_ORDER = VERIFY_NODE_NAMES + ("impact_only",)\nVERIFY_DEPENDENCIES: dict[str, tuple[str, ...]] = {\n    "compile_scripts": (),\n    "engine_regression": ("compile_scripts",),\n    "sequence_regression": ("compile_scripts",),\n    "cross_document_regression": ("compile_scripts",),\n    "compiler_selftest": ("compile_scripts",),\n    "validate_project_docs": (),\n    "validate_human_comprehension": ("validate_project_docs",),\n    "validate_sequence_sessions": (),\n    "validate_handoff": ("validate_project_docs",),\n    "validate_cross_document_consistency": (\n        "validate_human_comprehension",\n        "validate_handoff",\n    ),\n    "impact_only": (),\n}\nVERIFY_BROAD_IMPACTS = frozenset({"broad_source", "template", "ci"})\nVERIFY_IMPACT_NODE_SEEDS: dict[str, tuple[str, ...]] = {\n    "engine": ("engine_regression", "validate_cross_document_consistency"),\n    "sequence": (\n        "sequence_regression",\n        "validate_sequence_sessions",\n        "validate_cross_document_consistency",\n    ),\n    "compiler": ("compiler_selftest", "validate_cross_document_consistency"),\n    "cross_document": (\n        "cross_document_regression",\n        "validate_cross_document_consistency",\n    ),\n    "governance": (\n        "validate_sequence_sessions",\n        "validate_cross_document_consistency",\n    ),\n    "documentation": ("validate_cross_document_consistency",),\n    "source": (\n        "validate_sequence_sessions",\n        "validate_cross_document_consistency",\n    ),\n    "benchmark": (),\n}\n\n\ndef dependency_closure(\n    seed_names: tuple[str, ...] | list[str],\n    dependencies: dict[str, tuple[str, ...]],\n    order: tuple[str, ...],\n) -> tuple[str, ...]:\n    selected: set[str] = set()\n    visiting: set[str] = set()\n\n    def visit(name: str) -> None:\n        if name in selected:\n            return\n        if name in visiting:\n            raise ValueError(f"PLANNER_DAG_CYCLE:{name}")\n        if name not in dependencies:\n            raise ValueError(f"UNKNOWN_PLANNER_NODE:{name}")\n        visiting.add(name)\n        for dependency in dependencies[name]:\n            if dependency not in dependencies:\n                raise ValueError(f"UNKNOWN_PLANNER_DEPENDENCY:{name}:{dependency}")\n            visit(dependency)\n        visiting.remove(name)\n        selected.add(name)\n\n    for seed in seed_names:\n        visit(seed)\n\n    missing_order = selected.difference(order)\n    if missing_order:\n        raise ValueError("PLANNER_ORDER_MISSING:" + ",".join(sorted(missing_order)))\n    return tuple(name for name in order if name in selected)\n\n\ndef verify_seed_node_names(\n    paths: tuple[str, ...] | list[str],\n    impacts: tuple[str, ...],\n) -> tuple[str, ...]:\n    impact_set = set(impacts)\n    if impact_set.intersection(VERIFY_BROAD_IMPACTS):\n        return VERIFY_NODE_NAMES\n    if "unknown" in impact_set:\n        raise ValueError("VERIFY_UNKNOWN_IMPACT_REQUIRES_FINALIZE")\n\n    seeds: set[str] = set()\n    handled = set(VERIFY_IMPACT_NODE_SEEDS) | {"targeted_test"}\n    unhandled = impact_set.difference(handled)\n    if unhandled:\n        raise ValueError("UNMAPPED_VERIFY_IMPACT:" + ",".join(sorted(unhandled)))\n\n    for impact in sorted(impact_set):\n        seeds.update(VERIFY_IMPACT_NODE_SEEDS.get(impact, ()))\n\n    if "targeted_test" in impact_set:\n        mapped = {\n            node_name\n            for path, node_name in DEVELOP_TEST_MAP.items()\n            if path in set(paths)\n        }\n        if not mapped:\n            raise ValueError("TARGETED_TEST_WITHOUT_VERIFY_NODE")\n        seeds.update(mapped)\n        seeds.add("validate_cross_document_consistency")\n\n    if not seeds:\n        seeds.add("impact_only")\n    return tuple(name for name in VERIFY_NODE_ORDER if name in seeds)\n\n\ndef verify_node_names(\n    paths: tuple[str, ...] | list[str],\n    impacts: tuple[str, ...],\n) -> tuple[str, ...]:\n    seeds = verify_seed_node_names(paths, impacts)\n    return dependency_closure(seeds, VERIFY_DEPENDENCIES, VERIFY_NODE_ORDER)\n\n\n'''
          if text.count(anchor) != 1:
              raise RuntimeError('ENGINE_CONSTANT_ANCHOR')
          text = text.replace(anchor, anchor + addition, 1)

          old_develop = '''    ordered = [\n        name\n        for name in (\n            "compile_scripts",\n            "engine_regression",\n            "sequence_regression",\n            "cross_document_regression",\n            "compiler_selftest",\n            "sync_project_truth",\n            "validate_project_docs",\n            "validate_cross_document_consistency",\n            "impact_only",\n        )\n        if name in names\n    ]\n    return tuple(ordered)\n'''
          new_develop = '''    ordered = [name for name in DEVELOP_NODE_ORDER if name in names]\n    return dependency_closure(\n        tuple(ordered),\n        DEVELOP_DEPENDENCIES,\n        DEVELOP_NODE_ORDER,\n    )\n'''
          if text.count(old_develop) != 1:
              raise RuntimeError('DEVELOP_PLANNER_ANCHOR')
          text = text.replace(old_develop, new_develop, 1)

          old_planned = '''    if effective == "finalize":\n        return FINALIZE_NODE_NAMES\n    if effective == "verify":\n        return VERIFY_NODE_NAMES\n    return develop_node_names(paths, impacts)\n'''
          new_planned = '''    if effective == "finalize":\n        return FINALIZE_NODE_NAMES\n    if effective == "verify":\n        return verify_node_names(paths, impacts)\n    return develop_node_names(paths, impacts)\n'''
          if text.count(old_planned) != 1:
              raise RuntimeError('PLANNED_NODES_ANCHOR')
          engine_path.write_text(text.replace(old_planned, new_planned, 1), encoding='utf-8', newline='\n')

          test_path = Path('scripts/selftest_governance_engine.py')
          tests = test_path.read_text(encoding='utf-8')
          old_import = '''    classify_changed_paths,\n    collect_changed_paths,\n    develop_node_names,\n'''
          new_import = '''    classify_changed_paths,\n    collect_changed_paths,\n    dependency_closure,\n    develop_node_names,\n'''
          if tests.count(old_import) != 1:
              raise RuntimeError('SELFTEST_IMPORT_ANCHOR')
          tests = tests.replace(old_import, new_import, 1)

          insertion_anchor = '''def changed_path_collection_contract() -> None:\n'''
          smart_test = '''def smart_validation_dag_contract() -> None:\n    sequence_paths = ("docs/sequence/sessions/SW2-15-GOVERNANCE.json",)\n    sequence_impacts = classify_changed_paths(sequence_paths)\n    sequence_develop = planned_node_names(\n        "develop", "develop", sequence_paths, sequence_impacts\n    )\n    require(\n        sequence_develop == ("compile_scripts", "sequence_regression"),\n        f"develop prerequisite closure drifted: {sequence_develop}",\n    )\n    print("SMART_DEVELOP_IMPACT_SELECTION=PASS")\n\n    doc_paths = ("references/governance-and-project-truth.md",)\n    doc_impacts = classify_changed_paths(doc_paths)\n    doc_verify = planned_node_names("verify", "verify", doc_paths, doc_impacts)\n    expected_doc_verify = {\n        "validate_project_docs",\n        "validate_human_comprehension",\n        "validate_handoff",\n        "validate_cross_document_consistency",\n    }\n    require(\n        set(doc_verify) == expected_doc_verify,\n        f"verify documentation closure drifted: {doc_verify}",\n    )\n    require(\n        set(doc_verify).isdisjoint(\n            {\n                "engine_regression",\n                "sequence_regression",\n                "cross_document_regression",\n                "compiler_selftest",\n            }\n        ),\n        f"verify retained unrelated regressions: {doc_verify}",\n    )\n\n    engine_paths = ("scripts/governance_engine.py",)\n    engine_impacts = classify_changed_paths(engine_paths)\n    engine_verify = set(\n        planned_node_names("verify", "verify", engine_paths, engine_impacts)\n    )\n    require(\n        {\n            "compile_scripts",\n            "engine_regression",\n            "validate_project_docs",\n            "validate_human_comprehension",\n            "validate_handoff",\n            "validate_cross_document_consistency",\n        }.issubset(engine_verify),\n        f"engine verify closure incomplete: {engine_verify}",\n    )\n\n    source_paths = ("src/example.py",)\n    source_impacts = classify_changed_paths(source_paths)\n    source_verify = set(\n        planned_node_names("verify", "verify", source_paths, source_impacts)\n    )\n    require(\n        {\n            "validate_project_docs",\n            "validate_human_comprehension",\n            "validate_sequence_sessions",\n            "validate_handoff",\n            "validate_cross_document_consistency",\n        }.issubset(source_verify),\n        f"source verify closure incomplete: {source_verify}",\n    )\n    require(\n        len(doc_verify) < len(VERIFY_NODE_NAMES),\n        "smart verify did not reduce known documentation work",\n    )\n    print("SMART_VERIFY_DEPENDENCY_CLOSURE=PASS")\n\n    broad_paths = ("scripts/new_future_validator.py",)\n    broad_impacts = classify_changed_paths(broad_paths)\n    broad_verify = planned_node_names("develop", "verify", broad_paths, broad_impacts)\n    require(\n        broad_verify == VERIFY_NODE_NAMES,\n        f"broad impact was narrowed unsafely: {broad_verify}",\n    )\n\n    adversarial = (\n        (\n            ("child",),\n            {"child": ("missing",)},\n            ("child",),\n            "UNKNOWN_PLANNER_DEPENDENCY",\n        ),\n        (\n            ("a",),\n            {"a": ("b",), "b": ("a",)},\n            ("a", "b"),\n            "PLANNER_DAG_CYCLE",\n        ),\n        (\n            ("ghost",),\n            {"known": ()},\n            ("known",),\n            "UNKNOWN_PLANNER_NODE",\n        ),\n    )\n    for seeds, dependencies, order, marker_text in adversarial:\n        try:\n            dependency_closure(seeds, dependencies, order)\n        except ValueError as exc:\n            require(marker_text in str(exc), f"wrong planner failure: {exc}")\n        else:\n            raise AssertionError(marker_text + " did not fail closed")\n    print("SMART_PLANNER_FAIL_CLOSED=PASS")\n\n    finalize_nodes = planned_node_names(\n        "finalize",\n        "finalize",\n        ("scripts/governance_engine.py",),\n        ("engine",),\n    )\n    require(\n        finalize_nodes == FINALIZE_NODE_NAMES,\n        f"finalize authoritative DAG was narrowed: {finalize_nodes}",\n    )\n    print("SMART_FINALIZE_EXHAUSTIVE=PASS")\n\n\n'''
          if tests.count(insertion_anchor) != 1:
              raise RuntimeError('SMART_TEST_INSERTION_ANCHOR')
          tests = tests.replace(insertion_anchor, smart_test + insertion_anchor, 1)

          old_main = '''    mode_planning_contract()\n    changed_path_collection_contract()\n'''
          new_main = '''    mode_planning_contract()\n    smart_validation_dag_contract()\n    changed_path_collection_contract()\n'''
          if tests.count(old_main) != 1:
              raise RuntimeError('SELFTEST_MAIN_ANCHOR')
          test_path.write_text(tests.replace(old_main, new_main, 1), encoding='utf-8', newline='\n')
          PY

      - name: Run focused Smart DAG regressions
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py

      - name: Remove helper locally and regenerate governed evidence
        shell: bash
        run: |
          rm -f .github/workflows/tmp-sw2-15-smart-dag-impl.yml
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          session_path = root / 'docs/sequence/sessions/SW2-15-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd += ['--entry', entry]
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
              '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session['session_id'],
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', str(session_path.relative_to(root)),
          ], check=True)
          PY
          python scripts/sync_project_truth.py --root .

      - name: Prove helper-free candidate
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python scripts/selftest_governance_engine.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base 71c0269a5f2cf7fc98cf05e79c5c9494a32dfae4 --mode verify --expected-head "$HEAD_SHA" --report /tmp/sw2-15-verify.json
          test ! -e .github/workflows/tmp-sw2-15-smart-dag-impl.yml

      - name: Commit implementation without workflow mutation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/governance_engine.py scripts/selftest_governance_engine.py .workflow docs artifacts/sequence
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'SW2-15: implement Smart Validation DAG'
          git push origin HEAD:work/sw2-15-smart-validation-dag
