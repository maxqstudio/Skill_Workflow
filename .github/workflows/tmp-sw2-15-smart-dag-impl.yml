name: TEMP SW2-15 Smart DAG Implementation

on:
  push:
    branches:
      - work/sw2-15-smart-validation-dag
    paths:
      - .github/workflows/tmp-sw2-15-smart-dag-impl.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Smart Validation DAG patch
        shell: bash
        run: python .github/tmp-sw2-15-smart-dag-patch.py

      - name: Focused Smart DAG regression
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py

      - name: Remove helpers before authoritative regeneration
        shell: bash
        run: |
          cp .github/tmp-sw2-15-sequence-regen.py "$RUNNER_TEMP/sw2-15-sequence-regen.py"
          rm -f \
            .github/workflows/tmp-sw2-15-smart-dag-impl.yml \
            .github/tmp-sw2-15-smart-dag-patch.py \
            .github/tmp-sw2-15-sequence-regen.py
          test ! -e .github/workflows/tmp-sw2-15-smart-dag-impl.yml
          test ! -e .github/tmp-sw2-15-smart-dag-patch.py
          test ! -e .github/tmp-sw2-15-sequence-regen.py

      - name: Regenerate helper-free Project Truth and current sequence
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python "$RUNNER_TEMP/sw2-15-sequence-regen.py"

      - name: Create local helper-free proof commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SW2-15: local helper-free proof candidate'
          echo "PROOF_PARENT=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          echo "PROOF_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "HELPER_FREE_PROOF_COMMIT=$(git rev-parse HEAD)"
          echo "HELPER_FREE_PROOF_TREE=$(git rev-parse HEAD^{tree})"

      - name: Validate exact clean helper-free proof commit
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base 71c0269a5f2cf7fc98cf05e79c5c9494a32dfae4 --require-base
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          test ! -e .github/workflows/tmp-sw2-15-smart-dag-impl.yml
          test ! -e .github/tmp-sw2-15-smart-dag-patch.py
          test ! -e .github/tmp-sw2-15-sequence-regen.py
          echo "HELPER_FREE_PROOF_VALIDATION=PASS"
          echo "HELPER_FREE_PROOF_TREE=$PROOF_TREE"

      - name: Rebuild transport commit without helper mutations
        shell: bash
        run: |
          git reset --mixed "$PROOF_PARENT"
          git checkout "$PROOF_PARENT" -- \
            .github/workflows/tmp-sw2-15-smart-dag-impl.yml \
            .github/tmp-sw2-15-smart-dag-patch.py \
            .github/tmp-sw2-15-sequence-regen.py
          git add -A
          test -z "$(git diff --cached --name-only | grep -E 'tmp-sw2-15-(smart-dag|sequence)' || true)"
          git diff --cached --quiet && { echo 'NO_IMPLEMENTATION_DIFF'; exit 1; }
          git commit -m 'SW2-15: implement Smart Validation DAG planner'
          git push origin HEAD:work/sw2-15-smart-validation-dag
          echo "TRANSPORT_COMMIT=$(git rev-parse HEAD)"
          echo "TARGET_HELPER_FREE_TREE=$PROOF_TREE"
