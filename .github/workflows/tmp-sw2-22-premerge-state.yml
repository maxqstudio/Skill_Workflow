name: tmp-sw2-22-premerge-state

on:
  push:
    branches:
      - work/sw2-22-consumer-toolchain-provenance-upgrade

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-22-consumer-toolchain-provenance-upgrade
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Repair pre-merge lifecycle semantics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.workflow/state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          expected = 'SW2_22_R1_R4_ACCEPTED_PENDING_FINAL_CANDIDATE'
          if state.get('status') != expected:
              raise SystemExit('UNEXPECTED_STATE_STATUS:' + str(state.get('status')))
          state['status'] = 'SW2_22_R1_R4_PROVEN_PENDING_FINAL_CANDIDATE'
          path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/sync_project_truth.py --root .
          git add .workflow docs
          git diff --cached --quiet && { echo 'NO_REPAIR_CHANGES'; exit 1; }
          git commit -m 'SW2-22: preserve pre-merge lifecycle semantics'
          python scripts/validate_closure_defect_lifecycle.py --root . --expected-base 65c28fcdfebec68a20adc02ae95406f9261d5a51
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_project_docs.py --root .
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs artifacts/sequence scripts references)"
          git push origin HEAD:work/sw2-22-consumer-toolchain-provenance-upgrade
