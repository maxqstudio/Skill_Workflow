name: tmp-sw2-25-package-proof
on:
  push:
    branches:
      - work/sw2-25-reproducible-release-bundle
permissions:
  contents: read
jobs:
  check-package:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-25-reproducible-release-bundle
          fetch-depth: 0
      - name: Run adversarial package unit and clone parity tests
        run: python .github/scripts/selftest_release_bundle.py
      - name: Build real product and prove detached offline verification
        shell: bash
        run: |
          python .github/scripts/release_bundle.py build \
            --root . --expected-head "$(git rev-parse HEAD)" \
            --bundle "$RUNNER_TEMP/skill-workflow.zip" \
            --manifest "$RUNNER_TEMP/skill-workflow.json"
          python .github/scripts/release_bundle.py verify \
            --bundle "$RUNNER_TEMP/skill-workflow.zip" \
            --manifest "$RUNNER_TEMP/skill-workflow.json"
          test -z "$(git status --porcelain --untracked-files=all)"
