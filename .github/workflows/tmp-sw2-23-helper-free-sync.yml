name: tmp-sw2-23-helper-free-sync
on:
  push:
    branches:
      - work/sw2-23-multi-consumer-adoption
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-23-multi-consumer-adoption
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Regenerate current source digest and Project Truth
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          root=Path(".")
          path=root/"docs/sequence/sessions/SW2-23-GOVERNANCE.json"
          data=json.loads(path.read_text(encoding="utf-8"))
          assert data["scope"]=="CURRENT" and data["phase"]=="SW2-23"
          actual=data["actual"]
          command=[sys.executable,"scripts/generate_sequence_actual.py","--root",".","--output-json",actual["graph"],"--output-mermaid",actual["diagram"]]
          for entry in actual["entries"]:
              command.extend(["--entry",entry])
          subprocess.run(command,check=True)
          human=data["human_view"]
          subprocess.run([sys.executable,"scripts/sequence_human_view.py","--root",".",
              "--actual-json",actual["graph"],"--actual-mermaid",actual["diagram"],
              "--output-json",human["graph"],"--output-mermaid",human["diagram"],
              "--output-markdown",human["document"],"--session-id",data["session_id"]],check=True)
          source_digest=json.loads((root/actual["graph"]).read_text(encoding="utf-8"))["source_digest"]
          data["actual"]["source_digest"]=source_digest
          data["human_view"]["source_digest"]=source_digest
          path.write_text(json.dumps(data,indent=2,sort_keys=True)+"\n",encoding="utf-8",newline="\n")
          PY
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-23-GOVERNANCE.json --report artifacts/sequence/SW2-23-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-23-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/sync_project_truth.py --root .
          git add .workflow docs artifacts/sequence
          python scripts/validate_documentation_contract.py --root . --write-report
          git add .workflow/generated/documentation_coverage.json
          git diff --cached --quiet || git commit -m "SW2-23: synchronize helper-free source digest and consumer sequence"
          python scripts/selftest_documentation_contract.py
          python scripts/selftest_consumer_compatibility_matrix.py
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-23-GOVERNANCE.json --no-write-report
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_project_docs.py --root .
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs artifacts/sequence scripts)"
          git push origin HEAD:work/sw2-23-multi-consumer-adoption
