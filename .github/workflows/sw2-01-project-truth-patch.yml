name: SW2-01 Final Validator Patch

on:
  push:
    branches:
      - work/sw2-01-governance-engine-v2
    paths:
      - .github/workflows/sw2-01-project-truth-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch final validator without weakening standalone behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_project_truth.py')
          text = path.read_text(encoding='utf-8')

          anchor = 'from pathlib import Path\n\nfrom project_profile import ('
          replacement = 'from pathlib import Path\n\nimport validate_project_docs\nfrom project_profile import ('
          if text.count(anchor) != 1:
              raise SystemExit('IMPORT_ANCHOR_MISMATCH')
          text = text.replace(anchor, replacement, 1)

          anchor = '    validate_profile,\n)\n\nREQUIRED_GATES = ['
          replacement = '    validate_profile,\n)\nfrom script_runner import invoke_main\n\nREQUIRED_GATES = ['
          if text.count(anchor) != 1:
              raise SystemExit('RUNNER_IMPORT_ANCHOR_MISMATCH')
          text = text.replace(anchor, replacement, 1)

          anchor = '    ap.add_argument("--allow-dirty", action="store_true")\n'
          replacement = anchor + '    ap.add_argument("--project-docs-already-validated", action="store_true")\n'
          if text.count(anchor) != 1:
              raise SystemExit('ARG_ANCHOR_MISMATCH')
          text = text.replace(anchor, replacement, 1)

          old = '''    if documentation_policy.get("generated", False):\n        tool_dir = Path(__file__).resolve().parent\n        project_docs_validator = tool_dir / "validate_project_docs.py"\n        if not project_docs_validator.is_file():\n            project_docs_validator = root / "scripts" / "validate_project_docs.py"\n        if not project_docs_validator.is_file():\n            failures.append("PROJECT_DOCS_VALIDATOR_MISSING")\n        else:\n            proc = subprocess.run(\n                [\n                    sys.executable,\n                    str(project_docs_validator),\n                    "--root",\n                    str(root),\n                ],\n                cwd=root,\n                text=True,\n                stdout=subprocess.PIPE,\n                stderr=subprocess.STDOUT,\n                check=False,\n            )\n            if proc.returncode != 0:\n                failures.append("PROJECT_DOCS_COMPILER_VALIDATION_FAILED")\n'''
          new = '''    if documentation_policy.get("generated", False) and not args.project_docs_already_validated:\n        code, _ = invoke_main(\n            validate_project_docs.main,\n            ["--root", str(root)],\n            program="validate_project_docs.py",\n        )\n        if code != 0:\n            failures.append("PROJECT_DOCS_COMPILER_VALIDATION_FAILED")\n'''
          if text.count(old) != 1:
              raise SystemExit('VALIDATOR_BLOCK_ANCHOR_MISMATCH')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          git diff --check
          git add scripts/validate_project_truth.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(sw2): reuse DAG project-doc evidence in final validator"
          git push origin HEAD:work/sw2-01-governance-engine-v2
