name: SW2-02 Classifier Repair

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply classifier repair
        run: python .github/sw2-02-classifier-repair.txt
      - name: Run targeted regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/selftest_governance_engine.py
      - name: Commit source and regression
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/governance_engine.py scripts/selftest_governance_engine.py
          git diff --cached --quiet && { echo "NO_REPAIR_DIFF"; exit 0; }
          git commit -m "fix(sw2): classify governance support paths"
          git push origin HEAD:work/sw2-02-fast-development-workflow
