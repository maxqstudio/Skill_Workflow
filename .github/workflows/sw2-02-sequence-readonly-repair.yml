name: SW2-02 Sequence Readonly Repair

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply sequence read-only repair
        run: python .github/sw2-02-sequence-readonly-repair.txt
      - name: Run targeted read-only regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          python scripts/validate_sequence_contract.py --help | grep -- --no-write-report
          before="$(git status --porcelain --untracked-files=all -- artifacts/sequence scripts)"
          python scripts/validate_sequence_sessions.py --root . > /tmp/sequence-validation.log 2>&1 || true
          after="$(git status --porcelain --untracked-files=all -- artifacts/sequence scripts)"
          cat /tmp/sequence-validation.log
          test "$before" = "$after"
          echo "SEQUENCE_AGGREGATE_READ_ONLY=PASS"
      - name: Commit source repair only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_sequence_contract.py scripts/validate_sequence_sessions.py
          git diff --cached --quiet && { echo "NO_REPAIR_DIFF"; exit 0; }
          git commit -m "fix(sw2): keep aggregate sequence validation read-only"
          git push origin HEAD:work/sw2-02-fast-development-workflow
