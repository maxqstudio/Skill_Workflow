name: SW2-17 Closure Transaction

on:
  push:
    branches:
      - work/sw2-17-generator-modularization
    paths:
      - .github/workflows/sw2-17-closure-transaction.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-17-generator-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact final SW2-17 acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          CANDIDATE = '7404d52d38eedbbe87d489843136869901200f10'
          SELF_GOV = '37310155298'
          SELFTEST = '37310155333'
          SEQUENCE = '37310155297'
          ENGINE = '37310155394'
          CONSUMER = '37310155307'

          path = Path('.workflow/state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          statement = (
              f'SW2-17 Generator Modularization is accepted on exact clean post-promotion candidate {CANDIDATE}: '
              f'Self Governance {SELF_GOV}, Governance Selftest {SELFTEST} on Ubuntu and Windows, '
              f'SW2 Sequence Evidence {SEQUENCE}, Governance Engine Performance {ENGINE}, and '
              f'Consumer Engine Performance {CONSUMER} all succeeded.'
          )
          proven = list(state.get('proven', []))
          if statement not in proven:
              proven.append(statement)
          state['proven'] = proven
          state['status'] = 'SW2_17_GENERATOR_MODULARIZATION_ACCEPTED'
          state['working_branch'] = 'main'
          state['blockers'] = []
          state['next_authorized_actions'] = [
              'Update PR #27 with exact closure evidence and squash-merge only from the final clean closure head.',
              'Verify the squash-merged main tree equals the tested closure tree and require post-merge 6/6 permanent checks.',
              'Only after SW2-17 is accepted on main may SW2-18 Unified CI Orchestrator be opened.',
          ]
          path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Regenerate closure Project Truth
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python scripts/sync_project_truth.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_governance_engine.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .

      - name: Commit closure authority locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs artifacts/sequence
          git commit -m 'SW2-17: record accepted generator modularization closure'

      - name: Validate clean closure commit
        shell: bash
        run: |
          python scripts/validate_cross_document_consistency.py --root . --base 7e2c5e4669655764e24ec821cefc0c96e2886133 --require-base
          python scripts/validate_project_truth.py --root . --project-docs-already-validated
          python scripts/validate_repository_health.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push closure authority
        shell: bash
        run: git push origin HEAD:work/sw2-17-generator-modularization
