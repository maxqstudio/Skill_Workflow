name: SW2-03 Promote Evidence

on:
  push:
    branches:
      - work/sw2-03-sequence-v2

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ACCEPTED_CANDIDATE: "932d57a62536ebd470ebaf6d6de3da3fb86d3577"
      ACCEPTED_SOURCE_DIGEST: "ccff23f0d81e0af3724984f243150b652f50864cf1659760bf163ab274ff3f6b"

    steps:
      - name: Checkout branch authority
        uses: actions/checkout@v4
        with:
          ref: work/sw2-03-sequence-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert accepted evidence is ancestor and source-equivalent
        shell: bash
        run: |
          git merge-base --is-ancestor "$ACCEPTED_CANDIDATE" HEAD
          python - <<'PY'
          import json, os
          actual = json.load(open('docs/sequence/generated/SW2-03-GOVERNANCE.actual.json', encoding='utf-8'))
          session = json.load(open('docs/sequence/sessions/SW2-03-GOVERNANCE.json', encoding='utf-8'))
          expected = os.environ['ACCEPTED_SOURCE_DIGEST']
          assert actual['source_digest'] == expected, actual
          assert session['actual']['source_digest'] == expected, session
          assert session['human_view']['source_digest'] == expected, session
          print('SW2_03_ACCEPTED_EVIDENCE_BINDING=PASS')
          PY

      - name: Promote SW2-03 requirements and claims
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ACCEPTANCE = Path('.workflow/acceptance.json')
          CLAIMS = Path('.workflow/claims.json')
          STATE = Path('.workflow/state.json')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = load(ACCEPTANCE)
          evidence = {
              'SW2-03-R1': 'PASS on exact cleanup candidate 932d57a62536ebd470ebaf6d6de3da3fb86d3577: Governance Selftest run 37087211310 passed Sequence human-view regression on Ubuntu and Windows; SW2 Sequence Evidence run 37087211297 regenerated and validated the independent full machine graph; committed source-bound machine evidence remains 39 nodes / 54 edges.',
              'SW2-03-R2': 'PASS on exact cleanup candidate 932d57a62536ebd470ebaf6d6de3da3fb86d3577: deterministic module-collapse-v1 projects the 39-node / 54-edge machine graph to 8 human participants / 13 interactions while accounting for 26 internal collapsed edges and all 28 cross-component machine edges; tamper/fidelity regression passed Ubuntu and Windows.',
              'SW2-03-R3': 'PASS on exact cleanup candidate 932d57a62536ebd470ebaf6d6de3da3fb86d3577: permanent SW2 Sequence Evidence run 37087211297 rendered the governed human Mermaid with @mermaid-js/mermaid-cli@12.0.0 and required a non-empty SVG before aggregate sequence validation could pass.',
              'SW2-03-R4': 'PASS on exact cleanup candidate 932d57a62536ebd470ebaf6d6de3da3fb86d3577: SW2-ADR-005 records measured baseline growth 7/6 -> 22/27 -> 33/44 -> 37/53, module-collapse-v1 enforces one participant per semantic component and one interaction per directed component pair, and selftest_sequence_human_view.py proves policy enforcement without inventing a global numeric limit.'
          }
          requirements = {r['id']: r for r in acceptance['requirements']}
          assert set(requirements) == set(evidence), requirements
          for req_id, text in evidence.items():
              requirements[req_id]['status'] = 'PASS'
              requirements[req_id]['evidence'] = text
          acceptance['sequence_sync_status'] = 'PASS'
          acceptance['truth_gates']['SEQUENCE_SYNC'] = 'PASS'
          write(ACCEPTANCE, acceptance)

          claims = load(CLAIMS)
          claim_map = {c['id']: c for c in claims['claims']}
          for claim_id in ('TRUTH-SW2-SEQUENCE-FIDELITY', 'TRUTH-SW2-SEQUENCE-PRESENTATION'):
              assert claim_id in claim_map, claim_id
              claim_map[claim_id]['status'] = 'PASS'
          write(CLAIMS, claims)

          state = load(STATE)
          assert state['phase'] == 'SW2-03' and state['status'] == 'IN_PROGRESS', state
          proof = (
              'SW2-03 Sequence V2 feature acceptance is proven on exact cleanup candidate '
              '932d57a62536ebd470ebaf6d6de3da3fb86d3577: Self Governance 37087211311, '
              'Governance Selftest 37087211310 on Ubuntu and Windows, SW2 Sequence Evidence '
              '37087211297 with blocking Mermaid render, SW2 Engine Performance 37087211307, '
              'and SW2 Consumer Engine Performance 37087211371 all succeeded. The full machine '
              'graph remains independent evidence; module-collapse-v1 produces a bounded human '
              'projection with complete machine-edge accounting.'
          )
          if proof not in state.setdefault('proven', []):
              state['proven'].append(proof)
          state['not_proven'] = [
              item for item in state.get('not_proven', [])
              if not item.startswith('SW2-03 ')
          ]
          state['next_authorized_actions'] = [
              'Run post-promotion clean-worktree acceptance on the exact promotion cleanup SHA.',
              'Close SW2-03 only after post-promotion permanent CI is fully green.',
              'Open SW2-04 Documentation System V2 fail-closed only as a separate phase transaction.'
          ]
          write(STATE, state)
          print('SW2_03_REQUIREMENTS_PROMOTED=PASS')
          print('SW2_03_CLAIMS_PROMOTED=PASS')
          print('SW2_03_PHASE_REMAINS_OPEN=PASS')
          PY

      - name: Regenerate deterministic Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-03-GOVERNANCE.json --report artifacts/sequence/SW2-03-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-03-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert promotion remains phase-scoped
        shell: bash
        run: |
          python - <<'PY'
          import json
          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert all(r['status'] == 'PASS' for r in acceptance['requirements']), acceptance['requirements']
          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claim_map = {c['id']: c for c in claims['claims']}
          assert claim_map['TRUTH-SW2-SEQUENCE-FIDELITY']['status'] == 'PASS'
          assert claim_map['TRUTH-SW2-SEQUENCE-PRESENTATION']['status'] == 'PASS'
          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-03' and state['status'] == 'IN_PROGRESS', state
          roadmap = json.load(open('.workflow/roadmap.json', encoding='utf-8'))
          assert roadmap['current_phase'] == 'SW2-03', roadmap
          assert next(p for p in roadmap['phases'] if p['id'] == 'SW2-03')['status'] == 'CURRENT'
          print('SW2_03_PROMOTION_ASSERTIONS=PASS')
          PY

      - name: Commit promotion evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence/SW2-03-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_PROMOTION_DIFF"; exit 0; }
          git commit -m "gov(sw2-03): promote Sequence V2 acceptance"
          git push origin HEAD:work/sw2-03-sequence-v2
