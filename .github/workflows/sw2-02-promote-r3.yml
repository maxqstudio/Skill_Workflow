name: SW2-02 Promote R3

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote R3 and mode-safety claim
        run: python .github/sw2-02-promote-r3.txt
      - name: Regenerate deterministic project truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
      - name: Assert SW2-02 acceptance without phase closure
        shell: bash
        run: |
          python - <<'PY'
          import json
          a = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          req = {x['id']: x for x in a['requirements']}
          assert all(req[f'SW2-02-R{i}']['status'] == 'PASS' for i in range(1, 5)), req
          c = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claims = {x['id']: x for x in c['claims']}
          assert claims['TRUTH-SW2-MODE-SAFETY']['status'] == 'PASS', claims['TRUTH-SW2-MODE-SAFETY']
          s = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert s['phase'] == 'SW2-02', s
          assert s['status'] == 'IN_PROGRESS', s
          print('R3_PROMOTION_PHASE_STILL_OPEN=PASS')
          PY
      - name: Commit governed promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs
          git diff --cached --quiet && { echo "NO_PROMOTION_DIFF"; exit 0; }
          git commit -m "chore(sw2): promote finalize evidence"
          git push origin HEAD:work/sw2-02-fast-development-workflow
