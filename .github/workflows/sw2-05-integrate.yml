name: SW2-05 Integrate Version Contracts

on:
  push:
    branches:
      - work/sw2-05-schema-toolchain-versioning

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-05-schema-toolchain-versioning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch integration surfaces
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit('PATCH_ANCHOR_NOT_FOUND:' + path)
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def ensure_profile_version(path):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if 'schema_version:' in text:
                  return
              lines = text.splitlines()
              index = 0
              while index < len(lines):
                  stripped = lines[index].strip()
                  if stripped and not stripped.startswith('#'):
                      break
                  index += 1
              lines.insert(index, 'schema_version: 1')
              p.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8', newline='\n')

          ensure_profile_version('PROJECT_PROFILE.yaml')
          ensure_profile_version('templates/PROJECT_PROFILE.yaml')

          replace_once(
              'scripts/project_profile.py',
              'from pathlib import Path\n',
              'from pathlib import Path\n\nfrom schema_contract import require_profile_schema_version\n',
          )
          replace_once(
              'scripts/project_profile.py',
              'def parse_profile(path: Path) -> dict:\n',
              'def parse_profile(path: Path, require_schema_version: bool = True) -> dict:\n',
          )
          replace_once(
              'scripts/project_profile.py',
              '    return data\n\n\ndef normalized_profile',
              '    if require_schema_version:\n        require_profile_schema_version(data, PROFILE_FILE)\n    return data\n\n\ndef normalized_profile',
          )

          replace_once(
              'scripts/generate_project_docs.py',
              'from typing import Any\n\nfrom extract_project_facts',
              'from typing import Any\n\nfrom schema_contract import require_json_schema_version\nfrom extract_project_facts',
          )
          replace_once(
              'scripts/generate_project_docs.py',
              '            specs[name] = load_json(path)\n',
              '            item = load_json(path)\n            require_json_schema_version(item, name)\n            specs[name] = item\n',
          )
          replace_once(
              'scripts/generate_project_docs.py',
              '            item = load_json(path)\n            if not clean(item.get("flow_id")):\n',
              '            item = load_json(path)\n            require_json_schema_version(item, "workflows/" + path.name)\n            if not clean(item.get("flow_id")):\n',
          )

          replace_once(
              'scripts/initialize_project_truth.py',
              'from pathlib import Path\n',
              'from pathlib import Path\n\nfrom toolchain_identity import SOURCE_ONLY_TOOLS, write_toolchain_lock\n',
          )
          replace_once(
              'scripts/initialize_project_truth.py',
              '        excluded_tools = {\n            "initialize_project_truth.py",\n            "selftest_project_truth_compiler.py",\n        }\n',
              '        excluded_tools = SOURCE_ONLY_TOOLS\n',
          )
          replace_once(
              'scripts/initialize_project_truth.py',
              '            else:\n                skips += 1\n                print("SKIP " + dst.relative_to(root).as_posix())\n\n    print("SPEC_ROOT=" + str(spec_root))\n',
              '            else:\n                skips += 1\n                print("SKIP " + dst.relative_to(root).as_posix())\n\n        lock_result = write_toolchain_lock(root, spec_root, tools_root, skill_root)\n        if lock_result == "WRITE":\n            writes += 1\n            print("WRITE " + (spec_root / "toolchain.lock.json").relative_to(root).as_posix())\n        else:\n            skips += 1\n            print("SKIP " + (spec_root / "toolchain.lock.json").relative_to(root).as_posix())\n\n    print("SPEC_ROOT=" + str(spec_root))\n',
          )

          replace_once(
              'scripts/validate_public_docs.py',
              '    "docs/handbook/reference/commands.md",\n',
              '    "docs/handbook/reference/commands.md",\n    "docs/handbook/reference/versioning.md",\n',
          )
          replace_once(
              'scripts/validate_public_docs.py',
              '    "reference/commands.md",\n',
              '    "reference/commands.md",\n    "reference/versioning.md",\n',
          )

          handbook = Path('docs/handbook/README.md')
          text = handbook.read_text(encoding='utf-8')
          anchor = '- [Command reference](reference/commands.md) — initializer, sync, validators, sequence tools, and governance-engine commands.\n'
          if 'reference/versioning.md' not in text:
              if anchor not in text:
                  raise SystemExit('HANDBOOK_REFERENCE_ANCHOR_NOT_FOUND')
              text = text.replace(
                  anchor,
                  anchor + '- [Schema and toolchain versioning](reference/versioning.md) — supported schema versions, explicit migration, toolchain locks, and compatibility rules.\n',
                  1,
              )
              handbook.write_text(text, encoding='utf-8', newline='\n')

          skill = Path('SKILL.md')
          text = skill.read_text(encoding='utf-8')
          anchor = 'Every project MUST define `PROJECT_PROFILE.yaml`.\n'
          if 'legacy state must be migrated explicitly' not in text:
              if anchor not in text:
                  raise SystemExit('SKILL_PROFILE_VERSION_ANCHOR_NOT_FOUND')
              text = text.replace(
                  anchor,
                  anchor + '\n`PROJECT_PROFILE.yaml` MUST declare `schema_version: 1`. Governed `.workflow/*.json` and `.workflow/workflows/*.json` specs MUST also declare supported schema versions. Missing or unknown versions fail closed; legacy state must be migrated explicitly rather than silently reinterpreted.\n',
                  1,
              )
          anchor = 'Initializer vendors runtime tools into `.workflow/tools/`. This keeps project\ngovernance tooling project-local and independent of Codex/Claude/Cursor skill\ninstallation paths.\n'
          if '.workflow/toolchain.lock.json' not in text:
              if anchor not in text:
                  raise SystemExit('SKILL_TOOLCHAIN_ANCHOR_NOT_FOUND')
              text = text.replace(
                  anchor,
                  anchor + '\nThe initializer also writes `.workflow/toolchain.lock.json`, binding the exact vendored Python tool bytes by SHA-256-derived manifest digest. The digest is acceptance-relevant; producer repository/commit metadata is provenance only and mutable upstream/cache state is never authority. For legacy projects, run `python scripts/migrate_governance_v1.py --root <project>` from the intended Skill Workflow source checkout. Migration is explicit, deterministic, idempotent, and rejects unknown future schema versions.\n',
                  1,
              )
          skill.write_text(text, encoding='utf-8', newline='\n')

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          for command in (
              'python scripts/selftest_schema_toolchain.py',
              'python scripts/validate_schema_toolchain.py --root .',
          ):
              if command not in acceptance['test_commands']:
                  acceptance['test_commands'].insert(1, command)
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          claims_path = Path('.workflow/claims.json')
          claims = json.loads(claims_path.read_text(encoding='utf-8'))
          claim_map = {item['id']: item for item in claims['claims']}
          schema_claim = claim_map['TRUTH-SW2-SCHEMA-MIGRATION']
          for owner in (
              'scripts/schema_contract.py',
              'scripts/migrate_governance_v1.py',
              'scripts/validate_schema_toolchain.py',
              'scripts/project_profile.py',
              'scripts/generate_project_docs.py',
          ):
              if owner not in schema_claim['source_owners']:
                  schema_claim['source_owners'].append(owner)
          for test in ('scripts/selftest_schema_toolchain.py', 'scripts/validate_schema_toolchain.py'):
              if test not in schema_claim['tests']:
                  schema_claim['tests'].append(test)
          tool_claim = claim_map['TRUTH-SW2-TOOLCHAIN-IDENTITY']
          for owner in (
              'scripts/toolchain_identity.py',
              'scripts/initialize_project_truth.py',
              'scripts/migrate_governance_v1.py',
              'scripts/validate_schema_toolchain.py',
          ):
              if owner not in tool_claim['source_owners']:
                  tool_claim['source_owners'].append(owner)
          for test in ('scripts/selftest_schema_toolchain.py', 'scripts/validate_schema_toolchain.py'):
              if test not in tool_claim['tests']:
                  tool_claim['tests'].append(test)
          claims_path.write_text(json.dumps(claims, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          decisions_path = Path('.workflow/decisions.json')
          decisions = json.loads(decisions_path.read_text(encoding='utf-8'))
          if not any(item.get('id') == 'SW2-ADR-008' for item in decisions['decisions']):
              decisions['decisions'].append({
                  'id': 'SW2-ADR-008',
                  'title': 'Separate schema compatibility from release naming and bind vendored tools by content digest',
                  'decision': 'Governance profile/spec schema version 1 is explicit and blocking. Legacy unversioned state requires the deterministic migrate_governance_v1.py path. Vendored consumer tools are bound by .workflow/toolchain.lock.json exact file hashes and manifest digest; producer commit metadata is provenance only. Stable Skill Workflow V2 release naming remains SW2-09 scope.',
                  'rationale': 'The existing JSON schema_version fields were not enforced and PROJECT_PROFILE.yaml had no version. Tool vendoring also had no byte-level identity, allowing accidental drift. The smallest compatible contract makes existing v1 semantics explicit without inventing a premature product release version.',
                  'status': 'ACCEPTED'
              })
          decisions_path.write_text(json.dumps(decisions, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          contracts_path = Path('.workflow/contracts.json')
          contracts = json.loads(contracts_path.read_text(encoding='utf-8'))
          if not any(item.get('name') == '.workflow/toolchain.lock.json' for item in contracts['data_contracts']):
              contracts['data_contracts'].append({
                  'name': '.workflow/toolchain.lock.json',
                  'source_of_truth': 'deterministic manifest of the project-local vendored governance tool bytes',
                  'mutability': 'generated by initializer or explicit governance migration/toolchain synchronization',
                  'retention': 'tracked with the consumer project governance state',
                  'legal_writes': ['scripts/initialize_project_truth.py', 'scripts/migrate_governance_v1.py'],
                  'invariants': [
                      'toolchain file hashes and manifest digest match .workflow/tools/*.py',
                      'cache state and mutable upstream state are not acceptance authority',
                      'producer repository/commit metadata is provenance only'
                  ]
              })
          contracts_path.write_text(json.dumps(contracts, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          session_path = Path('docs/sequence/sessions/SW2-05-GOVERNANCE.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          session['actual']['entries'] = [
              'scripts/initialize_project_truth.py::main',
              'scripts/migrate_governance_v1.py::main',
              'scripts/validate_schema_toolchain.py::main',
              'scripts/project_profile.py::parse_profile',
              'scripts/generate_project_docs.py::main',
              'scripts/governance_engine.py::main'
          ]
          for test in ('scripts/selftest_schema_toolchain.py', 'scripts/validate_schema_toolchain.py'):
              if test not in session['tests']:
                  session['tests'].append(test)
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print('SW2_05_INTEGRATION_PATCH=PASS')
          PY

      - name: Run schema and migration regressions
        run: |
          python -m compileall -q scripts
          python scripts/selftest_schema_toolchain.py
          python scripts/validate_schema_toolchain.py --root .
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_strict_project_workflow.py

      - name: Regenerate sequence and Project Truth
        run: |
          python scripts/generate_sequence_actual.py --root . --output-json docs/sequence/generated/SW2-05-GOVERNANCE.actual.json --output-mermaid docs/sequence/generated/SW2-05-GOVERNANCE.actual.mmd --entry scripts/initialize_project_truth.py::main --entry scripts/migrate_governance_v1.py::main --entry scripts/validate_schema_toolchain.py::main --entry scripts/project_profile.py::parse_profile --entry scripts/generate_project_docs.py::main --entry scripts/governance_engine.py::main
          python scripts/sequence_human_view.py --root . --actual-json docs/sequence/generated/SW2-05-GOVERNANCE.actual.json --actual-mermaid docs/sequence/generated/SW2-05-GOVERNANCE.actual.mmd --output-json docs/sequence/generated/SW2-05-GOVERNANCE.human.json --output-mermaid docs/sequence/generated/SW2-05-GOVERNANCE.human.mmd --output-markdown docs/sequence/views/SW2-05-GOVERNANCE.md --session-id SW2-05-GOVERNANCE
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.load(open('docs/sequence/generated/SW2-05-GOVERNANCE.actual.json', encoding='utf-8'))
          human = json.load(open('docs/sequence/generated/SW2-05-GOVERNANCE.human.json', encoding='utf-8'))
          session_path = Path('docs/sequence/sessions/SW2-05-GOVERNANCE.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          digest = actual['source_digest']
          assert human['source_digest'] == digest
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_schema_toolchain.py --root . --report artifacts/schema_toolchain_report.json
          python scripts/validate_public_docs.py --root . --report artifacts/public_docs_report.json
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-05-GOVERNANCE.json --report artifacts/sequence/SW2-05-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-05-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert fail-closed phase status
        run: |
          python - <<'PY'
          import json
          a = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert all(item['status'] == 'NOT_PROVEN' for item in a['requirements'])
          claims = {item['id']: item for item in json.load(open('.workflow/claims.json', encoding='utf-8'))['claims']}
          assert claims['TRUTH-SW2-SCHEMA-MIGRATION']['status'] == 'NOT_PROVEN'
          assert claims['TRUTH-SW2-TOOLCHAIN-IDENTITY']['status'] == 'NOT_PROVEN'
          print('SW2_05_REQUIREMENTS_STILL_NOT_PROVEN=PASS')
          PY

      - name: Commit integrated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_PROFILE.yaml SKILL.md scripts templates docs .workflow artifacts/schema_toolchain_report.json artifacts/public_docs_report.json artifacts/sequence/SW2-05-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_INTEGRATION_DIFF"; exit 1; }
          git commit -m "feat(sw2-05): integrate schema and toolchain versioning"
          git push origin HEAD:work/sw2-05-schema-toolchain-versioning
