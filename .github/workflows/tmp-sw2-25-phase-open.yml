name: tmp-sw2-25-phase-open
on:
  push:
    branches:
      - work/sw2-25-reproducible-release-bundle
permissions:
  contents: write
jobs:
  phase-open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-25-reproducible-release-bundle
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Open governed exact-main SW2-25 phase
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .github/scripts/tmp_sw2_25_open.py
