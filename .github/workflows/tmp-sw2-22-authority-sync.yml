name: tmp-sw2-22-authority-sync

on:
  push:
    branches:
      - work/sw2-22-consumer-toolchain-provenance-upgrade

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-22-consumer-toolchain-provenance-upgrade
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Synchronize SW2-22 authority with package-safe provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          def load(path):
              return json.loads((root / path).read_text(encoding='utf-8'))

          def dump(path, value):
              (root / path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = load('.workflow/acceptance.json')
          acceptance['evidence_boundary'] = (
              'SW2-22 covers content-addressed producer identity for vendored consumer toolchains, enriches it with exact Git provenance when verifiable Git metadata is available, and provides deterministic source-side upgrade planning/apply. It does not add remote auto-update, package-manager infrastructure, release publication, GitHub rulesets, or permission to rewrite Owner semantic authority.'
          )
          for req in acceptance['requirements']:
              if req['id'] == 'SW2-22-R1':
                  req['requirement'] = (
                      'Consumer toolchain locks bind vendored bytes to an exact source-content digest. Verifiable Git checkouts additionally record repository, exact source SHA, release identity, and identity_source=GIT+CONTENT; copied/package sources without Git metadata use identity_source=CONTENT and explicitly mark Git-only fields NOT_PROVEN. Missing, malformed, mismatched, or legacy hint-only identity fails closed.'
                  )
          dump('.workflow/acceptance.json', acceptance)

          roadmap = load('.workflow/roadmap.json')
          for phase in roadmap['phases']:
              if phase['id'] != 'SW2-22':
                  continue
              phase['objective'] = (
                  'Bind every vendored consumer toolchain to exact content-addressed upstream identity, enrich provenance with exact Git source identity when verifiable Git metadata exists, and provide deterministic, fail-closed, idempotent upgrade planning and execution without modifying Owner semantic authority.'
              )
              phase['exit_criteria'][0] = (
                  'Every newly written consumer toolchain lock records an exact source-content digest; verifiable Git checkouts additionally record producer repository, exact source SHA, and exact release tag when HEAD is tagged, while copied/package sources without Git metadata explicitly use CONTENT identity and mark Git-only fields NOT_PROVEN.'
              )
              phase['exit_criteria'][1] = (
                  'Missing, malformed, mismatched, or legacy hint-only producer identity fails closed; content-only package identity is accepted only when its exact digest matches the vendored bytes and unavailable Git fields are explicitly NOT_PROVEN.'
              )
          dump('.workflow/roadmap.json', roadmap)

          contracts = load('.workflow/contracts.json')
          for item in contracts['data_contracts']:
              if item.get('name') != '.workflow/toolchain.lock.json':
                  continue
              item['invariants'] = [
                  'toolchain file hashes and manifest digest match .workflow/tools/*.py',
                  'producer source_digest is exact and validator-enforced for every supported distribution',
                  'verifiable Git sources use GIT+CONTENT identity with repository/source SHA/release provenance; copied package sources use CONTENT identity and explicitly mark Git-only fields NOT_PROVEN',
                  'legacy hint-only producer identity is migration input, never acceptance authority',
                  'source-side upgrade check is read-only, apply mutates only toolchain-owned surfaces, and weaker package metadata cannot downgrade already-proven stronger Git provenance for identical content',
              ]
              item['source_of_truth'] = (
                  'deterministic manifest of project-local vendored governance tool bytes plus exact source-content identity and strongest verifiable producer provenance'
              )
          dump('.workflow/contracts.json', contracts)

          decisions = load('.workflow/decisions.json')
          for item in decisions['decisions']:
              if item.get('id') != 'SW2-ADR-011':
                  continue
              item['decision'] = (
                  'Toolchain contract version 2 replaces informational producer commit hints with validator-enforced exact source-content identity. Verifiable Git checkouts add repository, exact source SHA, release identity, and GIT+CONTENT provenance; copied skill/package sources without .git use CONTENT identity with Git-only fields explicitly NOT_PROVEN. Consumer upgrades are source-side, plan-before-write, limited to vendored tool files plus the lock, preserve stronger provenance for identical content, and legacy v2.1 locks migrate explicitly.'
              )
              item['rationale'] = (
                  'The public skills installation path may copy the skill without .git metadata, so Git SHA cannot be a universal prerequisite. Exact content identity remains available in both checkout and packaged distributions, while Git provenance is retained when verifiable rather than guessed. This closes the provenance gap without breaking public installation or allowing automated edits to Owner semantic authority.'
              )
          dump('.workflow/decisions.json', decisions)

          state = load('.workflow/state.json')
          state['blocked_actions'] = [
              'Do not treat producer commit_hint metadata as acceptance-grade toolchain provenance.',
              'Do not claim repository, source SHA, or release provenance when the Skill Workflow distribution does not contain verifiable Git metadata; use exact content identity and mark Git-only fields NOT_PROVEN.',
              'Do not mutate AGENTS.md or project semantic .workflow authority as part of a toolchain upgrade.',
              'Do not claim an upgrade is current when producer content identity is missing, malformed, or mismatched.',
              'Do not claim automatic GitHub merge protection or required-check enforcement while no repository ruleset is configured.',
              'Do not begin SW2-23 or publish a new release unless the Owner explicitly authorizes that separate boundary.',
          ]
          state['not_proven'] = [
              ('SW2-22 exact content-addressed producer identity, package-copy fallback, and strongest-available Git provenance are NOT_PROVEN.' if x == 'SW2-22 exact producer source identity in consumer toolchain locks is NOT_PROVEN.' else x)
              for x in state.get('not_proven', [])
          ]
          dump('.workflow/state.json', state)

          path = root / 'references/governance-and-project-truth.md'
          text = path.read_text(encoding='utf-8')
          old = ('Vendored `.workflow/tools/` bytes and `.workflow/toolchain.lock.json` form one governed toolchain identity. The lock MUST record validator-enforced producer repository, exact Git source SHA, release identity (`UNRELEASED` when HEAD is not exactly tagged), and `identity_source=GIT`. A legacy `commit_hint` is migration input only and MUST NOT be treated as acceptance authority.\n')
          new = ('Vendored `.workflow/tools/` bytes and `.workflow/toolchain.lock.json` form one governed toolchain identity. The lock MUST always record an exact source-content digest. When the Skill Workflow source has verifiable Git metadata, the lock MUST also record producer repository, exact Git source SHA, release identity (`UNRELEASED` when HEAD is not exactly tagged), and `identity_source=GIT+CONTENT`. A copied/package distribution without `.git` MUST use `identity_source=CONTENT` and mark repository, source SHA, and release as `NOT_PROVEN` rather than guessing them. A legacy `commit_hint` is migration input only and MUST NOT be treated as acceptance authority.\n')
          if old not in text:
              raise SystemExit('REFERENCE_PROVENANCE_PATCH_TARGET_MISSING')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          path = root / 'docs/handbook/getting-started/adoption.md'
          text = path.read_text(encoding='utf-8')
          old = ('Initialization records a content manifest and exact producer identity in `.workflow/toolchain.lock.json`. Updating an installed agent skill does not silently replace the vendored governance tools already committed in a consumer repository. To inspect a later Skill Workflow checkout against an existing consumer, run `scripts/upgrade_governance_toolchain.py --root <project> --check` from that checkout and review the machine-readable plan before using `--apply`. Legacy hint-only locks require this explicit migration path.\n')
          new = ('Initialization records a content manifest and exact source-content identity in `.workflow/toolchain.lock.json`. A Git checkout records stronger `GIT+CONTENT` provenance with repository/SHA/release; a copied skill/package without `.git` records `CONTENT` identity and explicitly marks Git-only fields `NOT_PROVEN`. Updating an installed agent skill does not silently replace the vendored governance tools already committed in a consumer repository. To inspect a later Skill Workflow checkout/package against an existing consumer, run `scripts/upgrade_governance_toolchain.py --root <project> --check` from that source and review the machine-readable plan before using `--apply`. Legacy hint-only locks require this explicit migration path, and weaker package metadata must not downgrade stronger provenance for identical content.\n')
          if old not in text:
              raise SystemExit('ADOPTION_PROVENANCE_PATCH_TARGET_MISSING')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          path = root / 'docs/handbook/reference/commands.md'
          text = path.read_text(encoding='utf-8')
          anchor = ('`--check` is read-only and exits non-zero when an upgrade or provenance migration is required. Review the emitted `PLAN_JSON`, then apply only the vendored toolchain surfaces:\n')
          replacement = ('`--check` is read-only and exits non-zero when an upgrade or provenance migration is required. `PLAN_JSON` always includes exact content identity; Git repository/SHA/release are present only when verifiable Git metadata exists, otherwise those fields remain `NOT_PROVEN`. Review the emitted `PLAN_JSON`, then apply only the vendored toolchain surfaces:\n')
          if anchor not in text:
              raise SystemExit('COMMAND_PROVENANCE_PATCH_TARGET_MISSING')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8', newline='\n')
          PY

          python scripts/selftest_toolchain_provenance_upgrade.py
          python scripts/selftest_schema_toolchain.py
          python scripts/selftest_adoption_profiles.py
          python scripts/selftest_strict_project_workflow.py
          python scripts/validate_schema_toolchain.py --root .

          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-22-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
              '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session['session_id']
          ], check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          session['actual']['source_digest'] = graph['source_digest']
          session['human_view']['source_digest'] = graph['source_digest']
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-22-GOVERNANCE.json --report artifacts/sequence/SW2-22-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-22-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .

          python scripts/sync_project_truth.py --root .
          python scripts/validate_documentation_contract.py --root . --write-report
          python scripts/validate_documentation_contract.py --root .
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_project_docs.py --root .

          git add .workflow docs artifacts/sequence references scripts
          git diff --cached --quiet && { echo 'NO_SYNC_CHANGES'; exit 1; }
          git commit -m 'SW2-22: align provenance authority with package distribution'
          git push origin HEAD:work/sw2-22-consumer-toolchain-provenance-upgrade
