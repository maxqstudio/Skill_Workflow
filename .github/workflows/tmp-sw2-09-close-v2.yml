name: TEMP SW2-09 V2 Closure

on:
  push:
    branches:
      - work/sw2-09-v2-closure

permissions:
  contents: write

env:
  RELEASE_SHA: d61d216f1c9b29d6bdd90e1a929cd4199c8e93f6
  RELEASE_TREE: b57951a255bbd5a6cca3a17635c401eb2520565b
  VERSION: v2.0.0
  PUBLICATION_RUN_ID: "37185074131"
  PUBLICATION_ARTIFACT_ID: "11296387707"
  PUBLICATION_ARTIFACT_SHA256: bdb6d403e616fde05d07bd9b49c20948d28e0555fbea3cb08b3147521760a68d
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  close-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable publication authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_SHA^{tree}")" = "$RELEASE_TREE"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print $2}')" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "$VERSION")" = "$RELEASE_SHA"
          release_json="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url)"
          RELEASE_JSON="$release_json" python - <<'PY'
          import json, os
          data=json.loads(os.environ['RELEASE_JSON'])
          expected=os.environ['RELEASE_SHA']
          assert data['tagName'] == os.environ['VERSION']
          assert data['targetCommitish'] == expected
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          assert data['url'].endswith('/releases/tag/' + os.environ['VERSION'])
          print('LIVE_PUBLICATION_IDENTITY=PASS')
          PY

      - name: Promote R4 and close stable V2 authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          release_sha=os.environ['RELEASE_SHA']
          release_tree=os.environ['RELEASE_TREE']
          version=os.environ['VERSION']
          run_id=os.environ['PUBLICATION_RUN_ID']
          artifact_id=os.environ['PUBLICATION_ARTIFACT_ID']
          artifact_sha=os.environ['PUBLICATION_ARTIFACT_SHA256']

          acceptance_path=Path('.workflow/acceptance.json')
          acceptance=json.loads(acceptance_path.read_text(encoding='utf-8'))
          reqs={item['id']: item for item in acceptance['requirements']}
          r4=reqs['SW2-09-R4']
          assert r4['status'] in {'NOT_PROVEN','PASS'}
          r4['status']='PASS'
          r4['evidence']=(
              f'Stable {version} publication is accepted from exact tested main {release_sha} '
              f'with tree {release_tree}. Publication run {run_id} passed strict finalize preflight '
              'with publication_authority=true and only SW2-09-R4 publication-pending before publication; '
              'tag target identity and GitHub release target identity both passed against the exact tested SHA. '
              f'Publication evidence artifact {artifact_id} has SHA-256 {artifact_sha}. '
              f'The {version} tag is immutable release evidence and must not be retargeted.'
          )
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          state_path=Path('.workflow/state.json')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          assert state.get('phase') == 'SW2-09'
          state['status']='V2_STABLE_RELEASED'
          state['last_accepted_branch']='main'
          state['last_accepted_sha']=release_sha
          state['not_proven']=[
              x for x in state.get('not_proven', [])
              if 'SW2-09 exact stable release candidate acceptance' not in x
              and 'SW2-09 versioned GitHub tag/release publication' not in x
          ]
          state['blocked_actions']=[
              f'Do not move, retarget, delete-and-recreate, or silently replace the stable {version} tag as a normal rollback path.',
              'Do not claim that GitHub automatically blocks merges or requires checks while no repository ruleset is configured.',
              'Do not change the Owner-approved MIT license or SW2-ADR-010 without explicit Owner approval.',
              'Do not weaken accepted Skill Workflow V2 guarantees without a new governed acceptance boundary.'
          ]
          state['next_authorized_actions']=[
              f'Treat {version} at {release_sha} as the accepted stable V2 release baseline.',
              'For defects in the stable release, repair forward under a new governed patch release; never retarget the existing stable tag.',
              'Before new feature or compatibility work changes accepted V2 guarantees, declare a new governed roadmap phase and acceptance boundary.'
          ]
          proven=state.setdefault('proven', [])
          facts=[
              f'SW2-09 pre-publication main {release_sha} with tree {release_tree} passed the complete post-merge permanent matrix: Self Governance 37184904751 SUCCESS; Governance Selftest 37184904785 SUCCESS on Ubuntu and Windows; SW2 Sequence Evidence 37184904776 SUCCESS; Governance Engine Performance 37184904813 SUCCESS; Consumer Engine Performance 37184904805 SUCCESS.',
              f'SW2-09-R4 stable publication is proven: strict publication run {run_id} granted publication_authority=true for {version} from exact tested main {release_sha}; the tag target and GitHub release target both resolve to that SHA; publication evidence artifact {artifact_id} has SHA-256 {artifact_sha}.'
          ]
          for fact in facts:
              if fact not in proven:
                  proven.append(fact)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Synchronize generated Project Truth
        shell: bash
        run: python scripts/sync_project_truth.py --root .

      - name: Remove temporary closure workflow
        shell: bash
        run: rm .github/workflows/tmp-sw2-09-close-v2.yml

      - name: Commit closure candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "SW2-09: accept v2.0.0 publication and close stable V2"
          test -z "$(git status --porcelain)"

      - name: Validate clean closure candidate
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python -m compileall -q scripts
          python scripts/selftest_release_preflight.py
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
          python scripts/validate_cross_document_consistency.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_project_truth.py --root .
          python scripts/governance_engine.py --root . --base "$RELEASE_SHA" --mode finalize --expected-head "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Push clean closure candidate
        shell: bash
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
