name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      version:
        description: Release version such as v2.0.0-rc.1 or v2.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact candidate provenance
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile governance scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q scripts

      - name: Finalize governed candidate
        shell: bash
        run: |
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          python scripts/governance_engine.py \
            --root . \
            --base "$base" \
            --mode finalize \
            --expected-head "${{ inputs.candidate_sha }}" \
            --report "${RUNNER_TEMP}/finalize.json"

      - name: Validate release preflight
        shell: bash
        run: |
          python scripts/release_preflight.py \
            --root . \
            --expected-head "${{ inputs.candidate_sha }}" \
            --version "${{ inputs.version }}" \
            --governance-report "${RUNNER_TEMP}/finalize.json" \
            --report "${RUNNER_TEMP}/release-preflight.json"

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/finalize.json
            ${{ runner.temp }}/release-preflight.json
