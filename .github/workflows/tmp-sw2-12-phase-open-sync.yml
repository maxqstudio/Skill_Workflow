name: SW2-12 Phase Open Sync

on:
  push:
    branches:
      - work/sw2-12-repository-hygiene

permissions:
  contents: write

jobs:
  phase-open:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-12-repository-hygiene
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open SW2-12 authority boundary
        shell: bash
        run: |
          rm .github/workflows/tmp-sw2-12-phase-open-sync.yml
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          wf = root / '.workflow'
          main_sha = '2fc16cce4c7753ad103bac401d1825a9bd8bd3a1'
          branch = 'work/sw2-12-repository-hygiene'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write(path, data):
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          roadmap_path = wf / 'roadmap.json'
          roadmap = load(roadmap_path)
          roadmap['current_phase'] = 'SW2-12'
          for phase in roadmap['phases']:
              if phase['id'] == 'SW2-11':
                  phase['status'] = 'COMPLETE'
              elif phase['id'] == 'SW2-12':
                  phase['status'] = 'CURRENT'
              elif phase.get('status') == 'CURRENT':
                  phase['status'] = 'PLANNED'
          write(roadmap_path, roadmap)

          state_path = wf / 'state.json'
          state = load(state_path)
          proven = list(state.get('proven', []))
          closure = (
              'SW2-11 Root AGENTS.md Contract was squash-merged to main as '
              '2fc16cce4c7753ad103bac401d1825a9bd8bd3a1 with tree '
              '355a351b6da106dfa6538add0c13f5a4d2f2d67f equal to the exact tested clean-head tree. '
              'Post-merge main passed Self Governance 37202694399, Governance Selftest 37202694460 '
              'on Ubuntu and Windows, SW2 Sequence Evidence 37202694406, Governance Engine Performance '
              '37202694405, and Consumer Engine Performance 37202694400.'
          )
          if closure not in proven:
              proven.append(closure)
          state.update({
              'phase': 'SW2-12',
              'status': 'IN_PROGRESS',
              'working_branch': branch,
              'last_accepted_branch': 'main',
              'last_accepted_sha': main_sha,
              'blockers': [],
              'proven': proven,
              'not_proven': [
                  'SW2-12 temporary/dead workflow and transient-artifact inventory is not yet proven complete.',
                  'SW2-12 safe-removal classification and reference audit are not yet proven.',
                  'SW2-12 historical acceptance evidence auditability after cleanup is not yet proven.',
                  'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.'
              ],
              'next_authorized_actions': [
                  'Inventory tracked temporary workflows, transient artifacts, obsolete generated leftovers, and their live references before deletion.',
                  'Classify each candidate as KEEP, REMOVE, or NOT_PROVEN using repository references, acceptance history, and compatibility contracts.',
                  'Remove only evidence-backed stale items, preserve historical acceptance auditability, regenerate affected Project Truth/sequence evidence, and run complete acceptance before closure.'
              ],
              'blocked_actions': [
                  'Do not mark any SW2-12 requirement PASS before cleanup-specific evidence exists.',
                  'Do not delete files merely because their names look temporary; removal requires evidence that no current contract or historical audit path depends on them.',
                  'Do not rewrite immutable historical acceptance evidence simply to make the repository look cleaner.',
                  'Do not move, retarget, delete-and-recreate, or silently replace the stable v2.0.0 tag.',
                  'Do not weaken accepted V2 governance guarantees or the mandatory root AGENTS.md contract.',
                  'Do not begin SW2-13 implementation until SW2-12 is accepted.'
              ]
          })
          write(state_path, state)

          questions = {
              'How does failure/recovery behave?': 'PASS',
              'How does important data flow through the system?': 'PASS',
              'What are the important lifecycle states and transitions?': 'PASS',
              'What are the main user/domain workflows?': 'PASS',
              'What are the major components and how do they relate?': 'PASS',
              'What is mutable and what is immutable?': 'PASS',
              'What is proven and what is not proven?': 'PASS',
              'What is the current project state?': 'PASS',
              'What is the project and what problem does it solve?': 'PASS',
              'What may happen next and what is blocked?': 'PASS',
              'Who uses it and what are the primary outcomes?': 'PASS',
              'Who/what is authoritative for important decisions?': 'PASS'
          }
          acceptance = {
              'schema_version': 1,
              'evidence_boundary': (
                  'SW2-12 covers repository hygiene and dead/transient artifact cleanup only: evidence-backed inventory, '
                  'safe-removal classification, preservation of historical acceptance auditability and compatibility contracts, '
                  'deterministic synchronization, and exact-candidate regression. It must not alter accepted V2 behavior, '
                  'the stable v2.0.0 tag target, or root AGENTS.md governance semantics.'
              ),
              'human_comprehension_questions': questions,
              'human_comprehension_status': 'PASS',
              'requirements': [
                  {
                      'id': 'SW2-12-R1',
                      'requirement': 'Temporary/dead workflow and transient-artifact inventory is evidence-backed and distinguishes current authority, historical evidence, and removable leftovers.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until tracked candidates and repository references are inventoried with explicit KEEP/REMOVE/NOT_PROVEN classification.'
                  },
                  {
                      'id': 'SW2-12-R2',
                      'requirement': 'Only stale items proven safe to remove are deleted, without weakening accepted V2 behavior or compatibility contracts.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until every removal is justified by reference/history audit and the resulting candidate passes targeted regression.'
                  },
                  {
                      'id': 'SW2-12-R3',
                      'requirement': 'Historical acceptance and release evidence remains auditable after cleanup.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until historical sequence sessions, release evidence, accepted SHAs/run identifiers, and public compatibility references are revalidated after cleanup.'
                  },
                  {
                      'id': 'SW2-12-R4',
                      'requirement': 'Project Truth, current sequence evidence, and the complete permanent acceptance matrix pass on the exact clean cleanup candidate.',
                      'status': 'NOT_PROVEN',
                      'evidence': 'NOT_PROVEN until the exact final cleanup head passes all six permanent checks including Ubuntu and Windows Governance Selftest.'
                  }
              ],
              'runtime_checks': [],
              'runtime_status': 'NOT_APPLICABLE',
              'sequence_mode': 'DURING',
              'sequence_session': 'SW2-12-GOVERNANCE',
              'sequence_sync_status': 'PASS',
              'test_commands': [
                  'python -m compileall -q scripts',
                  'python scripts/selftest_repository_health.py',
                  'python scripts/validate_repository_health.py --root .',
                  'python scripts/selftest_project_truth_compiler.py',
                  'python scripts/selftest_cross_document_regressions.py',
                  'python scripts/selftest_strict_project_workflow.py',
                  'python scripts/validate_project_docs.py --root .',
                  'python scripts/validate_sequence_sessions.py --root .',
                  f'python scripts/validate_cross_document_consistency.py --root . --base {main_sha} --require-base',
                  f'python scripts/governance_engine.py --root . --base {main_sha} --mode finalize --expected-head <EXACT_HEAD>'
              ],
              'truth_gates': {
                  'BEHAVIORAL_SYNC': 'NOT_APPLICABLE',
                  'CROSS_DOCUMENT_CONSISTENCY': 'NOT_PROVEN',
                  'DOC_LAYOUT': 'PASS',
                  'DOC_READABILITY': 'PASS',
                  'DOC_SOURCE_TRACEABILITY': 'NOT_PROVEN',
                  'DOC_TEST_TRACEABILITY': 'NOT_PROVEN',
                  'HUMAN_COMPREHENSION': 'PASS',
                  'PROJECT_DOCS_NORMALIZED': 'PASS',
                  'PROJECT_DOCS_SYNC': 'PASS',
                  'PROJECT_STATE_SYNC': 'NOT_PROVEN',
                  'PROVENANCE_SYNC': 'NOT_PROVEN',
                  'REFERENCE_SYNC': 'NOT_PROVEN',
                  'ROADMAP_SYNC': 'PASS',
                  'RUNTIME_E2E': 'NOT_APPLICABLE',
                  'SEMANTIC_SYNC': 'NOT_PROVEN',
                  'SEQUENCE_SYNC': 'PASS',
                  'SOURCE_TESTS': 'NOT_PROVEN',
                  'STRUCTURAL_SYNC': 'NOT_PROVEN',
                  'TEST_RUNTIME_TRACEABILITY': 'NOT_APPLICABLE'
              }
          }
          write(wf / 'acceptance.json', acceptance)

          old_path = root / 'docs' / 'sequence' / 'sessions' / 'SW2-11-GOVERNANCE.json'
          old = load(old_path)
          old['scope'] = 'HISTORICAL'
          old['status'] = 'COMPLETE'
          write(old_path, old)

          new_session = {
              'schema_version': 1,
              'session_id': 'SW2-12-GOVERNANCE',
              'phase': 'SW2-12',
              'scope': 'CURRENT',
              'status': 'IN_PROGRESS',
              'critical': True,
              'mode': 'DURING',
              'implementation_base_sha': main_sha,
              'evidence_boundary': (
                  'SW2-12 sequence evidence covers repository-health/reference validation, Project Truth synchronization, '
                  'cross-document consistency, sequence validation, and final governance acceptance for repository hygiene. '
                  'It does not authorize unrelated behavior or release-tag changes.'
              ),
              'actual': {
                  'graph': 'docs/sequence/generated/SW2-12-GOVERNANCE.actual.json',
                  'diagram': 'docs/sequence/generated/SW2-12-GOVERNANCE.actual.mmd',
                  'entries': [
                      'scripts/validate_repository_health.py::main',
                      'scripts/validate_project_docs.py::main',
                      'scripts/validate_cross_document_consistency.py::main',
                      'scripts/sync_project_truth.py::main',
                      'scripts/validate_sequence_sessions.py::main',
                      'scripts/governance_engine.py::main'
                  ],
                  'source_digest': ''
              },
              'human_view': {
                  'graph': 'docs/sequence/generated/SW2-12-GOVERNANCE.human.json',
                  'diagram': 'docs/sequence/generated/SW2-12-GOVERNANCE.human.mmd',
                  'document': 'docs/sequence/views/SW2-12-GOVERNANCE.md',
                  'granularity': 'module',
                  'policy_id': 'module-collapse-v1',
                  'source_digest': ''
              },
              'acceptance_report': 'artifacts/sequence/SW2-12-GOVERNANCE.acceptance.json',
              'plan': {'required': False, 'frozen': False, 'contract': '', 'diagram': '', 'sha256': '', 'frozen_commit': ''},
              'runtime_trace': {'required': False, 'graph': ''},
              'test_traceability_required': True,
              'tests': [
                  'scripts/selftest_repository_health.py',
                  'scripts/selftest_project_truth_compiler.py',
                  'scripts/selftest_cross_document_regressions.py',
                  'scripts/selftest_strict_project_workflow.py'
              ]
          }
          write(root / 'docs' / 'sequence' / 'sessions' / 'SW2-12-GOVERNANCE.json', new_session)
          PY

      - name: Generate Project Truth and current sequence
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/SW2-12-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-12-GOVERNANCE.actual.mmd \
            --entry scripts/validate_repository_health.py::main \
            --entry scripts/validate_project_docs.py::main \
            --entry scripts/validate_cross_document_consistency.py::main \
            --entry scripts/sync_project_truth.py::main \
            --entry scripts/validate_sequence_sessions.py::main \
            --entry scripts/governance_engine.py::main
          python - <<'PY'
          import json
          from pathlib import Path
          session_path = Path('docs/sequence/sessions/SW2-12-GOVERNANCE.json')
          actual_path = Path('docs/sequence/generated/SW2-12-GOVERNANCE.actual.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = json.loads(actual_path.read_text(encoding='utf-8'))
          digest = actual['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/sequence_human_view.py --root . \
            --actual-json docs/sequence/generated/SW2-12-GOVERNANCE.actual.json \
            --actual-mermaid docs/sequence/generated/SW2-12-GOVERNANCE.actual.mmd \
            --output-json docs/sequence/generated/SW2-12-GOVERNANCE.human.json \
            --output-mermaid docs/sequence/generated/SW2-12-GOVERNANCE.human.mmd \
            --output-markdown docs/sequence/views/SW2-12-GOVERNANCE.md \
            --session-id SW2-12-GOVERNANCE
          python scripts/validate_sequence_contract.py --root . \
            --session docs/sequence/sessions/SW2-12-GOVERNANCE.json \
            --report artifacts/sequence/SW2-12-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . \
            --session docs/sequence/sessions/SW2-12-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .

      - name: Commit clean phase-open transaction
        shell: bash
        run: |
          git config user.name maxqstudio
          git config user.email jackson.cendana@gmail.com
          git add .workflow docs artifacts/sequence .github/workflows/tmp-sw2-12-phase-open-sync.yml
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "SW2-12: open repository hygiene boundary"
          git push origin HEAD:work/sw2-12-repository-hygiene
