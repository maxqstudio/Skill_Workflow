name: SW2 Sequence Evidence

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sequence-evidence:
    name: SW2 Sequence Evidence (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate provenance
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for Mermaid renderer
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Generate and validate current governed sequence session
        id: current_sequence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          acceptance = json.loads((root / '.workflow' / 'acceptance.json').read_text(encoding='utf-8'))
          session_id = str(acceptance.get('sequence_session', '')).strip()
          if not session_id:
              raise SystemExit('CURRENT_SEQUENCE_SESSION_MISSING')

          session_path = root / 'docs' / 'sequence' / 'sessions' / f'{session_id}.json'
          if not session_path.is_file():
              raise SystemExit(f'CURRENT_SEQUENCE_SESSION_NOT_FOUND:{session_path.as_posix()}')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          if session.get('scope') != 'CURRENT':
              raise SystemExit(f'CURRENT_SEQUENCE_SCOPE_INVALID:{session.get("scope")}')
          if session.get('session_id') != session_id:
              raise SystemExit('CURRENT_SEQUENCE_ID_MISMATCH')

          actual = session.get('actual') or {}
          graph = str(actual.get('graph', '')).strip()
          diagram = str(actual.get('diagram', '')).strip()
          entries = [str(item).strip() for item in actual.get('entries', []) if str(item).strip()]
          if not graph or not diagram or not entries:
              raise SystemExit('CURRENT_SEQUENCE_ACTUAL_CONTRACT_INCOMPLETE')

          generate = [
              sys.executable,
              'scripts/generate_sequence_actual.py',
              '--root', '.',
              '--output-json', graph,
              '--output-mermaid', diagram,
          ]
          for entry in entries:
              generate.extend(['--entry', entry])
          subprocess.run(generate, check=True)

          human = session.get('human_view') or {}
          human_declared = bool(human)
          human_mmd = ''
          if human_declared:
              human_graph = str(human.get('graph', '')).strip()
              human_mmd = str(human.get('diagram', '')).strip()
              human_doc = str(human.get('document', '')).strip()
              if not human_graph or not human_mmd or not human_doc:
                  raise SystemExit('CURRENT_SEQUENCE_HUMAN_CONTRACT_INCOMPLETE')
              subprocess.run([
                  sys.executable,
                  'scripts/sequence_human_view.py',
                  '--root', '.',
                  '--actual-json', graph,
                  '--actual-mermaid', diagram,
                  '--output-json', human_graph,
                  '--output-mermaid', human_mmd,
                  '--output-markdown', human_doc,
                  '--session-id', session_id,
              ], check=True)

          report = str(session.get('acceptance_report', '')).strip()
          if not report:
              raise SystemExit('CURRENT_SEQUENCE_ACCEPTANCE_REPORT_MISSING')
          subprocess.run([
              sys.executable,
              'scripts/validate_sequence_contract.py',
              '--root', '.',
              '--session', session_path.as_posix(),
              '--report', report,
          ], check=True)
          if human_declared:
              subprocess.run([
                  sys.executable,
                  'scripts/validate_sequence_human_view.py',
                  '--root', '.',
                  '--session', session_path.as_posix(),
              ], check=True)
          subprocess.run([
              sys.executable,
              'scripts/validate_sequence_sessions.py',
              '--root', '.',
          ], check=True)

          output_path = Path(os.environ['GITHUB_OUTPUT'])
          with output_path.open('a', encoding='utf-8', newline='\n') as fh:
              fh.write(f'session_id={session_id}\n')
              fh.write(f'has_human={str(human_declared).lower()}\n')
              fh.write(f'human_mmd={human_mmd}\n')
              fh.write(f'actual_graph={graph}\n')
              fh.write(f'actual_mmd={diagram}\n')
              fh.write(f'acceptance_report={report}\n')
          print(f'CURRENT_SEQUENCE_SESSION={session_id}')
          print('CURRENT_SEQUENCE_GENERATION=PASS')
          PY

      - name: Render current human Mermaid diagram
        if: steps.current_sequence.outputs.has_human == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/puppeteer-config.json" <<'JSON'
          {"args":["--no-sandbox"]}
          JSON
          npx -y -p @mermaid-js/mermaid-cli@12.0.0 mmdc \
            -p "$RUNNER_TEMP/puppeteer-config.json" \
            -i "${{ steps.current_sequence.outputs.human_mmd }}" \
            -o "$RUNNER_TEMP/${{ steps.current_sequence.outputs.session_id }}.svg"
          test -s "$RUNNER_TEMP/${{ steps.current_sequence.outputs.session_id }}.svg"

      - name: Upload generated sequence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-sequence-evidence
          path: |
            ${{ steps.current_sequence.outputs.actual_graph }}
            ${{ steps.current_sequence.outputs.actual_mmd }}
            ${{ steps.current_sequence.outputs.acceptance_report }}
            docs/sequence/generated/${{ steps.current_sequence.outputs.session_id }}.human.json
            docs/sequence/generated/${{ steps.current_sequence.outputs.session_id }}.human.mmd
            docs/sequence/views/${{ steps.current_sequence.outputs.session_id }}.md
            ${{ runner.temp }}/${{ steps.current_sequence.outputs.session_id }}.svg
          if-no-files-found: error
          retention-days: 14
