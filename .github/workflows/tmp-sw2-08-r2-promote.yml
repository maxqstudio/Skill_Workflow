name: TEMP SW2-08 R2 Promotion

on:
  push:
    branches:
      - work/sw2-08-regression-adoption-validation

permissions:
  contents: write

jobs:
  promote-r2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-08-regression-adoption-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote exact R2 evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          acceptance_path = root / '.workflow' / 'acceptance.json'
          state_path = root / '.workflow' / 'state.json'
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))

          evidence = (
              'Exact candidate 5109b17de54de8af3d69e418d07175f62cf893d2 passed all six permanent checks. '
              'Consumer Engine Performance run 37167140718 validated pinned maxqstudio/max-grounding '
              '4c45a23c48b7954bbfb0ab86bcc92c975f345a1f after deterministic candidate-toolchain migration: '
              '153 source tests PASS, compile PASS, migration idempotence PASS, synchronized migrated Project Truth PASS, '
              'all STRICT governance validators PASS with clean worktree, and machine-readable parity evidence was uploaded. '
              'Against the accepted hosted-runner baseline, extract_project_facts improved by 11.12% and sync_project_truth '
              'improved by 60.48%; these are comparative CI measurements, not absolute performance guarantees. '
              'Self Governance 37167140714, Governance Selftest 37167140719 on Ubuntu and Windows, SW2 Sequence Evidence '
              '37167140716, Governance Engine Performance 37167140743, and Consumer Engine Performance 37167140718 all succeeded.'
          )
          for requirement in acceptance['requirements']:
              if requirement.get('id') == 'SW2-08-R2':
                  requirement['status'] = 'PASS'
                  requirement['evidence'] = evidence
                  break
          else:
              raise SystemExit('SW2-08-R2 missing')

          target = 'SW2-08 large real-consumer performance improvement and governance parity are NOT_PROVEN pending fresh exact-candidate evidence.'
          state['not_proven'] = [item for item in state.get('not_proven', []) if item != target]
          proven = (
              'SW2-08-R2 large-consumer adoption is accepted on exact candidate '
              '5109b17de54de8af3d69e418d07175f62cf893d2: pinned max-grounding '
              '4c45a23c48b7954bbfb0ab86bcc92c975f345a1f passed 153 source tests, deterministic/idempotent '
              'candidate-toolchain migration, full STRICT governance parity, and comparative hosted-runner improvements '
              'of 11.12% for extract_project_facts and 60.48% for sync_project_truth in Consumer run 37167140718.'
          )
          if proven not in state.get('proven', []):
              state.setdefault('proven', []).append(proven)
          state['next_authorized_actions'] = [
              'Prove migration regressions and false-PASS cases with the existing permanent fail-closed regression suite if coverage is sufficient; add only missing cases.',
              'Keep the final SW2-08 adoption/regression coverage green on Ubuntu and Windows before closure.'
          ]

          for path, data in ((acceptance_path, acceptance), (state_path, state)):
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Synchronize Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/state.json .workflow/generated docs PROJECT_PROFILE.yaml
          git commit -m "SW2-08: accept large-consumer performance and parity"
          git push origin HEAD:work/sw2-08-regression-adoption-validation
