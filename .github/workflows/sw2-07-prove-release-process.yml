name: SW2-07 Prove Release Process

on:
  push:
    branches:
      - work/sw2-07-public-project-hardening

permissions:
  contents: write

jobs:
  prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_HEAD: "6eacfe392ec033c943f2f4ca81f6ce278c91282e"
      ACCEPTED_MAIN: "f391fe9dc5d208803118090bbe6a174e8f6c7c63"
      BRANCH: "work/sw2-07-public-project-hardening"
      EVIDENCE_VERSION: "v2.0.0-sw2-07-evidence.2"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-07-public-project-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact feature lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/release-preflight.yml',
              '.github/workflows/sw2-07-prove-release-process.yml',
              'docs/handbook/reference/release-process.md',
              'scripts/release_preflight.py',
              'scripts/selftest_release_preflight.py',
          }
          observed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '0bf0e3aee46f8bfca7792f9457e49404b07b976b..HEAD'],
              text=True,
          ).splitlines())
          assert observed == expected, (observed, expected)
          print('R4_FEATURE_SCOPE=PASS')
          PY

      - name: Validate release-process source
        shell: bash
        run: |
          python -m compileall -q scripts
          python scripts/selftest_release_preflight.py
          python scripts/validate_public_docs.py --root .
          python scripts/validate_repository_health.py --root .

      - name: Regenerate sequence evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-07-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [
              sys.executable, 'scripts/generate_sequence_actual.py',
              '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']
          ]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest

          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py',
              '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session['session_id']
          ], check=True)
          human_graph = json.loads((root / human['graph']).read_text(encoding='utf-8'))
          assert human_graph['source_digest'] == digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report']
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_human_view.py', '--root', '.',
              '--session', session_path.as_posix()
          ], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_sessions.py', '--root', '.'], check=True)
          PY

      - name: Regenerate deterministic Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Commit regenerated candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo "FAIL NO_REGENERATION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-07): sync release-process evidence"

      - name: Prove exact-head evidence-only preflight
        shell: bash
        run: |
          candidate="$(git rev-parse HEAD)"
          python scripts/governance_engine.py \
            --root . \
            --base "$ACCEPTED_MAIN" \
            --mode verify \
            --expected-head "$candidate" \
            --report "${RUNNER_TEMP}/governance.json"
          python scripts/release_preflight.py \
            --root . \
            --expected-head "$candidate" \
            --version "$EVIDENCE_VERSION" \
            --governance-report "${RUNNER_TEMP}/governance.json" \
            --evidence-only \
            --report "${RUNNER_TEMP}/release-preflight.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-preflight.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS'
          assert report['evidence_only'] is True
          assert report['publication_authority'] is False
          assert report['stable'] is False
          assert report['governance_requested_mode'] == 'verify'
          assert report['governance_effective_mode'] in {'verify', 'finalize'}
          assert report['failures'] == []
          print('R4_EVIDENCE_ONLY_PREFLIGHT=PASS')
          print('R4_PUBLICATION_AUTHORITY_FALSE=PASS')
          PY

      - name: Upload R4 release-process evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw2-07-r4-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/governance.json
            ${{ runner.temp }}/release-preflight.json

      - name: Promote R4 only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          run_id = os.environ['GITHUB_RUN_ID']
          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = load('.workflow/acceptance.json')
          by_id = {item['id']: item for item in acceptance['requirements']}
          assert by_id['SW2-07-R1']['status'] == 'NOT_PROVEN'
          assert by_id['SW2-07-R2']['status'] == 'PASS'
          assert by_id['SW2-07-R3']['status'] == 'NOT_PROVEN'
          assert by_id['SW2-07-R4']['status'] == 'NOT_PROVEN'
          evidence = (
              f'GitHub Actions run {run_id} proved the repeatable release-process dry run on exact regenerated candidate {candidate}: '
              'governance verify request PASS with fail-closed breadth escalation allowed, evidence-only prerelease preflight PASS, '
              'clean exact-head binding PASS, JSON evidence uploaded, and publication_authority=false. Strict publication-ready preflight '
              'remains separately fail-closed and stable publication remains SW2-09 scope.'
          )
          by_id['SW2-07-R4']['status'] = 'PASS'
          by_id['SW2-07-R4']['evidence'] = evidence
          save('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          proof = 'SW2-07-R4 release process is repeatable and evidence-backed: ' + evidence
          if proof not in state['proven']:
              state['proven'].append(proof)
          state['not_proven'] = [item for item in state['not_proven'] if 'release preflight' not in item.lower()]
          assert len(state['blockers']) == 2
          save('.workflow/state.json', state)

          claims = load('.workflow/claims.json')
          release = next(item for item in claims['claims'] if item['id'] == 'TRUTH-SW2-RELEASE-GOVERNANCE')
          release['status'] = 'PASS'
          runtime = release.setdefault('runtime_evidence', [])
          if evidence not in runtime:
              runtime.append(evidence)
          save('.workflow/claims.json', claims)
          PY

      - name: Regenerate promoted Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Assert phase remains fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          a=json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          status={x['id']:x['status'] for x in a['requirements']}
          assert status == {
              'SW2-07-R1':'NOT_PROVEN',
              'SW2-07-R2':'PASS',
              'SW2-07-R3':'NOT_PROVEN',
              'SW2-07-R4':'PASS',
          }
          c=json.load(open('.workflow/claims.json', encoding='utf-8'))
          release=next(x for x in c['claims'] if x['id']=='TRUTH-SW2-RELEASE-GOVERNANCE')
          assert release['status']=='PASS'
          s=json.load(open('.workflow/state.json', encoding='utf-8'))
          assert len(s['blockers'])==2
          print('R4_PROMOTED_R1_R3_BLOCKED=PASS')
          PY
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .

      - name: Commit R4 promotion
        shell: bash
        run: |
          git add .workflow docs
          git diff --cached --quiet && { echo "FAIL NO_R4_PROMOTION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-07): accept repeatable release process"

      - name: Validate clean promoted candidate read only
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base "$ACCEPTED_MAIN" --mode verify --expected-head "$expected"
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated R4 promotion
        shell: bash
        run: git push origin HEAD:"$BRANCH"
