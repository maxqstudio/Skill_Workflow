name: Self Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  self-governance:
    name: Self Governance (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate provenance
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile governance scripts
        run: python -m compileall -q scripts

      - name: Remove compile artifacts
        shell: bash
        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Cross-document regression
        run: python scripts/selftest_cross_document_regressions.py

      - name: Remove regression import artifacts
        shell: bash
        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Generate synchronized self-governance state
        run: python scripts/sync_project_truth.py --root .

      - name: Upload generated governance preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-governance-generated
          path: |
            PROJECT_PROFILE.yaml
            .workflow/acceptance.json
            .workflow/generated/
            docs/
          if-no-files-found: warn
          retention-days: 7

      - name: Require tracked governance to be synchronized
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs)"
          if [ -n "$status" ]; then
            echo "Generated governance differs from the tracked candidate:"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Validate generated documentation
        run: python scripts/validate_project_docs.py --root .

      - name: Validate documentation quality
        run: python scripts/validate_doc_quality.py --root .

      - name: Validate human comprehension
        run: python scripts/validate_human_comprehension.py --root . --require-pass

      - name: Validate cross-document consistency
        shell: bash
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          test -n "$base"
          PYTHONDONTWRITEBYTECODE=1 python scripts/validate_cross_document_consistency.py --root . --base "$base" --require-base

      - name: Validate final project truth
        run: python scripts/validate_project_truth.py --root .

      - name: Require validators to remain read-only
        shell: bash
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          status="$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs)"
          if [ -n "$status" ]; then
            echo "Validator chain mutated governed state:"
            printf '%s\n' "$status"
            exit 1
          fi
