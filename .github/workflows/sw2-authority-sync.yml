name: SW2 Authority Projection Sync

on:
  push:
    branches:
      - work/sw2-00-baseline-self-governance
    paths:
      - .github/workflows/sw2-authority-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/work/sw2-00-baseline-self-governance'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize canonical project truth
        run: python scripts/sync_project_truth.py --root .

      - name: Commit generated projection only
        shell: bash
        run: |
          git add PROJECT_PROFILE.yaml .workflow/acceptance.json .workflow/generated/code_facts.json docs/*.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "NO_GENERATED_DRIFT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(sw2): synchronize SW2-00 authority projection"
          git push origin HEAD:work/sw2-00-baseline-self-governance
