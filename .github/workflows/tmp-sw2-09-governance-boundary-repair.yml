name: TEMP SW2-09 Governance Boundary Repair

on:
  push:
    branches:
      - work/sw2-09-v2-stable-release

permissions:
  contents: write

jobs:
  repair-boundary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-09-v2-stable-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove temporary workflow from final tree
        run: rm -f .github/workflows/tmp-sw2-09-governance-boundary-repair.yml
      - name: Repair accepted repository-governance claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.workflow/claims.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target = None
          for claim in data.get('claims', []):
              if claim.get('id') == 'TRUTH-SW2-MERGE-ENFORCEMENT':
                  target = claim
                  break
          if target is None:
              raise SystemExit('TRUTH-SW2-MERGE-ENFORCEMENT missing')

          target['claim'] = (
              'Repository-level merge-enforcement claims match the explicit Owner-approved boundary: '
              'when no GitHub ruleset is configured, project documentation must not claim automatic merge blocking or required-check enforcement.'
          )
          target['runtime_evidence'] = [
              'SW2-07 Owner decision accepted the no-ruleset boundary. Live repository ruleset audit returned an empty list, '
              'and exact final SW2-07 candidate 8dec9e65915c4b3e7d7fb13398887a2bc7f3df11 plus post-merge main '
              'bcc861bf9acc4a02702f5eec8bb45345617cd94a passed the permanent governance suite without claiming automatic GitHub enforcement.'
          ]
          target['source_owners'] = [
              'docs/handbook/reference/repository-governance.md',
              'scripts/validate_github_ruleset.py',
              'scripts/selftest_github_ruleset.py',
          ]
          target['tests'] = ['scripts/selftest_github_ruleset.py']
          target['status'] = 'PASS'

          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Validate ruleset policy regression
        run: python scripts/selftest_github_ruleset.py
      - name: Synchronize and validate Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base 8d0fbfd7177128774a0f321b8c95e6befdaaf659 --require-base
          python scripts/validate_project_truth.py --root . --project-docs-already-validated
      - name: Commit clean governance-boundary repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SW2-09: align repository governance claim with accepted boundary"
          git push origin HEAD:work/sw2-09-v2-stable-release
