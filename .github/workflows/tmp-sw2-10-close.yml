name: TEMP SW2-10 Closure

on:
  push:
    branches:
      - work/sw2-10-docs-polish

permissions:
  contents: write

jobs:
  close-sw2-10:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-10-docs-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply closure evidence
        shell: bash
        run: |
          python scripts/tmp_sw2_10_close.py
          rm scripts/tmp_sw2_10_close.py

      - name: Regenerate Project Truth
        shell: bash
        run: python scripts/sync_project_truth.py --root .

      - name: Validate generated closure before commit
        shell: bash
        run: |
          python -m compileall -q scripts
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/selftest_strict_project_workflow.py
          python scripts/validate_sequence_sessions.py --root .

      - name: Commit closure candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SW2-10: record accepted documentation evidence'

      - name: Validate exact clean closure
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_cross_document_consistency.py --root .
          python scripts/validate_project_truth.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/governance_engine.py --root . --base "$base" --mode finalize --expected-head "$expected"
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs scripts)"

      - name: Push closure candidate
        shell: bash
        run: git push origin HEAD:work/sw2-10-docs-polish
