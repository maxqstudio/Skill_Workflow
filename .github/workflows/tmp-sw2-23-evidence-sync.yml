name: tmp-sw2-23-evidence-sync
on:
  push:
    branches:
      - work/sw2-23-multi-consumer-adoption
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-23-multi-consumer-adoption
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync and validate intermediate SW2-23
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .github/scripts/tmp_sw2_23_evidence_sync.py
