name: TEMP SW2-16 Freeze

on:
  push:
    branches:
      - work/sw2-16-historical-evidence-freeze
    paths:
      - .github/workflows/tmp-sw2-16-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-16-historical-evidence-freeze
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove freeze primitives
        run: |
          python scripts/selftest_historical_evidence.py
          python -m compileall -q scripts

      - name: Freeze historical identities at phase-open authority
        run: |
          python scripts/validate_sequence_sessions.py \
            --root . \
            --freeze-historical \
            --authorize-migration "SW2-16 initial historical evidence freeze" \
            --frozen-commit 9b2920c57cb435cb5931a99a2399c774e498d958

      - name: Regenerate current SW2-16 sequence evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.').resolve()
          session_path = root / 'docs/sequence/sessions/SW2-16-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd += ['--entry', entry]
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
              '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session['session_id'],
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', 'docs/sequence/sessions/SW2-16-GOVERNANCE.json'
          ], check=True)
          PY

      - name: Regenerate Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Prove normal identity-only validation
        run: python scripts/validate_sequence_sessions.py --root .

      - name: Prove explicit authorized historical replay
        run: |
          python scripts/validate_sequence_sessions.py \
            --root . \
            --replay-historical \
            --authorize-replay

      - name: Remove helper and validate final implementation tree
        shell: bash
        run: |
          git rm .github/workflows/tmp-sw2-16-freeze.yml
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/selftest_historical_evidence.py
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .
          test ! -e .github/workflows/tmp-sw2-16-freeze.yml

      - name: Commit clean freeze candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'SW2-16: freeze historical evidence identities'
          git push origin HEAD:work/sw2-16-historical-evidence-freeze
