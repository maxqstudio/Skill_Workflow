name: tmp-sw2-21-doc-coverage

on:
  push:
    branches:
      - work/sw2-21-authorized-closure-defect-lifecycle

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-21-authorized-closure-defect-lifecycle
          fetch-depth: 0

      - name: Regenerate and verify documentation coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_documentation_contract.py --root . --write-report
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/selftest_closure_defect_lifecycle.py
          python scripts/selftest_cross_document_regressions.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow/generated/documentation_coverage.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'SW2-21: regenerate documentation coverage'
            git push origin HEAD:work/sw2-21-authorized-closure-defect-lifecycle
          fi
