name: SW2 Projection Sync

on:
  push:
    branches:
      - work/sw2-08-regression-adoption-validation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-08-regression-adoption-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact projections and remove helper
        shell: bash
        run: |
          rm .github/workflows/sw2-projection-sync.yml
          python scripts/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/SW2-08-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-08-GOVERNANCE.actual.mmd \
            --entry scripts/initialize_project_truth.py::main \
            --entry scripts/migrate_governance_v1.py::main \
            --entry scripts/benchmark_governance.py::main \
            --entry scripts/selftest_strict_project_workflow.py::main \
            --entry scripts/governance_engine.py::main
          python scripts/sequence_human_view.py --root . \
            --actual-json docs/sequence/generated/SW2-08-GOVERNANCE.actual.json \
            --actual-mermaid docs/sequence/generated/SW2-08-GOVERNANCE.actual.mmd \
            --output-json docs/sequence/generated/SW2-08-GOVERNANCE.human.json \
            --output-mermaid docs/sequence/generated/SW2-08-GOVERNANCE.human.mmd \
            --output-markdown docs/sequence/views/SW2-08-GOVERNANCE.md \
            --session-id SW2-08-GOVERNANCE
          python scripts/validate_sequence_contract.py --root . \
            --session docs/sequence/sessions/SW2-08-GOVERNANCE.json \
            --report artifacts/sequence/SW2-08-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . \
            --session docs/sequence/sessions/SW2-08-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/generate_project_docs.py --root .
          git status --short
      - name: Commit projection-only result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/sw2-projection-sync.yml \
            artifacts/sequence/SW2-08-GOVERNANCE.acceptance.json \
            docs/CURRENT_STATE.md docs/PROJECT_MANIFEST.md docs/PROJECT_TRUTH_SYNC.md \
            docs/ROADMAP.md docs/SEQUENCE_CONTRACTS.md docs/SYSTEM_OVERVIEW.md docs/TEST_ACCEPTANCE_MATRIX.md \
            docs/sequence/generated/SW2-08-GOVERNANCE.actual.json \
            docs/sequence/generated/SW2-08-GOVERNANCE.actual.mmd \
            docs/sequence/generated/SW2-08-GOVERNANCE.human.json \
            docs/sequence/generated/SW2-08-GOVERNANCE.human.mmd \
            docs/sequence/views/SW2-08-GOVERNANCE.md
          git diff --cached --check
          git commit -m "SW2-08: sync phase-open projections"
          git push origin HEAD:work/sw2-08-regression-adoption-validation
