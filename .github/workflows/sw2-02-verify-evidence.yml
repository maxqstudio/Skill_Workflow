name: SW2-02 Verify Evidence

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact branch candidate
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          rc=0
          python scripts/governance_engine.py \
            --root . \
            --base "$base" \
            --mode verify \
            --expected-head "$expected" \
            --report artifacts/sw2-02-verify.json || rc=$?
          echo "VERIFY_ENGINE_RC=$rc"
          echo "VERIFY_POST_STATUS_BEGIN"
          git status --porcelain --untracked-files=all
          echo "VERIFY_POST_STATUS_END"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/sw2-02-verify.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS', report
          assert report['requested_mode'] == 'verify', report
          assert report['effective_mode'] == 'verify', report
          assert report['final_acceptance_authority'] is False, report
          print('SW2_02_VERIFY_MODE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw2-02-verify-${{ matrix.os }}
          path: artifacts/sw2-02-verify.json
          if-no-files-found: warn
          retention-days: 14
