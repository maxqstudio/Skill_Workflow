name: SW2-02 Source-bound Regeneration

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind SW2-02 session to current source digest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .github/sw2-02-regenerate.txt
      - name: Regenerate and validate sequence evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/generate_sequence_actual.py --root . --output-json docs/sequence/generated/SW2-02-GOVERNANCE.actual.json --output-mermaid docs/sequence/generated/SW2-02-GOVERNANCE.actual.mmd --entry scripts/governance_engine.py::main
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-02-GOVERNANCE.json --report artifacts/sequence/SW2-02-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_sessions.py --root .
      - name: Regenerate canonical Project Truth
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/sync_project_truth.py --root .
      - name: Validate regenerated docs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_project_docs.py --root .
      - name: Commit generated evidence only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sequence/sessions/SW2-02-GOVERNANCE.json docs/sequence/generated/SW2-02-GOVERNANCE.actual.json docs/sequence/generated/SW2-02-GOVERNANCE.actual.mmd artifacts/sequence/SW2-02-GOVERNANCE.acceptance.json .workflow/acceptance.json .workflow/generated docs/*.md
          git diff --cached --quiet && { echo "NO_GENERATED_DIFF"; exit 0; }
          git commit -m "docs(sw2): regenerate SW2-02 source-bound evidence"
          git push origin HEAD:work/sw2-02-fast-development-workflow
