name: TEMP SW2-08 R1 Promotion

on:
  push:
    branches:
      - work/sw2-08-regression-adoption-validation

permissions:
  contents: write

jobs:
  promote-r1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-08-regression-adoption-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote exact R1 evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          acceptance_path = root / '.workflow' / 'acceptance.json'
          state_path = root / '.workflow' / 'state.json'
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))

          evidence = (
              'Exact clean candidate a1357f0f5a14874ccbc301191e7e05afd3fa13ae proved the representative adoption matrix: '
              'Governance Selftest run 37166844760 passed on Ubuntu and Windows, with LITE and STANDARD adoption fixtures PASS '
              'and the existing STRICT end-to-end workflow self-test PASS on both operating systems. The same exact candidate also passed '
              'Self Governance run 37166844768, SW2 Sequence Evidence run 37166844763, Governance Engine Performance run 37166844780, '
              'and Consumer Engine Performance run 37166844767.'
          )
          for requirement in acceptance['requirements']:
              if requirement.get('id') == 'SW2-08-R1':
                  requirement['status'] = 'PASS'
                  requirement['evidence'] = evidence
                  break
          else:
              raise SystemExit('SW2-08-R1 missing')

          command = 'python scripts/selftest_adoption_profiles.py'
          if command not in acceptance['test_commands']:
              strict = 'python scripts/selftest_strict_project_workflow.py'
              idx = acceptance['test_commands'].index(strict) if strict in acceptance['test_commands'] else len(acceptance['test_commands'])
              acceptance['test_commands'].insert(idx, command)

          not_proven = 'SW2-08 representative LITE, STANDARD, and STRICT fixture acceptance is NOT_PROVEN.'
          state['not_proven'] = [item for item in state.get('not_proven', []) if item != not_proven]
          proven = 'SW2-08-R1 representative adoption matrix is accepted on exact clean candidate a1357f0f5a14874ccbc301191e7e05afd3fa13ae: Governance Selftest 37166844760 passed LITE, STANDARD, and STRICT fixtures on Ubuntu and Windows; Self Governance 37166844768, SW2 Sequence Evidence 37166844763, Governance Engine Performance 37166844780, and Consumer Engine Performance 37166844767 also succeeded.'
          if proven not in state.get('proven', []):
              state.setdefault('proven', []).append(proven)
          state['next_authorized_actions'] = [
              'Run fresh exact-candidate large-consumer performance and governance-parity evidence.',
              'Prove migration regressions and false-PASS cases with focused fail-closed regression evidence.',
              'Keep the resulting SW2-08 adoption/regression coverage green on Ubuntu and Windows before closure.'
          ]

          for path, data in ((acceptance_path, acceptance), (state_path, state)):
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Synchronize Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/state.json .workflow/generated docs PROJECT_PROFILE.yaml
          git commit -m "SW2-08: accept representative adoption matrix"
          git push origin HEAD:work/sw2-08-regression-adoption-validation
