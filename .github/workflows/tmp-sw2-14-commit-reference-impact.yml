name: TEMP SW2-14 Commit Reference Impact Repair

on:
  push:
    branches:
      - work/sw2-14-incremental-project-truth
    paths:
      - .github/workflows/tmp-sw2-14-commit-reference-impact.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-14-incremental-project-truth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply minimal reference impact repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('scripts/governance_engine.py')
          text = engine.read_text(encoding='utf-8')
          old = '''    if path in {"SKILL.md", "README.md"} or path.startswith("docs/"):\n        return "documentation"\n'''
          new = '''    if (\n        path in {"SKILL.md", "README.md"}\n        or path.startswith("docs/")\n        or path.startswith("references/")\n    ):\n        return "documentation"\n'''
          if text.count(old) != 1:
              raise RuntimeError('ENGINE_REFERENCE_CLASSIFICATION_ANCHOR')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('scripts/selftest_governance_engine.py')
          text = test.read_text(encoding='utf-8')
          anchor = '''    support_impacts = classify_changed_paths(\n        (".gitattributes", "artifacts/sequence/SW2-02-GOVERNANCE.acceptance.json")\n    )\n'''
          addition = '''    reference_impacts = classify_changed_paths(("references/governance-and-project-truth.md",))\n    require(\n        reference_impacts == ("documentation",),\n        f"normative reference fragment misclassified: {reference_impacts}",\n    )\n    require(\n        effective_mode("verify", reference_impacts) == "verify",\n        "normative reference fragment should not escalate verify to finalize",\n    )\n\n'''
          if text.count(anchor) != 1:
              raise RuntimeError('ENGINE_REFERENCE_SELFTEST_ANCHOR')
          test.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8', newline='\n')
          PY
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
      - name: Synchronize exhaustive Project Truth
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/selftest_cross_document_regressions.py
      - name: Synchronize current SW2-14 sequence
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          root = Path('.').resolve()
          session_path = root / 'docs/sequence/sessions/SW2-14-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          command = [
              sys.executable,
              'scripts/generate_sequence_actual.py',
              '--root', '.',
              '--output-json', actual['graph'],
              '--output-mermaid', actual['diagram'],
          ]
          for entry in actual.get('entries', []):
              command.extend(['--entry', entry])
          subprocess.run(command, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          if session.get('human_view'):
              session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          human = session['human_view']
          subprocess.run([
              sys.executable,
              'scripts/sequence_human_view.py',
              '--root', '.',
              '--actual-json', actual['graph'],
              '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'],
              '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'],
              '--session-id', session['session_id'],
          ], check=True)
          PY
          python scripts/validate_sequence_sessions.py --root .
      - name: Remove all temporary helpers
        shell: bash
        run: |
          rm .github/workflows/tmp-sw2-14-fix-reference-impact.yml
          rm .github/workflows/tmp-sw2-14-fix-reference-impact-v2.yml
          rm .github/workflows/tmp-sw2-14-commit-reference-impact.yml
      - name: Validate exact helper-free repair tree
        shell: bash
        run: |
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_sequence_sessions.py --root .
      - name: Commit synchronized repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "SW2-14: classify normative references as documentation impact"
          git push origin HEAD:work/sw2-14-incremental-project-truth
