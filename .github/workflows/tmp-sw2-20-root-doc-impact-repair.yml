name: TEMP SW2-20 Root Documentation Impact Repair

on:
  push:
    branches:
      - work/sw2-20-documentation-inventory-freshness
    paths:
      - .github/workflows/tmp-sw2-20-root-doc-impact-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-20-documentation-inventory-freshness
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch root documentation impact classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('scripts/governance_engine.py')
          text = engine.read_text(encoding='utf-8')
          old = '''    if (\n        path in {"SKILL.md", "README.md"}\n        or path.startswith("docs/")\n        or path.startswith("references/")\n    ):\n        return "documentation"\n'''
          new = '''    if (\n        path in {\n            "AGENTS.md",\n            "CODE_OF_CONDUCT.md",\n            "CONTRIBUTING.md",\n            "LICENSE",\n            "README.md",\n            "SECURITY.md",\n            "SKILL.md",\n        }\n        or path.startswith("docs/")\n        or path.startswith("references/")\n    ):\n        return "documentation"\n'''
          if text.count(old) != 1:
              raise RuntimeError('ROOT_DOCUMENTATION_CLASSIFIER_ANCHOR')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test = Path('scripts/selftest_governance_engine.py')
          text = test.read_text(encoding='utf-8')
          anchor = '''    support_impacts = classify_changed_paths(\n        (".gitattributes", "artifacts/sequence/SW2-02-GOVERNANCE.acceptance.json")\n    )\n'''
          insertion = '''    root_doc_impacts = classify_changed_paths(\n        (\n            "AGENTS.md",\n            "CODE_OF_CONDUCT.md",\n            "CONTRIBUTING.md",\n            "LICENSE",\n            "README.md",\n            "SECURITY.md",\n            "SKILL.md",\n        )\n    )\n    require(\n        root_doc_impacts == ("documentation",),\n        f"root documentation misclassified: {root_doc_impacts}",\n    )\n    require(\n        effective_mode("verify", root_doc_impacts) == "verify",\n        "known root documentation should not escalate verify to finalize",\n    )\n\n''' + anchor
          if text.count(anchor) != 1:
              raise RuntimeError('ROOT_DOCUMENTATION_SELFTEST_ANCHOR')
          test.write_text(text.replace(anchor, insertion, 1), encoding='utf-8', newline='\n')
          PY

      - name: Remove helper from local acceptance tree
        run: git rm .github/workflows/tmp-sw2-20-root-doc-impact-repair.yml

      - name: Prove classifier and fail-closed unknown path regression
        run: python scripts/selftest_governance_engine.py

      - name: Regenerate current SW2-20 sequence evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          acceptance = json.loads((root / '.workflow/acceptance.json').read_text(encoding='utf-8'))
          session_id = str(acceptance['sequence_session'])
          session_path = root / 'docs/sequence/sessions' / f'{session_id}.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
              '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session_id,
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report'],
          ], check=True)
          PY

      - name: Regenerate Project Truth and validate helper-free tree
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_documentation_contract.py --root . --write-report
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_repository_health.py --root .

      - name: Commit repair without temporary workflow mutation
        shell: bash
        run: |
          git restore --staged .github/workflows/tmp-sw2-20-root-doc-impact-repair.yml
          git add scripts .workflow docs artifacts/sequence
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Temporary workflow unexpectedly staged'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SW2-20: classify root documentation impact'
          git push origin HEAD:work/sw2-20-documentation-inventory-freshness
