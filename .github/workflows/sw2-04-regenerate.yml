name: SW2-04 Regenerate Documentation Evidence

on:
  push:
    branches:
      - work/sw2-04-documentation-system-v2

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-04-documentation-system-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update SW2-04 semantic authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          decisions = load('.workflow/decisions.json')
          if not any(item.get('id') == 'SW2-ADR-006' for item in decisions['decisions']):
              decisions['decisions'].append({
                  'id': 'SW2-ADR-006',
                  'title': 'Separate public product documentation without moving consumer Project Truth paths',
                  'decision': 'Skill Workflow repository product documentation uses a source-authored public navigator at docs/README.md and handbook under docs/handbook/, while canonical deterministic Project Truth and machine indexes remain at their established docs/ paths. The public layer must never replace project-state authority or machine evidence.',
                  'rationale': 'The previous README mixed landing, installation matrix, governance theory, tool reference, and generated project-state concepts. Moving canonical consumer Project Truth paths only to improve repository presentation would create avoidable migration risk. A distinct public layer improves GitHub readability while preserving compatibility and audit evidence.',
                  'status': 'ACCEPTED'
              })
          write('.workflow/decisions.json', decisions)

          acceptance = load('.workflow/acceptance.json')
          for command in ('python scripts/selftest_public_docs.py', 'python scripts/validate_public_docs.py --root .'):
              if command not in acceptance['test_commands']:
                  acceptance['test_commands'].insert(1, command)
          write('.workflow/acceptance.json', acceptance)

          claims = load('.workflow/claims.json')
          claim_map = {claim['id']: claim for claim in claims['claims']}
          for claim_id in ('TRUTH-SW2-DOCS-PUBLIC-IA', 'TRUTH-SW2-DOCS-SEPARATION'):
              claim = claim_map[claim_id]
              if 'scripts/validate_public_docs.py' not in claim['source_owners']:
                  claim['source_owners'].append('scripts/validate_public_docs.py')
              if 'scripts/selftest_public_docs.py' not in claim['tests']:
                  claim['tests'].append('scripts/selftest_public_docs.py')
          write('.workflow/claims.json', claims)

          session = load('docs/sequence/sessions/SW2-04-GOVERNANCE.json')
          entry = 'scripts/validate_public_docs.py::main'
          if entry not in session['actual']['entries']:
              session['actual']['entries'].append(entry)
          if 'scripts/selftest_public_docs.py' not in session['tests']:
              session['tests'].append('scripts/selftest_public_docs.py')
          write('docs/sequence/sessions/SW2-04-GOVERNANCE.json', session)
          print('SW2_04_PUBLIC_DOC_AUTHORITY=PASS')
          PY

      - name: Run public documentation regressions
        run: |
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root . --report artifacts/public_docs_report.json

      - name: Regenerate current SW2-04 sequence evidence
        run: |
          python scripts/generate_sequence_actual.py --root . --output-json docs/sequence/generated/SW2-04-GOVERNANCE.actual.json --output-mermaid docs/sequence/generated/SW2-04-GOVERNANCE.actual.mmd --entry scripts/generate_project_docs.py::main --entry scripts/validate_project_docs.py::main --entry scripts/validate_doc_quality.py::main --entry scripts/validate_human_comprehension.py::main --entry scripts/validate_public_docs.py::main
          python scripts/sequence_human_view.py --root . --actual-json docs/sequence/generated/SW2-04-GOVERNANCE.actual.json --actual-mermaid docs/sequence/generated/SW2-04-GOVERNANCE.actual.mmd --output-json docs/sequence/generated/SW2-04-GOVERNANCE.human.json --output-mermaid docs/sequence/generated/SW2-04-GOVERNANCE.human.mmd --output-markdown docs/sequence/views/SW2-04-GOVERNANCE.md --session-id SW2-04-GOVERNANCE
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.load(open('docs/sequence/generated/SW2-04-GOVERNANCE.actual.json', encoding='utf-8'))
          human = json.load(open('docs/sequence/generated/SW2-04-GOVERNANCE.human.json', encoding='utf-8'))
          digest = actual['source_digest']
          assert digest and human['source_digest'] == digest
          session_path = Path('docs/sequence/sessions/SW2-04-GOVERNANCE.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['sequence_sync_status'] = 'PASS'
          acceptance['truth_gates']['SEQUENCE_SYNC'] = 'PASS'
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print('SW2_04_SEQUENCE_REBOUND=PASS')
          PY

      - name: Regenerate and validate Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_public_docs.py --root . --report artifacts/public_docs_report.json
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-04-GOVERNANCE.json --report artifacts/sequence/SW2-04-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-04-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert phase remains fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert all(item['status'] == 'NOT_PROVEN' for item in acceptance['requirements']), acceptance['requirements']
          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claim_map = {item['id']: item for item in claims['claims']}
          assert claim_map['TRUTH-SW2-DOCS-PUBLIC-IA']['status'] == 'NOT_PROVEN'
          assert claim_map['TRUTH-SW2-DOCS-SEPARATION']['status'] == 'NOT_PROVEN'
          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-04' and state['status'] == 'IN_PROGRESS'
          print('SW2_04_IMPLEMENTATION_STILL_NOT_PROVEN=PASS')
          PY

      - name: Commit regenerated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/public_docs_report.json artifacts/sequence/SW2-04-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_REGEN_DIFF"; exit 1; }
          git commit -m "gov(sw2-04): regenerate documentation evidence"
          git push origin HEAD:work/sw2-04-documentation-system-v2
