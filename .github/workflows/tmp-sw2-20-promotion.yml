name: TEMP SW2-20 Promotion

on:
  push:
    branches:
      - work/sw2-20-documentation-inventory-freshness
    paths:
      - .github/workflows/tmp-sw2-20-promotion.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-20-documentation-inventory-freshness
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote SW2-20 acceptance from exact implementation evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          CANDIDATE = '2ec6511fb6640f654667c42796d486950072d055'
          RUN = '37398146243'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = load('.workflow/acceptance.json')
          evidence = {
              'SW2-20-R1': f'PASS on exact implementation candidate {CANDIDATE}: deterministic git-tracked documentation inventory classified all 124 discovered documentation surfaces exactly once; public-doc regression in Governance CI run {RUN} passed baseline inventory, unclassified rejection, and add/delete/move/rename coverage-drift rejection on Ubuntu and Windows.',
              'SW2-20-R2': f'PASS on exact implementation candidate {CANDIDATE}: authority-bound freshness validation passed for stable release v2.1.0, current phase SW2-20, MIT license state, and Owner-approved no-ruleset boundary; stale release/phase/license/pre-release/enforcement fixtures all failed closed in Governance CI run {RUN}.',
              'SW2-20-R3': f'PASS on exact implementation candidate {CANDIDATE}: .workflow/generated/documentation_coverage.json reports 124/124 classified surfaces with zero freshness failures; regression reproduces confirmed stale README, CONTRIBUTING, SECURITY, release/versioning, unclassified, and coverage-drift classes in Governance CI run {RUN}.',
              'SW2-20-R4': f'PASS boundary established on exact implementation candidate {CANDIDATE}: Governance Selftest Ubuntu and Windows, SW2 Sequence Evidence, Governance Engine Performance, and Consumer Engine Performance all succeeded in Governance CI run {RUN}; pre-promotion Self Governance reached only the expected Project Truth promotion boundary. Final post-promotion 6/6 remains mandatory before merge.',
          }
          for item in acceptance['requirements']:
              rid = item['id']
              if rid not in evidence:
                  raise RuntimeError('UNEXPECTED_SW2_20_REQUIREMENT:' + rid)
              item['status'] = 'PASS'
              item['evidence'] = evidence[rid]
          acceptance['sequence_sync_status'] = 'PASS'
          for gate, status in list(acceptance['truth_gates'].items()):
              if status != 'NOT_APPLICABLE':
                  acceptance['truth_gates'][gate] = 'PASS'
          write('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          state['status'] = 'SW2_20_DOCUMENTATION_INVENTORY_FRESHNESS_ACCEPTED'
          state['working_branch'] = 'main'
          state['blockers'] = []
          state['not_proven'] = [
              'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.'
          ]
          state['blocked_actions'] = [
              'Do not weaken or bypass deterministic documentation discovery/classification or freshness validation.',
              'Do not replace tracked-document discovery with a hand-maintained complete-file allowlist.',
              'Do not claim automatic GitHub merge protection or required-check enforcement while no repository ruleset is configured.',
              'Do not begin a new governed phase until SW2-20 is merged and accepted on main.'
          ]
          state['next_authorized_actions'] = [
              'Run the complete permanent exact-head matrix on the promoted SW2-20 candidate.',
              'If and only if all permanent contexts pass, mark PR #33 ready and squash-merge with an expected-head guard.',
              'Verify merged-tree identity and the complete post-merge main matrix before declaring SW2-20 closed.'
          ]
          proven = list(state.get('proven', []))
          record = (
              f'SW2-20 Deterministic Documentation Inventory & Freshness Contract is promoted from exact implementation candidate {CANDIDATE}: '
              f'Governance CI run {RUN} passed Governance Selftest on Ubuntu and Windows, SW2 Sequence Evidence, Governance Engine Performance, '
              'and Consumer Engine Performance; deterministic coverage reported 124/124 classified tracked documentation surfaces with zero freshness failures, '
              'and Self Governance stopped only at the expected pre-promotion Project Truth boundary.'
          )
          if record not in proven:
              proven.append(record)
          state['proven'] = proven
          write('.workflow/state.json', state)
          PY

      - name: Remove helper from local acceptance tree
        run: git rm .github/workflows/tmp-sw2-20-promotion.yml

      - name: Regenerate current SW2-20 sequence evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          acceptance = json.loads((root / '.workflow/acceptance.json').read_text(encoding='utf-8'))
          session_id = str(acceptance['sequence_session'])
          session_path = root / 'docs/sequence/sessions' / f'{session_id}.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py', '--root', '.',
              '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session_id,
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report'],
          ], check=True)
          PY

      - name: Regenerate Project Truth and validate promoted helper-free tree
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_documentation_contract.py --root . --write-report
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/selftest_public_docs.py
          python scripts/selftest_governance_engine.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_repository_health.py --root .

      - name: Commit promoted authority without temporary workflow mutation
        shell: bash
        run: |
          git restore --staged .github/workflows/tmp-sw2-20-promotion.yml
          git add .workflow docs artifacts/sequence
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Temporary workflow unexpectedly staged'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SW2-20: promote documentation freshness acceptance'
          git push origin HEAD:work/sw2-20-documentation-inventory-freshness
