name: TEMP SW2-11 Sequence Rebind

on:
  push:
    branches:
      - work/sw2-11-root-agents-contract

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: "51963cac28f78e8c9c5052bcbdc5270b5bc93989"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-11-root-agents-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and bind clean SW2-11 evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-11-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([sys.executable, 'scripts/sequence_human_view.py', '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'], '--output-json', human['graph'], '--output-mermaid', human['diagram'], '--output-markdown', human['document'], '--session-id', session['session_id']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.', '--session', session_path.as_posix(), '--report', session['acceptance_report']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_human_view.py', '--root', '.', '--session', session_path.as_posix()], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_sessions.py', '--root', '.'], check=True)
          subprocess.run([sys.executable, 'scripts/sync_project_truth.py', '--root', '.'], check=True)
          print('BOUND_SOURCE_DIGEST=' + digest)
          PY
      - name: Commit synchronized evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence
          git commit -m "SW2-11: bind sequence to clean candidate"
          head="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all -- .workflow docs artifacts/sequence scripts AGENTS.md templates/AGENTS.md)"
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$BASE_SHA" --require-base
          python scripts/validate_project_truth.py --root .
          git push origin HEAD:work/sw2-11-root-agents-contract
          echo "SYNCED_HEAD=$head"
