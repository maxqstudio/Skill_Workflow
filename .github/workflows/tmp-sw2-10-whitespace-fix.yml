name: TEMP SW2-10 Whitespace Generator Repair

on:
  push:
    branches:
      - work/sw2-10-docs-polish

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-10-docs-polish
          fetch-depth: 0
      - name: Repair generator and remove repair workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('.github/workflows/tmp-sw2-10-docs-polish.yml')
          text = target.read_text(encoding='utf-8')
          old = '**Stable release:** `v2.0.0`  \n'
          new = '**Stable release:** `v2.0.0`\n'
          if old not in text:
              raise SystemExit('EXPECTED_WHITESPACE_PATTERN_NOT_FOUND')
          target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          Path('.github/workflows/tmp-sw2-10-whitespace-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove generated README trailing whitespace'
          git push origin HEAD:work/sw2-10-docs-polish
