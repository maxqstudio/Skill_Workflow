name: SW2-03 Open Authority

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open SW2-03 fail-closed authority
        run: python .github/sw2-03-open-authority.txt open
      - name: Generate initial SW2-03 machine sequence evidence
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py \
            --root . \
            --output-json docs/sequence/generated/SW2-03-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-03-GOVERNANCE.actual.mmd \
            --entry scripts/generate_sequence_actual.py::main \
            --entry scripts/validate_sequence_contract.py::main \
            --entry scripts/validate_sequence_sessions.py::main
          python .github/sw2-03-open-authority.txt bind-sequence
          python scripts/validate_sequence_contract.py \
            --root . \
            --session docs/sequence/sessions/SW2-03-GOVERNANCE.json \
            --report artifacts/sequence/SW2-03-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_sessions.py --root .
          python .github/sw2-03-open-authority.txt record-sequence-pass
      - name: Regenerate deterministic Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
      - name: Assert phase transaction
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roadmap = json.load(open('.workflow/roadmap.json', encoding='utf-8'))
          phases = {p['id']: p for p in roadmap['phases']}
          assert roadmap['current_phase'] == 'SW2-03', roadmap
          assert phases['SW2-02']['status'] == 'COMPLETE', phases['SW2-02']
          assert phases['SW2-03']['status'] == 'CURRENT', phases['SW2-03']
          assert sum(p['status'] == 'CURRENT' for p in roadmap['phases']) == 1, roadmap

          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-03', state
          assert state['status'] == 'IN_PROGRESS', state

          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          requirements = acceptance['requirements']
          assert [r['id'] for r in requirements] == ['SW2-03-R1', 'SW2-03-R2', 'SW2-03-R3', 'SW2-03-R4'], requirements
          assert all(r['status'] == 'NOT_PROVEN' for r in requirements), requirements
          assert acceptance['sequence_session'] == 'SW2-03-GOVERNANCE', acceptance
          assert acceptance['sequence_sync_status'] == 'PASS', acceptance

          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claim_map = {c['id']: c for c in claims['claims']}
          assert claim_map['TRUTH-SW2-MODE-SAFETY']['status'] == 'PASS', claim_map['TRUTH-SW2-MODE-SAFETY']
          assert claim_map['TRUTH-SW2-SEQUENCE-FIDELITY']['status'] == 'NOT_PROVEN', claim_map['TRUTH-SW2-SEQUENCE-FIDELITY']
          assert claim_map['TRUTH-SW2-SEQUENCE-PRESENTATION']['status'] == 'NOT_PROVEN', claim_map['TRUTH-SW2-SEQUENCE-PRESENTATION']

          old_session = json.load(open('docs/sequence/sessions/SW2-02-GOVERNANCE.json', encoding='utf-8'))
          new_session = json.load(open('docs/sequence/sessions/SW2-03-GOVERNANCE.json', encoding='utf-8'))
          assert old_session['scope'] == 'HISTORICAL', old_session
          assert old_session['status'] == 'COMPLETE', old_session
          assert new_session['scope'] == 'CURRENT', new_session
          assert new_session['phase'] == 'SW2-03', new_session
          assert new_session['actual']['source_digest'] != 'PENDING_GENERATION', new_session
          assert Path(new_session['actual']['graph']).is_file(), new_session
          assert Path(new_session['actual']['diagram']).is_file(), new_session
          print('SW2_03_PHASE_TRANSACTION=PASS')
          PY
      - name: Commit authority transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence/SW2-03-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_TRANSITION_DIFF"; exit 0; }
          git commit -m "gov(sw2): close SW2-02 and open SW2-03"
          git push origin HEAD:work/sw2-02-fast-development-workflow
