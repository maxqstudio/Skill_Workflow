name: SW2-13 Resync After Windows Repair

on:
  push:
    branches:
      - work/sw2-13-skill-core-reference-split
    paths:
      - .github/workflows/tmp-sw2-13-resync.yml

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-13-skill-core-reference-split
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove transient helper
        run: git rm .github/workflows/tmp-sw2-13-resync.yml

      - name: Verify repaired skill contract
        run: |
          python .github/scripts/selftest_skill_reference_split.py
          python .github/scripts/validate_skill_reference_split.py --root .

      - name: Regenerate SW2-13 sequence evidence
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/SW2-13-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-13-GOVERNANCE.actual.mmd \
            --entry .github/scripts/validate_skill_reference_split.py::main \
            --entry scripts/validate_project_docs.py::main \
            --entry scripts/validate_cross_document_consistency.py::main \
            --entry scripts/sync_project_truth.py::main \
            --entry scripts/validate_sequence_sessions.py::main \
            --entry scripts/governance_engine.py::main
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('docs/sequence/generated/SW2-13-GOVERNANCE.actual.json').read_text(encoding='utf-8'))
          path = Path('docs/sequence/sessions/SW2-13-GOVERNANCE.json')
          session = json.loads(path.read_text(encoding='utf-8'))
          digest = actual['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          path.write_text(json.dumps(session, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          artifact_path = Path('artifacts/sw2-13-skill-core-reference-split.json')
          artifact = json.loads(artifact_path.read_text(encoding='utf-8'))
          artifact['windows_newline_portability_repair'] = 'PASS_TARGETED'
          artifact['newline_policy'] = 'Normalize CRLF/CR to LF before frontmatter, line-budget, byte-budget, invariant, and reference checks.'
          artifact_path.write_text(json.dumps(artifact, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python scripts/sequence_human_view.py --root . \
            --actual-json docs/sequence/generated/SW2-13-GOVERNANCE.actual.json \
            --actual-mermaid docs/sequence/generated/SW2-13-GOVERNANCE.actual.mmd \
            --output-json docs/sequence/generated/SW2-13-GOVERNANCE.human.json \
            --output-mermaid docs/sequence/generated/SW2-13-GOVERNANCE.human.mmd \
            --output-markdown docs/sequence/views/SW2-13-GOVERNANCE.md \
            --session-id SW2-13-GOVERNANCE
          python scripts/validate_sequence_contract.py --root . \
            --session docs/sequence/sessions/SW2-13-GOVERNANCE.json \
            --report artifacts/sequence/SW2-13-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . \
            --session docs/sequence/sessions/SW2-13-GOVERNANCE.json

      - name: Resynchronize Project Truth and targeted gates
        run: |
          python scripts/sync_project_truth.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/selftest_repository_health.py
          python scripts/validate_repository_health.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .

      - name: Commit clean repaired candidate
        shell: bash
        run: |
          test ! -e .github/workflows/tmp-sw2-13-resync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SW2-13: resync after cross-platform newline repair"
          git push origin HEAD:work/sw2-13-skill-core-reference-split
