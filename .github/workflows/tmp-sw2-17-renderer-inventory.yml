name: TEMP SW2-17 Renderer Inventory

on:
  push:
    branches:
      - work/sw2-17-generator-modularization
    paths:
      - .github/workflows/tmp-sw2-17-renderer-inventory.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-17-generator-modularization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('scripts/generate_project_docs.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          funcs = {n.name:n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          renders = sorted(name for name in funcs if name.startswith('render_'))
          print('RENDERERS=' + ','.join(renders))
          used = set()
          for name in renders:
              for node in ast.walk(funcs[name]):
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load):
                      used.add(node.id)
          helpers = sorted(name for name in used if name in funcs and not name.startswith('render_'))
          print('DIRECT_HELPERS=' + ','.join(helpers))
          pending = list(helpers)
          closure = set(helpers)
          while pending:
              cur = pending.pop()
              for node in ast.walk(funcs[cur]):
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load):
                      dep = node.id
                      if dep in funcs and not dep.startswith('render_') and dep not in closure:
                          closure.add(dep); pending.append(dep)
          print('HELPER_CLOSURE=' + ','.join(sorted(closure)))
          print('RENDERER_COUNT=' + str(len(renders)))
          PY
