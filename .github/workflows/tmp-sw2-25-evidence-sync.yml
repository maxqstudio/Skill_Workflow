name: tmp-sw2-25-evidence-sync
on:
  push:
    branches:
      - work/sw2-25-reproducible-release-bundle
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-25-reproducible-release-bundle
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify real package tests and CI policy before evidence promotion
        run: |
          python .github/scripts/selftest_release_bundle.py
          python .github/scripts/validate_release_bundle_ci.py
          python .github/scripts/selftest_release_bundle_ci.py
          python .github/scripts/validate_unified_ci.py --root .
      - name: Reconcile exact cross-platform source authority and documentation
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          def load(path): return json.loads(Path(path).read_text(encoding="utf-8"))
          def save(path,data): Path(path).write_text(json.dumps(data,indent=2,sort_keys=True)+"\n",encoding="utf-8",newline="\n")
          acceptance=load(".workflow/acceptance.json")
          assert [x["status"] for x in acceptance["requirements"]]==["PASS"]*5+["NOT_PROVEN"]
          state=load(".workflow/state.json")
          assert state["phase"]=="SW2-25" and state["status"]=="SW2_25_R1_R5_PROVEN_PENDING_EXACT_MERGE"
          qpath="docs/sequence/sessions/SW2-25-GOVERNANCE.json"
          q=load(qpath)
          assert q["scope"]=="CURRENT" and q["status"]=="IN_PROGRESS"
          q["actual"]["entries"]=[
              ".github/scripts/release_bundle.py::build",
              ".github/scripts/release_bundle.py::verify",
              ".github/scripts/release_bundle.py::source_tree",
              "scripts/release_preflight.py::validate",
              "scripts/toolchain_identity.py::producer_metadata"
          ]
          q["tests"]=[".github/scripts/selftest_release_bundle.py",
                      ".github/scripts/selftest_release_bundle_ci.py",
                      "scripts/selftest_release_preflight.py"]
          q["evidence_boundary"]="Static exact-source graph covers producer build, source Git blob selection, detached integrity verification, and distinct release preflight. Actual cross-OS byte parity and fail-closed paths are evidenced by GitHub CI, not inferred from static graph; no publication authority."
          ac=q["actual"]
          cmd=[sys.executable,"scripts/generate_sequence_actual.py","--root",".","--output-json",ac["graph"],"--output-mermaid",ac["diagram"]]
          for entry in ac["entries"]:cmd.extend(["--entry",entry])
          subprocess.run(cmd,check=True)
          hv=q["human_view"]
          subprocess.run([sys.executable,"scripts/sequence_human_view.py","--root",".",
              "--actual-json",ac["graph"],"--actual-mermaid",ac["diagram"],
              "--output-json",hv["graph"],"--output-mermaid",hv["diagram"],
              "--output-markdown",hv["document"],"--session-id",q["session_id"]],check=True)
          digest=load(ac["graph"])["source_digest"]
          q["actual"]["source_digest"]=digest
          q["human_view"]["source_digest"]=digest
          save(qpath,q)
          PY
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-25-GOVERNANCE.json --report artifacts/sequence/SW2-25-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-25-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/sync_project_truth.py --root .
          git add .workflow docs artifacts/sequence README.md
          python scripts/validate_documentation_contract.py --root . --write-report
          git add .workflow/generated/documentation_coverage.json
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "SW2-25: reconcile bundle CI proof, Project Truth and GitHub-renderable sequence"
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-25-GOVERNANCE.json --no-write-report
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_project_docs.py --root .
          git diff --exit-code -- .workflow docs artifacts/sequence scripts
          git push origin HEAD:work/sw2-25-reproducible-release-bundle
