  apply-and-prove:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: "51963cac28f78e8c9c5052bcbdc5270b5bc93989"
      BRANCH_NAME: "work/sw2-11-root-agents-contract"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-11-root-agents-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply SW2-11 source and authority changes
        shell: bash
        run: |
          python - <<'PY'
