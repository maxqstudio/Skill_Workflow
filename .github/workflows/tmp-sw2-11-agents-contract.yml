name: TEMP SW2-11 Root AGENTS Contract

on:
  push:
    branches:
      - work/sw2-11-root-agents-contract

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-11-root-agents-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply, validate, commit, and push SW2-11 transaction
        run: python artifacts/tmp/sw2_11_apply.py
