      - name: Run targeted SW2-11 regressions before generation
        run: |
          python -m compileall -q scripts
          python scripts/selftest_repository_health.py
          python scripts/selftest_schema_toolchain.py
          python scripts/validate_repository_health.py --root .
          python scripts/selftest_adoption_profiles.py

      - name: Generate and validate SW2-11 sequence evidence
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py \
            --root . \
            --output-json docs/sequence/generated/SW2-11-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-11-GOVERNANCE.actual.mmd \
            --entry scripts/initialize_project_truth.py::main \
            --entry scripts/migrate_governance_v1.py::main \
            --entry scripts/validate_repository_health.py::main \
            --entry scripts/validate_project_docs.py::main \
            --entry scripts/sync_project_truth.py::main \
            --entry scripts/validate_sequence_sessions.py::main \
            --entry scripts/governance_engine.py::main
          python scripts/sequence_human_view.py \
            --root . \
            --actual-json docs/sequence/generated/SW2-11-GOVERNANCE.actual.json \
            --actual-mermaid docs/sequence/generated/SW2-11-GOVERNANCE.actual.mmd \
            --output-json docs/sequence/generated/SW2-11-GOVERNANCE.human.json \
            --output-mermaid docs/sequence/generated/SW2-11-GOVERNANCE.human.mmd \
            --output-markdown docs/sequence/views/SW2-11-GOVERNANCE.md \
            --session-id SW2-11-GOVERNANCE
          python scripts/validate_sequence_contract.py \
            --root . \
            --session docs/sequence/sessions/SW2-11-GOVERNANCE.json \
            --report artifacts/sequence/SW2-11-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-11-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .

      - name: Regenerate Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Commit candidate locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md templates/AGENTS.md .gitattributes SKILL.md README.md docs .workflow scripts artifacts/sequence
          git commit -m "SW2-11: require root AGENTS contract"
          echo "LOCAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate exact clean candidate
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_strict_project_workflow.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$BASE_SHA" --require-base
          python scripts/validate_project_truth.py --root .
          python scripts/governance_engine.py --root . --base "$BASE_SHA" --mode finalize --expected-head "$LOCAL_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push candidate only after PASS
        shell: bash
        run: git push origin HEAD:work/sw2-11-root-agents-contract
