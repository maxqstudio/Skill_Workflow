name: TEMP SW2-20 Post-Merge Closure Runner

on:
  push:
    branches:
      - tmp/sw2-20-post-merge-closure-runner
    paths:
      - .github/workflows/tmp-sw2-20-post-merge-closure-runner.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_BRANCH: work/sw2-20-post-merge-closure
      ACCEPTED_MAIN: 8c72be9de2157ba743a1d593e1ed17adabc613a2
      ACCEPTED_TREE: abed5d5a4d9ad675be5b6be59264313e15adcfb5
      FINAL_CANDIDATE: 173074055f841defd549cc896cfe26a5f60214b4
      FINAL_CI_RUN: "37398686766"
      POST_MERGE_CI_RUN: "37398984162"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-20-post-merge-closure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record terminal SW2-20 acceptance authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          main = os.environ['ACCEPTED_MAIN']
          tree = os.environ['ACCEPTED_TREE']
          candidate = os.environ['FINAL_CANDIDATE']
          final_run = os.environ['FINAL_CI_RUN']
          post_run = os.environ['POST_MERGE_CI_RUN']

          acceptance = load('.workflow/acceptance.json')
          reqs = {item['id']: item for item in acceptance.get('requirements', [])}
          r4 = reqs.get('SW2-20-R4')
          if not r4 or r4.get('status') != 'PASS':
              raise RuntimeError('SW2_20_R4_NOT_PASS')
          r4['evidence'] = (
              f'PASS on exact final candidate {candidate}: Governance CI run {final_run} passed all six permanent contexts. '
              f'Candidate was squash-merged to main as {main} with tree {tree}. '
              f'Post-merge Governance CI run {post_run} passed Self Governance, Governance Selftest on Ubuntu and Windows, '
              'SW2 Sequence Evidence, Governance Engine Performance, and Consumer Engine Performance. '
              'This closes the exact-head and post-merge acceptance boundary.'
          )
          write('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          state['phase'] = 'SW2-20'
          state['status'] = 'SW2_20_DOCUMENTATION_INVENTORY_FRESHNESS_ACCEPTED'
          state['working_branch'] = 'main'
          state['last_accepted_branch'] = 'main'
          state['last_accepted_sha'] = main
          state['blockers'] = []
          state['blocked_actions'] = [
              'Do not weaken or bypass deterministic documentation discovery/classification or freshness validation.',
              'Do not replace tracked-document discovery with a hand-maintained complete-file allowlist.',
              'Do not claim automatic GitHub merge protection or required-check enforcement while no repository ruleset is configured.',
              'Do not begin a new governed phase unless the Owner explicitly extends .workflow/roadmap.json and opens a new acceptance boundary.',
          ]
          state['next_authorized_actions'] = [
              f'Treat SW2-20 on main {main} as the accepted terminal roadmap authority for the current roadmap.',
              'Preserve the accepted V2.1 release identity and SW2-20 deterministic documentation freshness contract.',
              'Before any new feature or compatibility work, explicitly extend the governed roadmap and open a new acceptance boundary.',
          ]
          state['not_proven'] = [
              'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.'
          ]
          proven = list(state.get('proven', []))
          closure = (
              f'SW2-20 Deterministic Documentation Inventory & Freshness Contract is accepted on main {main} '
              f'with tree {tree} equal to the exact tested candidate {candidate}. '
              f'Final candidate Governance CI run {final_run} passed all six permanent contexts; '
              f'post-merge main Governance CI run {post_run} also passed Self Governance, Governance Selftest on Ubuntu and Windows, '
              'SW2 Sequence Evidence, Governance Engine Performance, and Consumer Engine Performance. '
              'The current roadmap ends at SW2-20; no later governed phase is authorized until the Owner explicitly extends the roadmap.'
          )
          if closure not in proven:
              proven.append(closure)
          state['proven'] = proven
          write('.workflow/state.json', state)

          session = load('docs/sequence/sessions/SW2-20-GOVERNANCE.json')
          session['status'] = 'COMPLETE'
          session['scope'] = 'CURRENT'
          write('docs/sequence/sessions/SW2-20-GOVERNANCE.json', session)
          PY

      - name: Regenerate Project Truth
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .

      - name: Commit closure locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'NO_CLOSURE_DIFF'; exit 1; }
          git commit -m 'SW2-20: record post-merge terminal closure'

      - name: Validate clean closure candidate
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/selftest_public_docs.py
          python scripts/selftest_repository_health.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/governance_engine.py --root . --base "$ACCEPTED_MAIN" --mode finalize --expected-head "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs)"

      - name: Push clean closure candidate
        shell: bash
        run: |
          git push origin HEAD:work/sw2-20-post-merge-closure
