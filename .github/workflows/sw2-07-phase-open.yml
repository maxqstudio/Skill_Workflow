name: SW2-07 Phase Open

on:
  push:
    branches:
      - work/sw2-06-cross-language-analyzer-architecture

permissions:
  contents: write

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SW2_06_CLOSURE: "b1b95f3f112058c90dc8aa0ceb7b279dfd6ce7ab"
      ACCEPTED_MAIN: "4f3546e78e4a927359b1805fa5c69bf57ddc0040"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-06-cross-language-analyzer-architecture
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact SW2-06 closure lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$SW2_06_CLOSURE"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          test "$(git diff --name-only "$SW2_06_CLOSURE"..HEAD)" = ".github/workflows/sw2-07-phase-open.yml"

      - name: Close SW2-06 and open SW2-07 fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          closure = "b1b95f3f112058c90dc8aa0ceb7b279dfd6ce7ab"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )

          roadmap = load(".workflow/roadmap.json")
          assert roadmap["current_phase"] == "SW2-06"
          for phase in roadmap["phases"]:
              if phase["id"] == "SW2-06":
                  assert phase["status"] == "CURRENT"
                  phase["status"] = "COMPLETE"
              elif phase["id"] == "SW2-07":
                  assert phase["status"] == "PLANNED"
                  phase["status"] = "CURRENT"
          roadmap["current_phase"] = "SW2-07"
          save(".workflow/roadmap.json", roadmap)

          state = load(".workflow/state.json")
          closure_proof = (
              f"SW2-06 Cross-Language Analyzer Architecture is accepted on exact clean post-promotion candidate {closure}: "
              "Self Governance 37107380727, Governance Selftest 37107380730 on Ubuntu and Windows, "
              "SW2 Sequence Evidence 37107380788, SW2 Engine Performance 37107381528, and "
              "SW2 Consumer Engine Performance 37107380729 all succeeded after R1-R4 and analyzer/dynamic-evidence claims were promoted."
          )
          if closure_proof not in state["proven"]:
              state["proven"].append(closure_proof)
          state["phase"] = "SW2-07"
          state["status"] = "IN_PROGRESS"
          state["not_proven"] = [
              "SW2-07 repository health files and an Owner-approved public license are not proven complete.",
              "SW2-07 security and contribution paths are not proven complete.",
              "SW2-07 actual GitHub merge/ruleset enforcement is not proven to match declared governance.",
              "SW2-07 release process is not proven repeatable and evidence-backed."
          ]
          state["next_authorized_actions"] = [
              "Audit repository health files and record the exact license decision boundary without choosing a license for the Owner.",
              "Add or repair contribution and security documentation with deterministic public-doc validation.",
              "Audit actual GitHub main-branch/ruleset enforcement against declared governance and remediate only with evidence.",
              "Define and test a repeatable release process without creating the V2 stable release reserved for SW2-09."
          ]
          state["blocked_actions"] = [
              "Do not choose, add, or claim approval of a public license without explicit Owner approval.",
              "Do not claim merge/ruleset enforcement from workflow files alone; actual GitHub repository configuration must be evidenced.",
              "Do not create the V2 stable release/tag in SW2-07; stable release remains SW2-09 scope.",
              "Do not weaken accepted SW2-01 through SW2-06 governance guarantees while hardening public repository operations."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          acceptance["evidence_boundary"] = (
              "SW2-07 acceptance covers Public Project Hardening only: repository health files with an explicitly Owner-approved license, documented contribution/security paths, actual merge/ruleset enforcement aligned with declared governance, and a repeatable evidence-backed release process. Accepted SW2-01 through SW2-06 guarantees remain inherited authority and must not be weakened. A stable V2 release/tag remains SW2-09 scope."
          )
          acceptance["requirements"] = [
              {
                  "id": "SW2-07-R1",
                  "requirement": "Repository health files are present with Owner-approved license.",
                  "evidence": "NOT_PROVEN at phase opening. License selection is an Owner decision and no license may be inferred or auto-selected.",
                  "status": "NOT_PROVEN"
              },
              {
                  "id": "SW2-07-R2",
                  "requirement": "Security and contribution paths are documented.",
                  "evidence": "NOT_PROVEN until public repository health documents and their validation are complete.",
                  "status": "NOT_PROVEN"
              },
              {
                  "id": "SW2-07-R3",
                  "requirement": "Merge/ruleset enforcement matches declared governance.",
                  "evidence": "NOT_PROVEN until actual GitHub repository configuration is audited and evidenced; workflow presence alone is insufficient.",
                  "status": "NOT_PROVEN"
              },
              {
                  "id": "SW2-07-R4",
                  "requirement": "Release process is repeatable and evidence-backed.",
                  "evidence": "NOT_PROVEN until release governance is documented and regression-tested without publishing the SW2-09 stable release.",
                  "status": "NOT_PROVEN"
              }
          ]
          acceptance["runtime_status"] = "NOT_APPLICABLE"
          acceptance["runtime_checks"] = []
          acceptance["sequence_mode"] = "DURING"
          acceptance["sequence_session"] = "SW2-07-GOVERNANCE"
          acceptance["sequence_sync_status"] = "NOT_PROVEN"
          acceptance["test_commands"] = [
              "python -m compileall -q scripts",
              "python scripts/validate_schema_toolchain.py --root .",
              "python scripts/selftest_analyzer_contract.py",
              "python scripts/selftest_governance_engine.py",
              "python scripts/selftest_project_truth_compiler.py",
              "python scripts/selftest_strict_project_workflow.py",
              "python scripts/selftest_public_docs.py",
              "python scripts/selftest_generated_doc_presentation.py",
              "python scripts/validate_public_docs.py --root .",
              "python scripts/validate_sequence_sessions.py --root .",
              "python scripts/validate_handoff.py --root .",
              "python scripts/governance_engine.py --root . --base 4f3546e78e4a927359b1805fa5c69bf57ddc0040 --mode finalize --expected-head <EXACT_HEAD>"
          ]
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          ids = {item["id"] for item in claims["claims"]}
          new_claims = [
              {
                  "id": "TRUTH-SW2-PUBLIC-REPO-HEALTH",
                  "claim": "Public repository health, security, contribution, and license metadata match declared governance, with license choice explicitly approved by the Owner.",
                  "documents": ["ROADMAP.md", "PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["README.md", "scripts/validate_public_docs.py"],
                  "tests": ["scripts/selftest_public_docs.py", "scripts/validate_public_docs.py"],
                  "runtime_evidence": [],
                  "status": "NOT_PROVEN"
              },
              {
                  "id": "TRUTH-SW2-MERGE-ENFORCEMENT",
                  "claim": "Actual GitHub merge and ruleset enforcement for main matches the repository's declared fail-closed governance requirements.",
                  "documents": ["ROADMAP.md", "PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["SKILL.md", ".github/workflows/governance-selftest.yml"],
                  "tests": [],
                  "runtime_evidence": [],
                  "status": "NOT_PROVEN"
              },
              {
                  "id": "TRUTH-SW2-RELEASE-GOVERNANCE",
                  "claim": "The repository has a repeatable evidence-backed release process that preserves exact tested-head provenance and does not publish stable V2 before SW2-09 acceptance.",
                  "documents": ["ROADMAP.md", "PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["SKILL.md", ".github/workflows/governance-selftest.yml"],
                  "tests": ["scripts/selftest_strict_project_workflow.py"],
                  "runtime_evidence": [],
                  "status": "NOT_PROVEN"
              }
          ]
          for item in new_claims:
              if item["id"] not in ids:
                  claims["claims"].append(item)
          save(".workflow/claims.json", claims)

          old_path = Path("docs/sequence/sessions/SW2-06-GOVERNANCE.json")
          old_session = load(old_path)
          old_session["scope"] = "HISTORICAL"
          old_session["status"] = "COMPLETE"
          old_session["evidence_boundary"] = (
              "SW2-06 accepted historical evidence: normalized language-independent analyzer contract, preserved Python and JS/TS regressions, inventory-only fail-safe fallback, and explicit NOT_PROVEN boundary for unsupported dynamic behavior."
          )
          save(old_path, old_session)

          new_session = {
              "schema_version": 1,
              "session_id": "SW2-07-GOVERNANCE",
              "phase": "SW2-07",
              "scope": "CURRENT",
              "status": "IN_PROGRESS",
              "mode": "DURING",
              "critical": True,
              "implementation_base_sha": closure,
              "evidence_boundary": (
                  "SW2-07 phase-opening static evidence binds current public-document, Project Truth, handoff, and governance-engine validation paths. Actual GitHub ruleset enforcement, Owner license approval, and repeatable release evidence remain NOT_PROVEN because they require stronger repository/configuration or Owner evidence than static source inspection."
              ),
              "actual": {
                  "graph": "docs/sequence/generated/SW2-07-GOVERNANCE.actual.json",
                  "diagram": "docs/sequence/generated/SW2-07-GOVERNANCE.actual.mmd",
                  "entries": [
                      "scripts/validate_public_docs.py::main",
                      "scripts/validate_handoff.py::main",
                      "scripts/validate_project_truth.py::main",
                      "scripts/governance_engine.py::main"
                  ],
                  "source_digest": ""
              },
              "human_view": {
                  "graph": "docs/sequence/generated/SW2-07-GOVERNANCE.human.json",
                  "diagram": "docs/sequence/generated/SW2-07-GOVERNANCE.human.mmd",
                  "document": "docs/sequence/views/SW2-07-GOVERNANCE.md",
                  "granularity": "module",
                  "policy_id": "module-collapse-v1",
                  "source_digest": ""
              },
              "acceptance_report": "artifacts/sequence/SW2-07-GOVERNANCE.acceptance.json",
              "plan": {
                  "required": False,
                  "frozen": False,
                  "contract": "",
                  "diagram": "",
                  "sha256": "",
                  "frozen_commit": ""
              },
              "runtime_trace": {"required": False, "graph": ""},
              "test_traceability_required": True,
              "tests": [
                  "scripts/validate_public_docs.py",
                  "scripts/validate_handoff.py",
                  "scripts/selftest_strict_project_workflow.py"
              ]
          }
          save("docs/sequence/sessions/SW2-07-GOVERNANCE.json", new_session)
          PY

      - name: Generate SW2-07 sequence baseline and bind digest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-07-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [
              sys.executable, 'scripts/generate_sequence_actual.py',
              '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']
          ]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest

          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py',
              '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session['session_id']
          ], check=True)
          human_graph = json.loads((root / human['graph']).read_text(encoding='utf-8'))
          assert human_graph['source_digest'] == digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report']
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_human_view.py', '--root', '.',
              '--session', session_path.as_posix()
          ], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_sessions.py', '--root', '.'], check=True)

          acceptance_path = root / '.workflow/acceptance.json'
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['sequence_sync_status'] = 'PASS'
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Regenerate deterministic Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Assert SW2-07 opens fail closed
        run: |
          python - <<'PY'
          import json
          r=json.load(open('.workflow/roadmap.json', encoding='utf-8'))
          assert r['current_phase']=='SW2-07'
          assert next(x for x in r['phases'] if x['id']=='SW2-06')['status']=='COMPLETE'
          assert next(x for x in r['phases'] if x['id']=='SW2-07')['status']=='CURRENT'
          a=json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert all(x['status']=='NOT_PROVEN' for x in a['requirements'])
          assert a['sequence_session']=='SW2-07-GOVERNANCE' and a['sequence_sync_status']=='PASS'
          c=json.load(open('.workflow/claims.json', encoding='utf-8'))
          for cid in ('TRUTH-SW2-PUBLIC-REPO-HEALTH','TRUTH-SW2-MERGE-ENFORCEMENT','TRUTH-SW2-RELEASE-GOVERNANCE'):
              assert next(x for x in c['claims'] if x['id']==cid)['status']=='NOT_PROVEN'
          s=json.load(open('.workflow/state.json', encoding='utf-8'))
          assert s['phase']=='SW2-07' and s['status']=='IN_PROGRESS'
          print('SW2_07_FAIL_CLOSED=PASS')
          PY

      - name: Run phase-open governance validation
        shell: bash
        run: |
          python scripts/validate_public_docs.py --root .
          python scripts/validate_handoff.py --root .
          python scripts/validate_schema_toolchain.py --root .
          python scripts/selftest_analyzer_contract.py
          python scripts/validate_sequence_sessions.py --root .

      - name: Commit phase-open candidate locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo "FAIL NO_PHASE_TRANSITION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-07): close SW2-06 and open public hardening fail closed"

      - name: Validate clean committed transition read only
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base "$ACCEPTED_MAIN" --mode verify --expected-head "$expected"
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN"
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated phase-open candidate
        shell: bash
        run: git push origin HEAD:work/sw2-06-cross-language-analyzer-architecture
