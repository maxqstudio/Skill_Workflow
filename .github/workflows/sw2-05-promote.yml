name: SW2-05 Evidence Promotion

on:
  push:
    branches:
      - work/sw2-05-schema-toolchain-versioning

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ACCEPTED_MAIN: "733cf7dcb6def0fc1adc36cee7cc5243b8eaf060"
      ACCEPTED_CANDIDATE: "eab855c08b08770d12add6ba2833230a2e6293fc"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-05-schema-toolchain-versioning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert promotion lineage
        shell: bash
        run: |
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          git merge-base --is-ancestor "$ACCEPTED_CANDIDATE" HEAD
          unexpected="$(git diff --name-only "$ACCEPTED_CANDIDATE"..HEAD | grep -v '^.github/workflows/sw2-05-promote.yml$' || true)"
          test -z "$unexpected" || { echo "UNEXPECTED_POST_ACCEPTANCE_CHANGE=$unexpected"; exit 1; }

      - name: Promote SW2-05 evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = "eab855c08b08770d12add6ba2833230a2e6293fc"
          governance_run = "37100862749"
          sequence_run = "37100862743"
          consumer_run = "37100862760"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")

          acceptance = load(".workflow/acceptance.json")
          evidence = {
              "SW2-05-R1": f"PASS on exact candidate {candidate}: Governance Selftest run {governance_run} passed Ubuntu and Windows with permanent schema/toolchain regression; profile schema_version and every governed JSON spec schema_version are blocking, while missing/malformed/future versions fail closed.",
              "SW2-05-R2": f"PASS on exact candidate {candidate}: Governance Selftest run {governance_run} passed cross-platform and Consumer Engine Performance run {consumer_run} explicitly migrated the pinned legacy max-grounding consumer, validated .workflow/toolchain.lock.json, and preserved exact consumer HEAD provenance.",
              "SW2-05-R3": f"PASS on exact candidate {candidate}: selftest_schema_toolchain exercised explicit legacy migration, second-run idempotence, future profile/spec rejection, toolchain tamper rejection, and cache-not-authority semantics; Consumer Engine Performance run {consumer_run} proved the migration path on a pinned real consumer.",
              "SW2-05-R4": f"PASS on exact candidate {candidate}: docs/handbook/reference/versioning.md is source-authored public compatibility policy and permanent public-documentation validation passed in Governance Selftest run {governance_run}; Sequence Evidence run {sequence_run} also remained SUCCESS with the SW2-05 implementation session.",
          }
          for item in acceptance["requirements"]:
              if item["id"] in evidence:
                  item["status"] = "PASS"
                  item["evidence"] = evidence[item["id"]]
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          for item in claims["claims"]:
              if item["id"] == "TRUTH-SW2-SCHEMA-MIGRATION":
                  item["status"] = "PASS"
                  item["runtime_evidence"] = [
                      f"Exact candidate {candidate}; Governance Selftest run {governance_run} Ubuntu/Windows SUCCESS.",
                      f"Consumer Engine Performance run {consumer_run} explicit legacy migration SUCCESS.",
                  ]
              elif item["id"] == "TRUTH-SW2-TOOLCHAIN-IDENTITY":
                  item["status"] = "PASS"
                  item["runtime_evidence"] = [
                      f"Exact candidate {candidate}; Governance Selftest run {governance_run} Ubuntu/Windows SUCCESS.",
                      f"Consumer Engine Performance run {consumer_run} validated migrated consumer toolchain lock SUCCESS.",
                  ]
          save(".workflow/claims.json", claims)

          state = load(".workflow/state.json")
          proven = f"SW2-05 Schema & Toolchain Versioning feature acceptance is proven on exact candidate {candidate}: Governance Selftest {governance_run} passed Ubuntu and Windows with permanent schema/toolchain regression, SW2 Sequence Evidence {sequence_run} passed with blocking Mermaid render, and Consumer Engine Performance {consumer_run} passed after explicit deterministic migration of the pinned legacy max-grounding consumer. Missing/malformed/future schema versions fail closed; migration is explicit and idempotent; vendored tools are bound by exact file hashes and manifest digest; cache and mutable upstream state remain non-authoritative."
          if proven not in state["proven"]:
              state["proven"].append(proven)
          resolved = {
              "SW2-05 explicit profile/spec schema version contract and supported migration behavior are not proven.",
              "SW2-05 consumer toolchain lock identity and audit contract are not proven.",
              "SW2-05 release compatibility policy is not proven.",
          }
          state["not_proven"] = [x for x in state["not_proven"] if x not in resolved]
          state["next_authorized_actions"] = [
              "Run permanent CI on the exact clean post-promotion candidate.",
              "Close SW2-05 only if post-promotion permanent CI remains fully green.",
              "After closure, open SW2-06 fail-closed without inheriting SW2-05 PASS into new requirements.",
          ]
          state["blocked_actions"] = [
              "Do not close SW2-05 before exact post-promotion permanent CI succeeds.",
              "Do not change or reinterpret schema versions silently in place; supported evolution requires an explicit deterministic migration path.",
              "Do not let toolchain cache, mutable upstream state, or an unbound vendored copy become acceptance authority.",
              "Do not create the V2 stable release/tag in SW2-05; stable release remains SW2-09 scope.",
          ]
          save(".workflow/state.json", state)
          print("SW2_05_EVIDENCE_PROMOTION=PASS")
          PY

      - name: Regenerate deterministic Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_schema_toolchain.py --root .
          python scripts/selftest_schema_toolchain.py
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-05-GOVERNANCE.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-05-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert promotion state
        run: |
          python - <<'PY'
          import json
          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert {item['id']: item['status'] for item in acceptance['requirements']} == {f'SW2-05-R{i}': 'PASS' for i in range(1, 5)}
          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          cmap = {item['id']: item['status'] for item in claims['claims']}
          assert cmap['TRUTH-SW2-SCHEMA-MIGRATION'] == 'PASS'
          assert cmap['TRUTH-SW2-TOOLCHAIN-IDENTITY'] == 'PASS'
          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-05' and state['status'] == 'IN_PROGRESS'
          print('SW2_05_PROMOTION_ASSERTIONS=PASS')
          PY

      - name: Commit promotion candidate locally
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .workflow docs artifacts/sequence/SW2-05-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_PROMOTION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-05): promote accepted schema and toolchain evidence"
          echo "LOCAL_PROMOTION_HEAD=$(git rev-parse HEAD)"

      - name: Validate clean committed promotion candidate
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/validate_schema_toolchain.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "POST_COMMIT_PROMOTION_VALIDATION=PASS"

      - name: Push validated promotion candidate
        shell: bash
        run: git push origin HEAD:work/sw2-05-schema-toolchain-versioning
