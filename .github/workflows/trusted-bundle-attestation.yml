name: Trusted Bundle Attestation (manual evidence only)

on:
  workflow_dispatch:
  # Temporary same-repository feature-branch smoke test; remove before final acceptance.
  push:
    branches:
      - work/sw2-26-trusted-publisher-attestation

permissions:
  contents: read

jobs:
  attest:
    name: Sign exact-source dry-run (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact signed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin Git tree and prevent dirty source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Adversarial policy regressions
        run: python .github/scripts/selftest_publisher_provenance.py
      - name: Build and integrity-verify deterministic artifacts
        shell: bash
        run: |
          python .github/scripts/release_bundle.py build \
            --root . --expected-head "${{ github.sha }}" \
            --bundle "${{ runner.temp }}/product.zip" \
            --manifest "${{ runner.temp }}/manifest.json"
          python .github/scripts/release_bundle.py verify \
            --bundle "${{ runner.temp }}/product.zip" \
            --manifest "${{ runner.temp }}/manifest.json"
      - name: Sign ZIP and detached manifest together
        id: signed
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/product.zip
            ${{ runner.temp }}/manifest.json
      - name: Obtain Sigstore root online for CI smoke check
        shell: bash
        run: gh attestation trusted-root > "${{ runner.temp }}/trusted_root.jsonl"
      - name: Cryptographically verify both subjects
        shell: bash
        run: |
          python .github/scripts/publisher_provenance.py \
            --bundle "${{ runner.temp }}/product.zip" \
            --manifest "${{ runner.temp }}/manifest.json" \
            --attestation "${{ steps.signed.outputs.bundle-path }}" \
            --trusted-root "${{ runner.temp }}/trusted_root.jsonl" \
            --expected-sha "${{ github.sha }}" \
            --expected-ref "${{ github.ref }}"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload CI artifacts (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: trusted-bundle-ci-evidence
          path: |
            ${{ runner.temp }}/product.zip
            ${{ runner.temp }}/manifest.json
            ${{ steps.signed.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
