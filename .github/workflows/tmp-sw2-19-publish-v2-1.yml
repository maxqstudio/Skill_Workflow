name: TEMP SW2-19 Publish V2.1.0

on:
  push:
    branches:
      - release/sw2-19-v2.1.0-publication
    paths:
      - .github/workflows/tmp-sw2-19-publish-v2-1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CANDIDATE_SHA: 81b76ccad6785538d898a0fd5767e1b426a2eb56
      VERSION: v2.1.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tested main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate and publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "RELEASE_TAG_ALREADY_EXISTS:$VERSION"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GITHUB_RELEASE_ALREADY_EXISTS:$VERSION"
            exit 1
          fi
          echo "PUBLICATION_PRECONDITIONS=PASS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run strict exact-head governance finalize
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          python scripts/governance_engine.py \
            --root . \
            --base "$base" \
            --mode finalize \
            --expected-head "$CANDIDATE_SHA" \
            --report "$RUNNER_TEMP/governance.json"

      - name: Run strict V2.1 publication preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_preflight.py \
            --root . \
            --expected-head "$CANDIDATE_SHA" \
            --version "$VERSION" \
            --governance-report "$RUNNER_TEMP/governance.json" \
            --report "$RUNNER_TEMP/release-preflight.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-preflight.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS', report
          assert report['publication_authority'] is True, report
          assert report['stable'] is True, report
          assert report['evidence_only'] is False, report
          assert report['expected_head'] == os.environ['CANDIDATE_SHA'], report
          assert report['version'] == os.environ['VERSION'], report
          assert report['current_phase'] == 'SW2-19', report
          assert report['pending_publication_requirements'] == ['SW2-19-R4'], report
          print('V2_1_STRICT_PUBLICATION_AUTHORITY=PASS')
          PY

      - name: Publish exact v2.1.0 tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # Skill Workflow V2.1.0

          V2.1 optimization release produced by SW2-19 governance.

          - Exact release target: \`$CANDIDATE_SHA\`
          - SW2-11 through SW2-18 optimization roadmap: accepted
          - SW2-19 R1-R3: PASS before publication
          - Performance budgets: develop <= 2.5s, verify <= 3.5s, finalize <= 10.0s
          - Cross-platform governance and pinned real-consumer parity: PASS
          - Generated-doc drift and adversarial false-PASS regressions: PASS
          - Repository ruleset: intentionally not configured by Owner decision; no automatic merge-enforcement claim is made

          V2.0.0 remains immutable historical release authority. V2.1.0 must never be moved or retargeted; rollback remains repair-forward.
          EOF
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "Skill Workflow V2.1.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify live tag and release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          tag_sha="$(git rev-list -n 1 "$VERSION")"
          test "$tag_sha" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > "$RUNNER_TEMP/live-release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'live-release.json').read_text(encoding='utf-8'))
          assert release['tag_name'] == os.environ['VERSION'], release
          assert release['target_commitish'] == os.environ['CANDIDATE_SHA'], release
          assert release['draft'] is False, release
          assert release['prerelease'] is False, release
          evidence = {
              'schema_version': 1,
              'result': 'PASS',
              'version': os.environ['VERSION'],
              'candidate_sha': os.environ['CANDIDATE_SHA'],
              'tag_sha': os.environ['CANDIDATE_SHA'],
              'release_id': release['id'],
              'release_target_commitish': release['target_commitish'],
              'draft': release['draft'],
              'prerelease': release['prerelease'],
              'publication_authority': True,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'publication.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('V2_1_LIVE_PUBLICATION_IDENTITY=PASS')
          PY

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw2-19-v2.1.0-publication-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/governance.json
            ${{ runner.temp }}/release-preflight.json
            ${{ runner.temp }}/live-release.json
            ${{ runner.temp }}/publication.json
