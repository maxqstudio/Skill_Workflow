name: tmp-sw2-25-terminal-closure
on:
  push:
    branches: [work/sw2-25-terminal-closure]
permissions:
  contents: write
jobs:
  closure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-25-terminal-closure
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Promote exact feature/main evidence to terminal SW2-25 authority
        shell: bash
        run: |
          git merge-base --is-ancestor 40c88c990f671fb70cdab8fa391610977bc4c04a HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          BASE="91b58b98049a7d27ed65169508177ea7dc978ca1"
          PRODUCT="40c88c990f671fb70cdab8fa391610977bc4c04a"
          FEATURE="82719678198a94bb314bccb4fe019579458b80c8"
          TREE="d6b7be3396b77ffadc0a37f17b125bd2cd12bf5c"
          def load(p): return json.loads(Path(p).read_text(encoding="utf-8"))
          def save(p,o): Path(p).write_text(json.dumps(o,indent=2,sort_keys=True)+"\n",encoding="utf-8",newline="\n")
          road=load(".workflow/roadmap.json")
          assert road["current_phase"]=="SW2-25" and road["phases"][-1]["id"]=="SW2-25"
          assert road["phases"][-1]["status"]=="CURRENT"
          state=load(".workflow/state.json")
          assert state["phase"]=="SW2-25" and state["last_accepted_sha"]==BASE
          assert state["status"]=="SW2_25_R1_R5_PROVEN_PENDING_FEATURE_MERGE"
          state["status"]="SW2_25_REPRODUCIBLE_RELEASE_BUNDLE_ACCEPTED"
          state["last_accepted_sha"]=PRODUCT
          state["last_accepted_branch"]="main"
          state["working_branch"]="main"
          state["blockers"]=[]
          state["not_proven"]=[
            "An unsigned detached SHA-256 manifest cannot authenticate the publisher or the source Git SHA offline: provenance against trusted independent authority remains NOT_PROVEN.",
            "No new stable tag or release has been authorized or published; stable product remains v2.1.0, and release publication authority is false.",
            "GitHub automatic required-status-check ruleset enforcement remains intentionally NOT_PROVEN (non-blocking under Owner decision).",
            "Cross-OS bundle byte parity proved on pinned candidate run 37716191737; no external consumer repositories or Owner PC runtime were modified."
          ]
          state["blocked_actions"]=[
            "Do not open SW2-26 without explicit Owner authorization and a new scoped acceptance boundary.",
            "Do not publish a stable tag, GitHub Release, package registry asset or change license absent a separate approved publication phase.",
            "Do not weaken six permanent CI contexts, Windows/Ubuntu test parity, exact SHA, consumer finalize, Mermaid, performance or documentation validation."
          ]
          state["next_authorized_actions"]=[
            "Treat exact accepted SW2-25 implementation main "+PRODUCT+" as canonical release bundle source authority; terminal closure evidence is a separate generated-only commit.",
            "Keep release bundle dry-run read-only/manual, with unsigned manifest and publication_authority=false.",
            "Require Owner phase discussion/approval before any release/publication or SW2-26."
          ]
          state["proven"].extend([
            "SW2-25 product candidate "+FEATURE+" and identical-tree squash PR #44 accepted main "+PRODUCT+" tree "+TREE+" were exact-SHA verified; feature Governance CI run 37717282205 six contexts SUCCESS, postmerge main run 37717454646 six contexts SUCCESS.",
            "SW2-25 Release Bundle Dry Run exact candidate a4332aceecc320d11dceadbab9809ab7d87c38c9 run 37716191737: Ubuntu/Windows ZIP and complete JSON manifest bytes equal, malicious paths and tampered archive fail closed; no tag, release or owner mutation.",
            "SW2-25 offline verification explicitly distinguishes a valid content SHA from independently authenticated publisher and Git identity."
          ])
          save(".workflow/state.json",state)
          a=load(".workflow/acceptance.json")
          assert a["sequence_session"]=="SW2-25-GOVERNANCE"
          for req in a["requirements"]:
              if req["id"]=="SW2-25-R6":
                  assert req["status"]=="NOT_PROVEN"
                  req["status"]="PASS"
                  req["evidence"]=(
                    "PASS: final exact helper-free feature "+FEATURE+" tree "+TREE+
                    " passed all six permanent contexts in Governance CI 37717282205; "
                    "PR #44 squash merged as accepted main "+PRODUCT+
                    " with identical tree; postmerge exact-main six permanent checks SUCCESS in run 37717454646. "
                    "Terminal closure candidate and main undergo separate exact six-context tests."
                  )
          assert all(req["status"]=="PASS" for req in a["requirements"])
          for k,v in list(a["truth_gates"].items()):
              if v not in ("PASS","NOT_APPLICABLE"): a["truth_gates"][k]="PASS"
          a["human_comprehension_status"]="PASS"
          a["sequence_sync_status"]="PASS"
          a["evidence_boundary"]=(
            "SW2-25 R1-R6 feature acceptance includes exact clean Git blob product bundle, detached offline "
            "SHA-256 verification, Windows/Ubuntu byte parity, secret/path/mode and manifest tamper rejection, "
            "GitHub six-context exact feature/main checks and equal-tree squash. ZIP/manifest are unsigned and "
            "do not authenticate publisher or permit tag/release publication; terminal closure candidate/main "
            "are independently retested after this authority projection."
          )
          save(".workflow/acceptance.json",a)
          sesfile="docs/sequence/sessions/SW2-25-GOVERNANCE.json"
          q=load(sesfile)
          assert q["status"]=="IN_PROGRESS" and q["scope"]=="CURRENT" and q["phase"]=="SW2-25"
          assert q["implementation_base_sha"]==BASE
          q["status"]="COMPLETE"
          save(sesfile,q)
          PY
          python scripts/validate_sequence_sessions.py --root .
          python scripts/sync_project_truth.py --root .
          git add .workflow docs artifacts/sequence
          python scripts/validate_documentation_contract.py --root . --write-report
          git add .workflow/generated/documentation_coverage.json
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "SW2-25: terminal accepted closure after feature/main six-context evidence"
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_closure_defect_lifecycle.py --root . --expected-base 91b58b98049a7d27ed65169508177ea7dc978ca1
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_project_docs.py --root .
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs scripts)"
          git push origin HEAD:work/sw2-25-terminal-closure
