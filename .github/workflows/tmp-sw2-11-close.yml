name: TEMP SW2-11 Closure

on:
  push:
    branches:
      - work/sw2-11-root-agents-contract

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: "51963cac28f78e8c9c5052bcbdc5270b5bc93989"
      EVIDENCE_SHA: "415bb41d2f34ae204e7e09d7434be9974e63ef11"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-11-root-agents-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote SW2-11 acceptance authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          evidence_sha = '415bb41d2f34ae204e7e09d7434be9974e63ef11'
          runs = {
              'self': '37199687919',
              'selftest': '37199687921',
              'sequence': '37199687904',
              'engine': '37199687905',
              'consumer': '37199687906',
          }

          acceptance_path = root / '.workflow/acceptance.json'
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          evidence = {
              'SW2-11-R1': f'PASS on exact candidate {evidence_sha}: root AGENTS.md and templates/AGENTS.md are source-authored; project-doc/repository-health validation and LITE/STANDARD/STRICT adoption coverage passed in Governance Selftest {runs["selftest"]} on Ubuntu and Windows.',
              'SW2-11-R2': f'PASS on exact candidate {evidence_sha}: initializer creation plus explicit legacy migration/idempotence regression passed in Governance Selftest {runs["selftest"]} on Ubuntu and Windows; initializer preserves existing files unless --force through the existing copy_file force contract.',
              'SW2-11-R3': f'PASS on exact candidate {evidence_sha}: missing root AGENTS.md rejection, source-authored/normalized validation, repository-health regression, and Project Truth regression passed in Governance Selftest {runs["selftest"]} on Ubuntu and Windows.',
              'SW2-11-R4': f'PASS on exact candidate {evidence_sha}: Self Governance {runs["self"]}, Governance Selftest {runs["selftest"]} on Ubuntu and Windows, SW2 Sequence Evidence {runs["sequence"]}, Governance Engine Performance {runs["engine"]}, and Consumer Engine Performance {runs["consumer"]} all succeeded.',
          }
          for req in acceptance['requirements']:
              req['status'] = 'PASS'
              req['evidence'] = evidence[req['id']]
          acceptance_path.write_text(json.dumps(acceptance, indent=2) + '\n', encoding='utf-8', newline='\n')

          state_path = root / '.workflow/state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['status'] = 'SW2_11_ROOT_AGENTS_CONTRACT_ACCEPTED'
          state['working_branch'] = 'main'
          state['blockers'] = []
          state['blocked_actions'] = [
              'Do not move, retarget, delete-and-recreate, or silently replace the stable v2.0.0 tag.',
              'Do not weaken accepted V2 governance guarantees or make root AGENTS.md optional for any governance profile.',
              'Do not treat AGENTS.md as generated Project Truth or move it under docs/.',
              'Do not overwrite an existing project-specific AGENTS.md during initialization or migration unless --force is explicitly requested.',
              'Do not begin SW2-12 implementation without opening its governed acceptance boundary.'
          ]
          state['next_authorized_actions'] = [
              'Treat mandatory source-authored root AGENTS.md as part of the accepted Skill Workflow project contract.',
              'Preserve existing project-specific AGENTS.md by default during initialization and migration.',
              'Open SW2-12 Repository Hygiene & Dead Artifact Cleanup as a separate governed phase before changing cleanup behavior.'
          ]
          state['not_proven'] = [
              'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.'
          ]
          statement = (
              f'SW2-11 Root AGENTS.md Contract is accepted on exact candidate {evidence_sha}: '
              f'Self Governance {runs["self"]}, Governance Selftest {runs["selftest"]} on Ubuntu and Windows, '
              f'SW2 Sequence Evidence {runs["sequence"]}, Governance Engine Performance {runs["engine"]}, '
              f'and Consumer Engine Performance {runs["consumer"]} all succeeded. AGENTS.md is mandatory and source-authored at repository root for LITE, STANDARD, and STRICT; initialization/migration and fail-closed validation are regression-proven.'
          )
          if statement not in state.setdefault('proven', []):
              state['proven'].append(statement)
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Regenerate Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Commit closure locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs
          git commit -m "SW2-11: record accepted root AGENTS contract"
          echo "CLOSURE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate clean closure
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- AGENTS.md PROJECT_PROFILE.yaml .workflow docs scripts templates)"
          python scripts/selftest_repository_health.py
          python scripts/selftest_schema_toolchain.py
          python scripts/validate_repository_health.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$BASE_SHA" --require-base
          python scripts/validate_project_truth.py --root .
          python scripts/governance_engine.py --root . --base "$BASE_SHA" --mode finalize --expected-head "$CLOSURE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all -- AGENTS.md PROJECT_PROFILE.yaml .workflow docs scripts templates)"

      - name: Push closure only after PASS
        run: git push origin HEAD:work/sw2-11-root-agents-contract
