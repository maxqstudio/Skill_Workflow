name: SW2-02 Source-bound Regeneration

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate current SW2-02 evidence
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py \
            --root . \
            --output-json docs/sequence/generated/SW2-02-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-02-GOVERNANCE.actual.mmd \
            --entry scripts/governance_engine.py::main
          python - <<'PY'
          import json
          from pathlib import Path
          graph_path = Path('docs/sequence/generated/SW2-02-GOVERNANCE.actual.json')
          session_path = Path('docs/sequence/sessions/SW2-02-GOVERNANCE.json')
          graph = json.loads(graph_path.read_text(encoding='utf-8'))
          session = json.loads(session_path.read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print(f'SW2_02_SOURCE_DIGEST={digest}')
          PY
          python scripts/validate_sequence_contract.py \
            --root . \
            --session docs/sequence/sessions/SW2-02-GOVERNANCE.json \
            --report artifacts/sequence/SW2-02-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_sessions.py --root .
      - name: Regenerate Project Truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
      - name: Commit regenerated governed evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence/SW2-02-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_REGEN_DIFF"; exit 0; }
          git commit -m "chore(sw2): regenerate source-bound evidence"
          git push origin HEAD:work/sw2-02-fast-development-workflow
