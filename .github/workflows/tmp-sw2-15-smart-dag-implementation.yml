name: TEMP SW2-15 Smart DAG Implementation

on:
  push:
    branches:
      - work/sw2-15-smart-validation-dag
    paths:
      - .github/workflows/tmp-sw2-15-smart-dag-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Implement smart validation planning and dependency closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('scripts/governance_engine.py')
          text = engine_path.read_text(encoding='utf-8')

          old = '''FINALIZE_NODE_NAMES = (
              "compile_scripts",
              "engine_regression",
              "sequence_regression",
              "cross_document_regression",
              "compiler_selftest",
              "strict_workflow_selftest",
              "sync_project_truth",
              "validate_human_comprehension",
              "validate_sequence_sessions",
              "validate_handoff",
              "validate_cross_document_consistency",
              "validate_project_truth",
              "governed_state_clean",
          )


          def git(root: Path, *args: str) -> str:
          '''
          new = '''FINALIZE_NODE_NAMES = (
              "compile_scripts",
              "engine_regression",
              "sequence_regression",
              "cross_document_regression",
              "compiler_selftest",
              "strict_workflow_selftest",
              "sync_project_truth",
              "validate_human_comprehension",
              "validate_sequence_sessions",
              "validate_handoff",
              "validate_cross_document_consistency",
              "validate_project_truth",
              "governed_state_clean",
          )
          FAST_MODE_NODE_ORDER = (
              "compile_scripts",
              "engine_regression",
              "sequence_regression",
              "cross_document_regression",
              "compiler_selftest",
              "sync_project_truth",
              "validate_project_docs",
              "validate_human_comprehension",
              "validate_sequence_sessions",
              "validate_handoff",
              "validate_cross_document_consistency",
              "impact_only",
          )
          DEVELOP_NODE_DEPENDENCIES = {
              "compile_scripts": (),
              "engine_regression": ("compile_scripts",),
              "sequence_regression": ("compile_scripts",),
              "cross_document_regression": ("compile_scripts",),
              "compiler_selftest": ("compile_scripts",),
              "sync_project_truth": (),
              "validate_project_docs": (),
              "validate_human_comprehension": (),
              "validate_sequence_sessions": (),
              "validate_handoff": (),
              "validate_cross_document_consistency": ("sync_project_truth",),
              "impact_only": (),
          }
          VERIFY_NODE_DEPENDENCIES = {
              "compile_scripts": (),
              "engine_regression": ("compile_scripts",),
              "sequence_regression": ("compile_scripts",),
              "cross_document_regression": ("compile_scripts",),
              "compiler_selftest": ("compile_scripts",),
              "sync_project_truth": (),
              "validate_project_docs": (),
              "validate_human_comprehension": ("validate_project_docs",),
              "validate_sequence_sessions": (),
              "validate_handoff": ("validate_project_docs",),
              "validate_cross_document_consistency": ("validate_project_docs",),
              "impact_only": (),
          }


          def git(root: Path, *args: str) -> str:
          '''
          if text.count(old) != 1:
              raise RuntimeError('ENGINE_CONSTANT_INSERT_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''def planned_node_names(
              requested: str,
              effective: str,
              paths: tuple[str, ...],
              impacts: tuple[str, ...],
          ) -> tuple[str, ...]:
              if effective == "finalize":
                  return FINALIZE_NODE_NAMES
              if effective == "verify":
                  return VERIFY_NODE_NAMES
              return develop_node_names(paths, impacts)
          '''
          new = '''def mode_node_dependencies(mode: str, name: str) -> tuple[str, ...]:
              if mode == "develop":
                  mapping = DEVELOP_NODE_DEPENDENCIES
              elif mode == "verify":
                  mapping = VERIFY_NODE_DEPENDENCIES
              else:
                  raise ValueError(f"SMART_DAG_MODE_UNSUPPORTED:{mode}")
              if name not in mapping:
                  raise ValueError(f"SMART_DAG_NODE_UNDECLARED:{mode}:{name}")
              return mapping[name]


          def dependency_closure(mode: str, seeds: tuple[str, ...] | list[str]) -> tuple[str, ...]:
              selected: set[str] = set()
              visiting: set[str] = set()

              def include(name: str) -> None:
                  if name in selected:
                      return
                  if name in visiting:
                      raise ValueError(f"SMART_DAG_DEPENDENCY_CYCLE:{mode}:{name}")
                  visiting.add(name)
                  for dependency in mode_node_dependencies(mode, name):
                      include(dependency)
                  visiting.remove(name)
                  selected.add(name)

              for seed in seeds:
                  include(seed)
              return tuple(name for name in FAST_MODE_NODE_ORDER if name in selected)


          def verify_node_names(
              paths: tuple[str, ...] | list[str],
              impacts: tuple[str, ...],
          ) -> tuple[str, ...]:
              names: set[str] = set()
              path_set = set(paths)

              if path_set.intersection(ENGINE_DEVELOP_FILES):
                  names.add("engine_regression")
              if path_set.intersection(SEQUENCE_DEVELOP_FILES) or any(
                  path.startswith("docs/sequence/") for path in path_set
              ):
                  names.update(("sequence_regression", "validate_sequence_sessions"))
              if path_set.intersection(COMPILER_DEVELOP_FILES):
                  names.update(("compiler_selftest", "validate_project_docs"))
              if path_set.intersection(CROSSDOC_DEVELOP_FILES):
                  names.update(("cross_document_regression", "validate_cross_document_consistency"))
              for path, node_name in DEVELOP_TEST_MAP.items():
                  if path in path_set:
                      names.add(node_name)

              impact_set = set(impacts)
              if "governance" in impact_set:
                  names.update((
                      "validate_project_docs",
                      "validate_human_comprehension",
                      "validate_sequence_sessions",
                      "validate_handoff",
                      "validate_cross_document_consistency",
                  ))
              if "documentation" in impact_set:
                  names.update((
                      "validate_project_docs",
                      "validate_human_comprehension",
                      "validate_handoff",
                      "validate_cross_document_consistency",
                  ))
              if "source" in impact_set:
                  names.update(("validate_project_docs", "validate_cross_document_consistency"))
              if impact_set.intersection({"broad_source", "template", "ci"}):
                  names.update(VERIFY_NODE_NAMES)
              if "benchmark" in impact_set and not names:
                  names.add("impact_only")
              if not names:
                  names.add("impact_only")

              seeds = tuple(name for name in FAST_MODE_NODE_ORDER if name in names)
              return dependency_closure("verify", seeds)


          def planned_node_names(
              requested: str,
              effective: str,
              paths: tuple[str, ...],
              impacts: tuple[str, ...],
          ) -> tuple[str, ...]:
              if effective == "finalize":
                  return FINALIZE_NODE_NAMES
              if effective == "verify":
                  return verify_node_names(paths, impacts)
              return dependency_closure("develop", develop_node_names(paths, impacts))
          '''
          if text.count(old) != 1:
              raise RuntimeError('PLANNED_NODE_FUNCTION_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''def _regression_node(name: str, root: Path, script: str) -> ValidationNode:
              return ValidationNode(
                  name=name,
                  dependencies=("compile_scripts",),
                  action=command_action(root, [sys.executable, script]),
              )
          '''
          new = '''def _regression_node(
              name: str,
              root: Path,
              script: str,
              *,
              dependencies: tuple[str, ...] = ("compile_scripts",),
          ) -> ValidationNode:
              return ValidationNode(
                  name=name,
                  dependencies=dependencies,
                  action=command_action(root, [sys.executable, script]),
              )
          '''
          if text.count(old) != 1:
              raise RuntimeError('REGRESSION_NODE_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    wanted = set(node_names)
              nodes: list[ValidationNode] = []

              if "impact_only" in wanted:
          '''
          new = '''    wanted = set(node_names)
              nodes: list[ValidationNode] = []
              fast_mode = mode in {"develop", "verify"}

              def dependencies_for(name: str) -> tuple[str, ...]:
                  if not fast_mode:
                      raise ValueError(f"SMART_DAG_FAST_MODE_REQUIRED:{mode}:{name}")
                  dependencies = mode_node_dependencies(mode, name)
                  missing = tuple(dep for dep in dependencies if dep not in wanted)
                  if missing:
                      raise ValueError(
                          f"SMART_DAG_DEPENDENCY_MISSING:{mode}:{name}:{','.join(missing)}"
                      )
                  return dependencies

              if "impact_only" in wanted:
          '''
          if text.count(old) != 1:
              raise RuntimeError('BUILD_DAG_PROLOGUE_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    for name, script in regression_specs:
                  if name in wanted:
                      nodes.append(_regression_node(name, root, script))
          '''
          new = '''    for name, script in regression_specs:
                  if name in wanted:
                      dependencies = dependencies_for(name) if fast_mode else ("compile_scripts",)
                      nodes.append(
                          _regression_node(
                              name,
                              root,
                              script,
                              dependencies=dependencies,
                          )
                      )
          '''
          if text.count(old) != 1:
              raise RuntimeError('REGRESSION_BUILD_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    if "sync_project_truth" in wanted:
                  dependencies = (
                      ("strict_workflow_selftest",)
                      if "strict_workflow_selftest" in wanted
                      else regressions
                  )
          '''
          new = '''    if "sync_project_truth" in wanted:
                  dependencies = (
                      dependencies_for("sync_project_truth")
                      if fast_mode
                      else (
                          ("strict_workflow_selftest",)
                          if "strict_workflow_selftest" in wanted
                          else regressions
                      )
                  )
          '''
          if text.count(old) != 1:
              raise RuntimeError('SYNC_DEPENDENCY_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    elif "validate_project_docs" in wanted:
                  dependencies = regressions
          '''
          new = '''    elif "validate_project_docs" in wanted:
                  dependencies = dependencies_for("validate_project_docs") if fast_mode else regressions
          '''
          if text.count(old) != 1:
              raise RuntimeError('DOCS_DEPENDENCY_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    if "validate_human_comprehension" in wanted:
                  nodes.append(
                      ValidationNode(
                          name="validate_human_comprehension",
                          dependencies=((docs_dependency,) if docs_dependency else regressions),
          '''
          new = '''    if "validate_human_comprehension" in wanted:
                  dependencies = (
                      dependencies_for("validate_human_comprehension")
                      if fast_mode
                      else ((docs_dependency,) if docs_dependency else regressions)
                  )
                  nodes.append(
                      ValidationNode(
                          name="validate_human_comprehension",
                          dependencies=dependencies,
          '''
          if text.count(old) != 1:
              raise RuntimeError('HUMAN_DEPENDENCY_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    if "validate_sequence_sessions" in wanted:
                  nodes.append(
                      ValidationNode(
                          name="validate_sequence_sessions",
                          dependencies=((docs_dependency,) if docs_dependency else regressions),
          '''
          new = '''    if "validate_sequence_sessions" in wanted:
                  dependencies = (
                      dependencies_for("validate_sequence_sessions")
                      if fast_mode
                      else ((docs_dependency,) if docs_dependency else regressions)
                  )
                  nodes.append(
                      ValidationNode(
                          name="validate_sequence_sessions",
                          dependencies=dependencies,
          '''
          if text.count(old) != 1:
              raise RuntimeError('SEQUENCE_DEPENDENCY_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    if "validate_handoff" in wanted:
                  nodes.append(
                      ValidationNode(
                          name="validate_handoff",
                          dependencies=((docs_dependency,) if docs_dependency else regressions),
          '''
          new = '''    if "validate_handoff" in wanted:
                  dependencies = (
                      dependencies_for("validate_handoff")
                      if fast_mode
                      else ((docs_dependency,) if docs_dependency else regressions)
                  )
                  nodes.append(
                      ValidationNode(
                          name="validate_handoff",
                          dependencies=dependencies,
          '''
          if text.count(old) != 1:
              raise RuntimeError('HANDOFF_DEPENDENCY_ANCHOR')
          text = text.replace(old, new, 1)

          old = '''    if "validate_cross_document_consistency" in wanted:
                  dependencies: list[str] = []
                  if "validate_human_comprehension" in wanted:
                      dependencies.append("validate_human_comprehension")
                  elif docs_dependency:
                      dependencies.append(docs_dependency)
                  elif regressions:
                      dependencies.extend(regressions)
          '''
          new = '''    if "validate_cross_document_consistency" in wanted:
                  if fast_mode:
                      dependencies = list(dependencies_for("validate_cross_document_consistency"))
                  else:
                      dependencies = []
                      if "validate_human_comprehension" in wanted:
                          dependencies.append("validate_human_comprehension")
                      elif docs_dependency:
                          dependencies.append(docs_dependency)
                      elif regressions:
                          dependencies.extend(regressions)
          '''
          if text.count(old) != 1:
              raise RuntimeError('CROSSDOC_DEPENDENCY_ANCHOR')
          text = text.replace(old, new, 1)

          engine_path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('scripts/selftest_governance_engine.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''    collect_changed_paths,
              develop_node_names,
              effective_mode,
              planned_node_names,
          )
          '''
          new = '''    collect_changed_paths,
              dependency_closure,
              develop_node_names,
              effective_mode,
              mode_node_dependencies,
              planned_node_names,
              verify_node_names,
          )
          '''
          if tests.count(old) != 1:
              raise RuntimeError('SELFTEST_IMPORT_ANCHOR')
          tests = tests.replace(old, new, 1)

          old = '''    require(
                  set(VERIFY_NODE_NAMES) == verify_nodes,
                  "verify node set drifted from declared contract",
              )

              finalize_nodes = set(
          '''
          new = '''    require(
                  set(VERIFY_NODE_NAMES) == verify_nodes,
                  "broad-source verify must retain the full declared verify contract",
              )

              engine_verify_nodes = set(verify_node_names(engine_paths, engine_impacts))
              require(
                  engine_verify_nodes == {"compile_scripts", "engine_regression"},
                  f"known engine verify selected unrelated work: {sorted(engine_verify_nodes)}",
              )
              docs_paths = ("docs/handbook/README.md",)
              docs_impacts = classify_changed_paths(docs_paths)
              docs_verify_nodes = set(verify_node_names(docs_paths, docs_impacts))
              require(
                  docs_verify_nodes == {
                      "validate_project_docs",
                      "validate_human_comprehension",
                      "validate_handoff",
                      "validate_cross_document_consistency",
                  },
                  f"documentation verify dependency closure drifted: {sorted(docs_verify_nodes)}",
              )
              governance_paths = (".workflow/state.json",)
              governance_impacts = classify_changed_paths(governance_paths)
              governance_verify_nodes = set(verify_node_names(governance_paths, governance_impacts))
              require(
                  "validate_sequence_sessions" in governance_verify_nodes,
                  "governance verify missed sequence contract validation",
              )
              require(
                  not governance_verify_nodes.intersection({
                      "engine_regression",
                      "sequence_regression",
                      "cross_document_regression",
                      "compiler_selftest",
                  }),
                  f"known governance verify selected unrelated source regressions: {sorted(governance_verify_nodes)}",
              )

              finalize_nodes = set(
          '''
          if tests.count(old) != 1:
              raise RuntimeError('SELFTEST_VERIFY_SELECTION_ANCHOR')
          tests = tests.replace(old, new, 1)

          old = '''    print("MODE_PLANNING_CONTRACT=PASS")


          def changed_path_collection_contract() -> None:
          '''
          new = '''    print("MODE_PLANNING_CONTRACT=PASS")


          def smart_validation_dependency_contract() -> None:
              verify_closure = dependency_closure(
                  "verify",
                  ("validate_cross_document_consistency",),
              )
              require(
                  verify_closure == (
                      "validate_project_docs",
                      "validate_cross_document_consistency",
                  ),
                  f"verify prerequisite closure drifted: {verify_closure}",
              )
              develop_closure = dependency_closure(
                  "develop",
                  ("validate_cross_document_consistency",),
              )
              require(
                  develop_closure == (
                      "sync_project_truth",
                      "validate_cross_document_consistency",
                  ),
                  f"develop prerequisite closure drifted: {develop_closure}",
              )
              try:
                  dependency_closure("verify", ("future_validator",))
              except ValueError as exc:
                  require(
                      "SMART_DAG_NODE_UNDECLARED" in str(exc),
                      f"undeclared smart-DAG node failed with wrong error: {exc}",
                  )
              else:
                  raise AssertionError("undeclared smart-DAG node did not fail closed")

              downstream_calls = 0

              def prerequisite_fail() -> tuple[int, str]:
                  return 1, "EXPECTED_SMART_DEPENDENCY_FAILURE\\n"

              def dependent_action() -> tuple[int, str]:
                  nonlocal downstream_calls
                  downstream_calls += 1
                  return 0, "UNEXPECTED_DEPENDENT_EXECUTION\\n"

              results = ValidationDAG([
                  ValidationNode(
                      "validate_project_docs",
                      mode_node_dependencies("verify", "validate_project_docs"),
                      prerequisite_fail,
                  ),
                  ValidationNode(
                      "validate_cross_document_consistency",
                      mode_node_dependencies("verify", "validate_cross_document_consistency"),
                      dependent_action,
                  ),
              ]).run()
              require(
                  results["validate_project_docs"].status == "FAIL",
                  "smart-DAG prerequisite failure was not recorded",
              )
              require(
                  results["validate_cross_document_consistency"].status == "BLOCKED",
                  "smart-DAG dependent was not blocked by failed prerequisite",
              )
              require(downstream_calls == 0, "smart-DAG skipped a required failure boundary")
              print("SMART_VALIDATION_DAG=PASS")


          def changed_path_collection_contract() -> None:
          '''
          if tests.count(old) != 1:
              raise RuntimeError('SMART_DEPENDENCY_TEST_INSERT_ANCHOR')
          tests = tests.replace(old, new, 1)

          old = '''        require(
                  not any(path.name == "__pycache__" for path in scripts.rglob("__pycache__")),
                  "develop compile dirtied fixture worktree with __pycache__",
              )

              unknown = root / "future" / "new-surface.bin"
          '''
          new = '''        require(
                  not any(path.name == "__pycache__" for path in scripts.rglob("__pycache__")),
                  "develop compile dirtied fixture worktree with __pycache__",
              )

              targeted_verify_report = root / "targeted-verify-report.json"
              targeted_verify = subprocess.run(
                  [
                      sys.executable,
                      str(tool),
                      "--root",
                      str(root),
                      "--base",
                      base,
                      "--mode",
                      "verify",
                      "--expected-head",
                      base,
                      "--report",
                      str(targeted_verify_report),
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              require(targeted_verify.returncode == 0, "known engine verify fixture did not pass")
              targeted_verify_payload = json.loads(
                  targeted_verify_report.read_text(encoding="utf-8")
              )
              require(
                  set(targeted_verify_payload["selected_nodes"])
                  == {"compile_scripts", "engine_regression"},
                  "known engine verify selected unrelated validation nodes",
              )
              require(
                  targeted_verify_payload["final_acceptance_authority"] is False,
                  "targeted verify gained final acceptance authority",
              )

              unknown = root / "future" / "new-surface.bin"
          '''
          if tests.count(old) != 1:
              raise RuntimeError('CLI_TARGETED_VERIFY_ANCHOR')
          tests = tests.replace(old, new, 1)

          old = '''    dag_fail_closed()
              mode_planning_contract()
              changed_path_collection_contract()
          '''
          new = '''    dag_fail_closed()
              mode_planning_contract()
              smart_validation_dependency_contract()
              changed_path_collection_contract()
          '''
          if tests.count(old) != 1:
              raise RuntimeError('SELFTEST_MAIN_ANCHOR')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Test source implementation
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py

      - name: Regenerate current sequence and Project Truth
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          session_path = root / 'docs/sequence/sessions/SW2-15-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [
              sys.executable,
              'scripts/generate_sequence_actual.py',
              '--root', '.',
              '--output-json', actual['graph'],
              '--output-mermaid', actual['diagram'],
          ]
          for entry in actual['entries']:
              cmd += ['--entry', entry]
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(
              json.dumps(session, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          human = session['human_view']
          subprocess.run([
              sys.executable,
              'scripts/sequence_human_view.py',
              '--root', '.',
              '--actual-json', actual['graph'],
              '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'],
              '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'],
              '--session-id', session['session_id'],
          ], check=True)
          subprocess.run([
              sys.executable,
              'scripts/validate_sequence_contract.py',
              '--root', '.',
              '--session', 'docs/sequence/sessions/SW2-15-GOVERNANCE.json',
          ], check=True)
          PY
          python scripts/sync_project_truth.py --root .

      - name: Validate helper-free candidate
        shell: bash
        run: |
          rm -f .github/workflows/tmp-sw2-15-smart-dag-implementation.yml
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/selftest_strict_project_workflow.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          test ! -e .github/workflows/tmp-sw2-15-smart-dag-implementation.yml
          git checkout HEAD -- .github/workflows/tmp-sw2-15-smart-dag-implementation.yml

      - name: Commit implementation and generated evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/governance_engine.py scripts/selftest_governance_engine.py .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo 'NO_CHANGES_TO_COMMIT'; exit 1; }
          git commit -m 'SW2-15: add smart validation dependency closure'
          git push origin HEAD:work/sw2-15-smart-validation-dag
