name: TEMP SW2-15 Smart DAG Implementation

on:
  push:
    branches:
      - work/sw2-15-smart-validation-dag
    paths:
      - .github/workflows/tmp-sw2-15-smart-dag-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Implement smart planning and dependency closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              left = text.index(start)
              right = text.index(end, left)
              return text[:left] + replacement + text[right:]

          engine_path = Path('scripts/governance_engine.py')
          text = engine_path.read_text(encoding='utf-8')
          if 'FAST_MODE_NODE_ORDER = (' in text:
              raise RuntimeError('SMART_DAG_ALREADY_PRESENT')

          marker = '\n\ndef git(root: Path, *args: str) -> str:\n'
          if text.count(marker) != 1:
              raise RuntimeError('ENGINE_CONSTANT_BOUNDARY')
          constants = '''
          FAST_MODE_NODE_ORDER = (
              "compile_scripts",
              "engine_regression",
              "sequence_regression",
              "cross_document_regression",
              "compiler_selftest",
              "sync_project_truth",
              "validate_project_docs",
              "validate_human_comprehension",
              "validate_sequence_sessions",
              "validate_handoff",
              "validate_cross_document_consistency",
              "impact_only",
          )
          DEVELOP_NODE_DEPENDENCIES = {
              "compile_scripts": (),
              "engine_regression": ("compile_scripts",),
              "sequence_regression": ("compile_scripts",),
              "cross_document_regression": ("compile_scripts",),
              "compiler_selftest": ("compile_scripts",),
              "sync_project_truth": (),
              "validate_project_docs": (),
              "validate_human_comprehension": (),
              "validate_sequence_sessions": (),
              "validate_handoff": (),
              "validate_cross_document_consistency": ("sync_project_truth",),
              "impact_only": (),
          }
          VERIFY_NODE_DEPENDENCIES = {
              "compile_scripts": (),
              "engine_regression": ("compile_scripts",),
              "sequence_regression": ("compile_scripts",),
              "cross_document_regression": ("compile_scripts",),
              "compiler_selftest": ("compile_scripts",),
              "sync_project_truth": (),
              "validate_project_docs": (),
              "validate_human_comprehension": ("validate_project_docs",),
              "validate_sequence_sessions": (),
              "validate_handoff": ("validate_project_docs",),
              "validate_cross_document_consistency": ("validate_project_docs",),
              "impact_only": (),
          }
          '''
          text = text.replace(marker, '\n' + constants + marker, 1)

          planner = '''def mode_node_dependencies(mode: str, name: str) -> tuple[str, ...]:
              if mode == "develop":
                  mapping = DEVELOP_NODE_DEPENDENCIES
              elif mode == "verify":
                  mapping = VERIFY_NODE_DEPENDENCIES
              else:
                  raise ValueError(f"SMART_DAG_MODE_UNSUPPORTED:{mode}")
              if name not in mapping:
                  raise ValueError(f"SMART_DAG_NODE_UNDECLARED:{mode}:{name}")
              return mapping[name]


          def dependency_closure(
              mode: str,
              seeds: tuple[str, ...] | list[str],
          ) -> tuple[str, ...]:
              selected: set[str] = set()
              visiting: set[str] = set()

              def include(name: str) -> None:
                  if name in selected:
                      return
                  if name in visiting:
                      raise ValueError(f"SMART_DAG_DEPENDENCY_CYCLE:{mode}:{name}")
                  visiting.add(name)
                  for dependency in mode_node_dependencies(mode, name):
                      include(dependency)
                  visiting.remove(name)
                  selected.add(name)

              for seed in seeds:
                  include(seed)
              return tuple(name for name in FAST_MODE_NODE_ORDER if name in selected)


          def verify_node_names(
              paths: tuple[str, ...] | list[str],
              impacts: tuple[str, ...],
          ) -> tuple[str, ...]:
              names: set[str] = set()
              path_set = set(paths)
              if path_set.intersection(ENGINE_DEVELOP_FILES):
                  names.add("engine_regression")
              if path_set.intersection(SEQUENCE_DEVELOP_FILES) or any(
                  path.startswith("docs/sequence/") for path in path_set
              ):
                  names.update(("sequence_regression", "validate_sequence_sessions"))
              if path_set.intersection(COMPILER_DEVELOP_FILES):
                  names.update(("compiler_selftest", "validate_project_docs"))
              if path_set.intersection(CROSSDOC_DEVELOP_FILES):
                  names.update(("cross_document_regression", "validate_cross_document_consistency"))
              for path, node_name in DEVELOP_TEST_MAP.items():
                  if path in path_set:
                      names.add(node_name)

              impact_set = set(impacts)
              if "governance" in impact_set:
                  names.update((
                      "validate_project_docs",
                      "validate_human_comprehension",
                      "validate_sequence_sessions",
                      "validate_handoff",
                      "validate_cross_document_consistency",
                  ))
              if "documentation" in impact_set:
                  names.update((
                      "validate_project_docs",
                      "validate_human_comprehension",
                      "validate_handoff",
                      "validate_cross_document_consistency",
                  ))
              if "source" in impact_set:
                  names.add("validate_cross_document_consistency")
              if impact_set.intersection({"broad_source", "template", "ci"}):
                  names.update(VERIFY_NODE_NAMES)
              if "benchmark" in impact_set and not names:
                  names.add("impact_only")
              if not names:
                  names.add("impact_only")

              seeds = tuple(name for name in FAST_MODE_NODE_ORDER if name in names)
              return dependency_closure("verify", seeds)


          def planned_node_names(
              requested: str,
              effective: str,
              paths: tuple[str, ...],
              impacts: tuple[str, ...],
          ) -> tuple[str, ...]:
              if effective == "finalize":
                  return FINALIZE_NODE_NAMES
              if effective == "verify":
                  return verify_node_names(paths, impacts)
              return dependency_closure("develop", develop_node_names(paths, impacts))
          '''
          text = replace_between(
              text,
              'def planned_node_names(\n',
              '\n\ndef governed_status(',
              planner,
          )

          old_prologue = '''    wanted = set(node_names)
              nodes: list[ValidationNode] = []
          '''
          prologue = '''    wanted = set(node_names)
              nodes: list[ValidationNode] = []
              if mode in {"develop", "verify"}:
                  undeclared = tuple(
                      sorted(name for name in wanted if name not in FAST_MODE_NODE_ORDER)
                  )
                  if undeclared:
                      raise ValueError(
                          f"SMART_DAG_NODE_UNDECLARED:{mode}:{','.join(undeclared)}"
                      )
                  ordered_wanted = tuple(
                      name for name in FAST_MODE_NODE_ORDER if name in wanted
                  )
                  closed = dependency_closure(mode, ordered_wanted)
                  missing = tuple(name for name in closed if name not in wanted)
                  if missing:
                      raise ValueError(
                          f"SMART_DAG_DEPENDENCY_MISSING:{mode}:{','.join(missing)}"
                      )
          '''
          if text.count(old_prologue) != 1:
              raise RuntimeError('BUILD_MODE_DAG_PROLOGUE')
          text = text.replace(old_prologue, prologue, 1)
          engine_path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('scripts/selftest_governance_engine.py')
          tests = test_path.read_text(encoding='utf-8')
          if tests.count('    collect_changed_paths,\n') != 1:
              raise RuntimeError('SELFTEST_IMPORT_COLLECT')
          tests = tests.replace(
              '    collect_changed_paths,\n',
              '    build_mode_dag,\n    collect_changed_paths,\n    dependency_closure,\n',
              1,
          )
          if tests.count('    effective_mode,\n') != 1:
              raise RuntimeError('SELFTEST_IMPORT_EFFECTIVE')
          tests = tests.replace(
              '    effective_mode,\n',
              '    effective_mode,\n    mode_node_dependencies,\n',
              1,
          )
          if tests.count('    planned_node_names,\n') != 1:
              raise RuntimeError('SELFTEST_IMPORT_PLANNED')
          tests = tests.replace(
              '    planned_node_names,\n',
              '    planned_node_names,\n    verify_node_names,\n',
              1,
          )

          old = '''    require(
                  set(VERIFY_NODE_NAMES) == verify_nodes,
                  "verify node set drifted from declared contract",
              )

              finalize_nodes = set(
          '''
          new = '''    require(
                  set(VERIFY_NODE_NAMES) == verify_nodes,
                  "broad-source verify must retain the full declared verify contract",
              )

              engine_verify_nodes = set(verify_node_names(engine_paths, engine_impacts))
              require(
                  engine_verify_nodes == {"compile_scripts", "engine_regression"},
                  f"known engine verify selected unrelated work: {sorted(engine_verify_nodes)}",
              )

              docs_paths = ("docs/handbook/README.md",)
              docs_impacts = classify_changed_paths(docs_paths)
              docs_verify_nodes = set(verify_node_names(docs_paths, docs_impacts))
              require(
                  docs_verify_nodes == {
                      "validate_project_docs",
                      "validate_human_comprehension",
                      "validate_handoff",
                      "validate_cross_document_consistency",
                  },
                  f"documentation verify closure drifted: {sorted(docs_verify_nodes)}",
              )

              governance_paths = (".workflow/state.json",)
              governance_impacts = classify_changed_paths(governance_paths)
              governance_verify_nodes = set(
                  verify_node_names(governance_paths, governance_impacts)
              )
              require(
                  "validate_sequence_sessions" in governance_verify_nodes,
                  "governance verify missed sequence validation",
              )
              require(
                  not governance_verify_nodes.intersection({
                      "engine_regression",
                      "sequence_regression",
                      "cross_document_regression",
                      "compiler_selftest",
                  }),
                  f"governance verify selected unrelated source regressions: {sorted(governance_verify_nodes)}",
              )

              finalize_nodes = set(
          '''
          if tests.count(old) != 1:
              raise RuntimeError('SELFTEST_VERIFY_SELECTION_BOUNDARY')
          tests = tests.replace(old, new, 1)

          smart_test = '''def smart_validation_dependency_contract() -> None:
              verify_closure = dependency_closure(
                  "verify",
                  ("validate_cross_document_consistency",),
              )
              require(
                  verify_closure == (
                      "validate_project_docs",
                      "validate_cross_document_consistency",
                  ),
                  f"verify dependency closure drifted: {verify_closure}",
              )
              develop_closure = dependency_closure(
                  "develop",
                  ("validate_cross_document_consistency",),
              )
              require(
                  develop_closure == (
                      "sync_project_truth",
                      "validate_cross_document_consistency",
                  ),
                  f"develop dependency closure drifted: {develop_closure}",
              )

              try:
                  dependency_closure("verify", ("future_validator",))
              except ValueError as exc:
                  require(
                      "SMART_DAG_NODE_UNDECLARED" in str(exc),
                      f"undeclared smart-DAG node failed with wrong error: {exc}",
                  )
              else:
                  raise AssertionError("undeclared smart-DAG node did not fail closed")

              try:
                  build_mode_dag(
                      Path('.'),
                      base='fixture-base',
                      mode='verify',
                      node_names=("validate_cross_document_consistency",),
                  )
              except ValueError as exc:
                  require(
                      "SMART_DAG_DEPENDENCY_MISSING" in str(exc),
                      f"incomplete smart-DAG plan failed with wrong error: {exc}",
                  )
              else:
                  raise AssertionError("incomplete smart-DAG plan did not fail closed")

              selected = verify_node_names(
                  ("scripts/governance_engine.py",),
                  classify_changed_paths(("scripts/governance_engine.py",)),
              )
              require(
                  selected == ("compile_scripts", "engine_regression"),
                  f"engine smart verify plan drifted: {selected}",
              )
              built = build_mode_dag(
                  Path('.'),
                  base='fixture-base',
                  mode='verify',
                  node_names=selected,
              )
              require(
                  set(built.nodes) == {"compile_scripts", "engine_regression"},
                  f"engine smart verify DAG drifted: {sorted(built.nodes)}",
              )

              downstream_calls = 0
              def prerequisite_fail() -> tuple[int, str]:
                  return 1, "EXPECTED_SMART_DEPENDENCY_FAILURE\\n"
              def dependent_action() -> tuple[int, str]:
                  nonlocal downstream_calls
                  downstream_calls += 1
                  return 0, "UNEXPECTED_DEPENDENT_EXECUTION\\n"

              results = ValidationDAG([
                  ValidationNode(
                      "validate_project_docs",
                      mode_node_dependencies("verify", "validate_project_docs"),
                      prerequisite_fail,
                  ),
                  ValidationNode(
                      "validate_cross_document_consistency",
                      mode_node_dependencies(
                          "verify",
                          "validate_cross_document_consistency",
                      ),
                      dependent_action,
                  ),
              ]).run()
              require(
                  results["validate_project_docs"].status == "FAIL",
                  "smart-DAG prerequisite failure was not recorded",
              )
              require(
                  results["validate_cross_document_consistency"].status == "BLOCKED",
                  "smart-DAG dependent was not blocked",
              )
              require(downstream_calls == 0, "blocked smart-DAG node executed")
              print("SMART_VALIDATION_DAG=PASS")


          '''
          changed_marker = 'def changed_path_collection_contract() -> None:\n'
          if tests.count(changed_marker) != 1:
              raise RuntimeError('SELFTEST_SMART_TEST_BOUNDARY')
          tests = tests.replace(changed_marker, smart_test + changed_marker, 1)

          main_marker = '    mode_planning_contract()\n    changed_path_collection_contract()\n'
          if tests.count(main_marker) != 1:
              raise RuntimeError('SELFTEST_MAIN_BOUNDARY')
          tests = tests.replace(
              main_marker,
              '    mode_planning_contract()\n    smart_validation_dependency_contract()\n    changed_path_collection_contract()\n',
              1,
          )
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Test implementation
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py

      - name: Regenerate SW2-15 sequence and Project Truth
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          session_path = root / 'docs/sequence/sessions/SW2-15-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          command = [
              sys.executable,
              'scripts/generate_sequence_actual.py',
              '--root', '.',
              '--output-json', actual['graph'],
              '--output-mermaid', actual['diagram'],
          ]
          for entry in actual['entries']:
              command.extend(['--entry', entry])
          subprocess.run(command, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(
              json.dumps(session, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          human = session['human_view']
          subprocess.run([
              sys.executable,
              'scripts/sequence_human_view.py',
              '--root', '.',
              '--actual-json', actual['graph'],
              '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'],
              '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'],
              '--session-id', session['session_id'],
          ], check=True)
          subprocess.run([
              sys.executable,
              'scripts/validate_sequence_contract.py',
              '--root', '.',
              '--session', 'docs/sequence/sessions/SW2-15-GOVERNANCE.json',
          ], check=True)
          PY
          python scripts/sync_project_truth.py --root .

      - name: Validate helper-free candidate
        shell: bash
        run: |
          rm -f .github/workflows/tmp-sw2-15-smart-dag-implementation.yml
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/selftest_strict_project_workflow.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          test ! -e .github/workflows/tmp-sw2-15-smart-dag-implementation.yml

      - name: Commit source and generated evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/governance_engine.py scripts/selftest_governance_engine.py .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo 'NO_CHANGES_TO_COMMIT'; exit 1; }
          git commit -m 'SW2-15: add smart validation dependency closure'
          git push origin HEAD:work/sw2-15-smart-validation-dag
