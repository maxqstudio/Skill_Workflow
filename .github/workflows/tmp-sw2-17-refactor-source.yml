name: TEMP SW2-17 Projection Refactor Source

on:
  push:
    branches:
      - work/sw2-17-generator-modularization
    paths:
      - .github/workflows/tmp-sw2-17-refactor-source.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-17-generator-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract projection modules and prove renderer parity
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import importlib
          import importlib.util
          import inspect
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          scripts = root / 'scripts'
          sys.path.insert(0, str(scripts))
          generator_path = scripts / 'generate_project_docs.py'
          source = generator_path.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)

          old_spec = importlib.util.spec_from_file_location('sw2_17_old_generator', generator_path)
          if old_spec is None or old_spec.loader is None:
              raise RuntimeError('OLD_GENERATOR_IMPORT_SPEC')
          old = importlib.util.module_from_spec(old_spec)
          old_spec.loader.exec_module(old)

          profile_path = root / 'PROJECT_PROFILE.yaml'
          profile_data = old.parse_profile(profile_path)
          profile = old.normalized_profile(profile_data)
          required = old.required_docs(profile_data)
          contracts = old.contract_settings(profile_data)
          sequence = old.sequence_settings(profile_data)
          documentation = old.documentation_settings(profile_data)
          spec_root = root / str(documentation.get('spec_root', '.workflow'))
          specs, workflows = old.read_specs(spec_root)
          facts = json.loads((root / '.workflow/generated/code_facts.json').read_text(encoding='utf-8'))
          values = {
              'profile': profile,
              'specs': specs,
              'workflows': workflows,
              'facts': facts,
              'sequence_required': bool(sequence.get('required', False)),
          }

          groups = {
              'project_truth_projection_state': [
                  'render_system_overview', 'render_project_manifest', 'render_current_state',
                  'render_roadmap', 'render_authority', 'render_architecture',
                  'render_workflows', 'render_sequence',
              ],
              'project_truth_projection_code': [
                  'render_modules', 'render_symbols', 'render_flows', 'render_acceptance',
              ],
              'project_truth_projection_governance': [
                  'render_doc_sync', 'render_truth', 'render_decisions', 'render_defects',
                  'render_changelog', 'render_glossary',
              ],
              'project_truth_projection_contracts': [
                  'render_api', 'render_data', 'render_ui', 'render_runbook',
              ],
          }
          leaf_names = [name for names in groups.values() for name in names]
          common_names = [
              'clean', 'cell', 'bullets', 'normalize_markdown', 'generated_header',
              'claim_backlink_comment', 'auth_lookup', 'wanted_doc_names',
          ]
          expected_doc_map = {
              'SYSTEM_OVERVIEW.md': 'render_system_overview',
              'PROJECT_MANIFEST.md': 'render_project_manifest',
              'CURRENT_STATE.md': 'render_current_state',
              'ROADMAP.md': 'render_roadmap',
              'SOURCE_AUTHORITY_MAP.md': 'render_authority',
              'ARCHITECTURE.md': 'render_architecture',
              'WORKFLOW_STATE_MACHINE.md': 'render_workflows',
              'SEQUENCE_CONTRACTS.md': 'render_sequence',
              'MODULE_MAP.md': 'render_modules',
              'SYMBOL_INDEX.md': 'render_symbols',
              'FLOW_INDEX.md': 'render_flows',
              'TEST_ACCEPTANCE_MATRIX.md': 'render_acceptance',
              'DOC_SYNC_MATRIX.md': 'render_doc_sync',
              'PROJECT_TRUTH_SYNC.md': 'render_truth',
              'API_CONTRACTS.md': 'render_api',
              'DATA_CONTRACTS.md': 'render_data',
              'UI_INFORMATION_ARCHITECTURE.md': 'render_ui',
              'RUNBOOK.md': 'render_runbook',
              'DECISIONS.md': 'render_decisions',
              'KNOWN_DEFECTS.md': 'render_defects',
              'GLOSSARY.md': 'render_glossary',
              'CHANGELOG.md': 'render_changelog',
          }
          if len(leaf_names) != 22 or len(set(leaf_names)) != 22:
              raise RuntimeError('PROJECTION_RENDERER_CARDINALITY')

          def invoke(module, name):
              fn = getattr(module, name)
              args = []
              for parameter in inspect.signature(fn).parameters.values():
                  if parameter.name not in values:
                      raise RuntimeError('UNMAPPED_RENDERER_PARAMETER:' + name + ':' + parameter.name)
                  args.append(values[parameter.name])
              return fn(*args)

          before_leaf = {name: invoke(old, name) for name in leaf_names}
          before_all = old.render_all(
              profile, specs, workflows, facts, required, contracts, sequence,
              'SW2-17-PARITY-DIGEST',
          )

          tree = ast.parse(source)
          funcs = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          missing = sorted(set(common_names + leaf_names + ['render_all']) - set(funcs))
          if missing:
              raise RuntimeError('MISSING_FUNCTIONS:' + ','.join(missing))
          for name in leaf_names:
              cross = sorted({
                  node.id for node in ast.walk(funcs[name])
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)
                  and node.id.startswith('render_') and node.id != name
              })
              if cross:
                  raise RuntimeError('CROSS_RENDERER_DEPENDENCY:' + name + ':' + ','.join(cross))

          def function_text(name):
              node = funcs[name]
              return ''.join(lines[node.lineno - 1:node.end_lineno]).rstrip() + '\n'

          common_header = (
              '"""Shared deterministic helpers for Project Truth projection renderers."""\n\n'
              'from __future__ import annotations\n\n'
              'from pathlib import Path\n'
              'from typing import Any\n\n'
          )
          common_text = common_header + '\n\n'.join(function_text(name).rstrip() for name in common_names) + '\n'
          (scripts / 'project_truth_projection_common.py').write_text(common_text, encoding='utf-8', newline='\n')

          common_set = set(common_names)
          for module_name, names in groups.items():
              used_common = set()
              for name in names:
                  for node in ast.walk(funcs[name]):
                      if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load) and node.id in common_set:
                          used_common.add(node.id)
              imports = ''
              if used_common:
                  imports = (
                      'from project_truth_projection_common import (\n'
                      + ''.join('    ' + name + ',\n' for name in sorted(used_common))
                      + ')\n\n'
                  )
              text = (
                  '"""Deterministic Project Truth projection renderers.\n\n'
                  'Extracted from generate_project_docs.py without semantic changes.\n'
                  '"""\n\nfrom __future__ import annotations\n\n'
                  + imports
                  + '\n\n'.join(function_text(name).rstrip() for name in names)
                  + '\n'
              )
              (scripts / (module_name + '.py')).write_text(text, encoding='utf-8', newline='\n')

          removed = set(common_names + leaf_names)
          remove_lines = set()
          for name in removed:
              node = funcs[name]
              remove_lines.update(range(node.lineno - 1, node.end_lineno))
          remaining = ''.join(line for idx, line in enumerate(lines) if idx not in remove_lines)

          import_block = '''from project_truth_projection_common import (\n    auth_lookup,\n    bullets,\n    cell,\n    claim_backlink_comment,\n    clean,\n    generated_header,\n    normalize_markdown,\n    wanted_doc_names,\n)\nfrom project_truth_projection_state import (\n    render_architecture,\n    render_authority,\n    render_current_state,\n    render_project_manifest,\n    render_roadmap,\n    render_sequence,\n    render_system_overview,\n    render_workflows,\n)\nfrom project_truth_projection_code import (\n    render_acceptance,\n    render_flows,\n    render_modules,\n    render_symbols,\n)\nfrom project_truth_projection_governance import (\n    render_changelog,\n    render_decisions,\n    render_defects,\n    render_doc_sync,\n    render_glossary,\n    render_truth,\n)\nfrom project_truth_projection_contracts import (\n    render_api,\n    render_data,\n    render_runbook,\n    render_ui,\n)\n\n'''
          marker = '\nSPEC_FILES = ['
          if remaining.count(marker) != 1:
              raise RuntimeError('GENERATOR_IMPORT_INSERTION_MARKER')
          remaining = remaining.replace(marker, '\n' + import_block + 'SPEC_FILES = [', 1)
          generator_path.write_text(remaining, encoding='utf-8', newline='\n')

          module_paths = [
              'scripts/project_truth_projection_common.py',
              'scripts/project_truth_projection_state.py',
              'scripts/project_truth_projection_code.py',
              'scripts/project_truth_projection_governance.py',
              'scripts/project_truth_projection_contracts.py',
          ]
          for target in ['scripts/governance_engine.py']:
              p = root / target
              text = p.read_text(encoding='utf-8')
              anchor = '    "scripts/project_truth_impact.py",\n}'
              addition = '    "scripts/project_truth_impact.py",\n' + ''.join('    "' + path + '",\n' for path in module_paths) + '}'
              if text.count(anchor) != 1:
                  raise RuntimeError('GOVERNANCE_COMPILER_FILES_ANCHOR')
              p.write_text(text.replace(anchor, addition, 1), encoding='utf-8', newline='\n')

          impact_path = root / 'scripts/project_truth_impact.py'
          impact = impact_path.read_text(encoding='utf-8')
          anchor = '    "scripts/project_profile.py",\n    "scripts/schema_contract.py",\n}'
          addition = '    "scripts/project_profile.py",\n    "scripts/schema_contract.py",\n' + ''.join('    "' + path + '",\n' for path in module_paths) + '}'
          if impact.count(anchor) != 1:
              raise RuntimeError('IMPACT_BROAD_TOOL_ANCHOR')
          impact_path.write_text(impact.replace(anchor, addition, 1), encoding='utf-8', newline='\n')

          selftest_path = root / 'scripts/selftest_project_truth_compiler.py'
          selftest = selftest_path.read_text(encoding='utf-8')
          contract_function = r'''

def test_projection_module_contract(skill_root: Path) -> None:
    import ast
    import importlib
    import inspect

    scripts = skill_root / "scripts"
    inserted = False
    if str(scripts) not in sys.path:
        sys.path.insert(0, str(scripts))
        inserted = True
    try:
        generator = importlib.import_module("generate_project_docs")
        expected_modules = {
            "project_truth_projection_state": {
                "render_system_overview", "render_project_manifest", "render_current_state",
                "render_roadmap", "render_authority", "render_architecture",
                "render_workflows", "render_sequence",
            },
            "project_truth_projection_code": {
                "render_modules", "render_symbols", "render_flows", "render_acceptance",
            },
            "project_truth_projection_governance": {
                "render_doc_sync", "render_truth", "render_decisions", "render_defects",
                "render_changelog", "render_glossary",
            },
            "project_truth_projection_contracts": {
                "render_api", "render_data", "render_ui", "render_runbook",
            },
        }
        expected_map = {
            "SYSTEM_OVERVIEW.md": "render_system_overview",
            "PROJECT_MANIFEST.md": "render_project_manifest",
            "CURRENT_STATE.md": "render_current_state",
            "ROADMAP.md": "render_roadmap",
            "SOURCE_AUTHORITY_MAP.md": "render_authority",
            "ARCHITECTURE.md": "render_architecture",
            "WORKFLOW_STATE_MACHINE.md": "render_workflows",
            "SEQUENCE_CONTRACTS.md": "render_sequence",
            "MODULE_MAP.md": "render_modules",
            "SYMBOL_INDEX.md": "render_symbols",
            "FLOW_INDEX.md": "render_flows",
            "TEST_ACCEPTANCE_MATRIX.md": "render_acceptance",
            "DOC_SYNC_MATRIX.md": "render_doc_sync",
            "PROJECT_TRUTH_SYNC.md": "render_truth",
            "API_CONTRACTS.md": "render_api",
            "DATA_CONTRACTS.md": "render_data",
            "UI_INFORMATION_ARCHITECTURE.md": "render_ui",
            "RUNBOOK.md": "render_runbook",
            "DECISIONS.md": "render_decisions",
            "KNOWN_DEFECTS.md": "render_defects",
            "GLOSSARY.md": "render_glossary",
            "CHANGELOG.md": "render_changelog",
        }
        source = (scripts / "generate_project_docs.py").read_text(encoding="utf-8")
        tree = ast.parse(source)
        top_renderers = {
            node.name for node in tree.body
            if isinstance(node, ast.FunctionDef) and node.name.startswith("render_")
        }
        if top_renderers != {"render_all"}:
            raise RuntimeError("PROJECTION_MONOLITH_RENDERERS_REMAIN:" + ",".join(sorted(top_renderers)))
        render_all = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "render_all")
        observed_map = {}
        for node in ast.walk(render_all):
            if not isinstance(node, ast.Assign) or not any(isinstance(t, ast.Name) and t.id == "renderers" for t in node.targets):
                continue
            if not isinstance(node.value, ast.Dict):
                continue
            for key, value in zip(node.value.keys, node.value.values):
                if not isinstance(key, ast.Constant) or not isinstance(key.value, str):
                    continue
                if not isinstance(value, ast.Lambda) or not isinstance(value.body, ast.Call) or not isinstance(value.body.func, ast.Name):
                    raise RuntimeError("PROJECTION_RENDERER_MAPPING_SHAPE:" + str(key.value))
                observed_map[key.value] = value.body.func.id
        if observed_map != expected_map:
            raise RuntimeError("PROJECTION_RENDERER_MAP_MISMATCH")

        profile_data = generator.parse_profile(skill_root / "PROJECT_PROFILE.yaml")
        profile = generator.normalized_profile(profile_data)
        documentation = generator.documentation_settings(profile_data)
        spec_root = skill_root / str(documentation.get("spec_root", ".workflow"))
        specs, workflows = generator.read_specs(spec_root)
        facts = json.loads((skill_root / ".workflow/generated/code_facts.json").read_text(encoding="utf-8"))
        sequence = generator.sequence_settings(profile_data)
        values = {
            "profile": profile,
            "specs": specs,
            "workflows": workflows,
            "facts": facts,
            "sequence_required": bool(sequence.get("required", False)),
        }
        seen = set()
        for module_name, names in expected_modules.items():
            module = importlib.import_module(module_name)
            for name in names:
                fn = getattr(module, name, None)
                if not callable(fn):
                    raise RuntimeError("PROJECTION_RENDERER_MISSING:" + module_name + ":" + name)
                if getattr(generator, name).__module__ != module_name:
                    raise RuntimeError("PROJECTION_REEXPORT_MISMATCH:" + name)
                args = []
                for parameter in inspect.signature(fn).parameters.values():
                    if parameter.name not in values:
                        raise RuntimeError("PROJECTION_PARAMETER_UNMAPPED:" + name + ":" + parameter.name)
                    args.append(values[parameter.name])
                rendered = fn(*args)
                if not isinstance(rendered, str):
                    raise RuntimeError("PROJECTION_RENDERER_NON_TEXT:" + name)
                seen.add(name)
        if seen != set(expected_map.values()):
            raise RuntimeError("PROJECTION_DIRECT_COVERAGE_INCOMPLETE")
    finally:
        if inserted and sys.path and sys.path[0] == str(scripts):
            sys.path.pop(0)
'''
          marker = '\ndef main() -> int:\n'
          if selftest.count(marker) != 1:
              raise RuntimeError('SELFTEST_MAIN_MARKER')
          selftest = selftest.replace(marker, contract_function + marker, 1)
          call_marker = '    test_gitignored_source_files_are_excluded()\n    print("GITIGNORED_SOURCE_EXCLUSION=PASS")\n'
          call = call_marker + '    test_projection_module_contract(skill_root)\n    print("PROJECTION_MODULE_CONTRACT=PASS modules=4 renderers=22")\n'
          if selftest.count(call_marker) != 1:
              raise RuntimeError('SELFTEST_CALL_MARKER')
          selftest_path.write_text(selftest.replace(call_marker, call, 1), encoding='utf-8', newline='\n')

          for name in ['generate_project_docs'] + list(groups) + ['project_truth_projection_common']:
              sys.modules.pop(name, None)
          importlib.invalidate_caches()
          new_spec = importlib.util.spec_from_file_location('sw2_17_new_generator', generator_path)
          if new_spec is None or new_spec.loader is None:
              raise RuntimeError('NEW_GENERATOR_IMPORT_SPEC')
          new = importlib.util.module_from_spec(new_spec)
          new_spec.loader.exec_module(new)
          after_leaf = {name: invoke(new, name) for name in leaf_names}
          after_all = new.render_all(
              profile, specs, workflows, facts, required, contracts, sequence,
              'SW2-17-PARITY-DIGEST',
          )
          if before_leaf != after_leaf:
              bad = sorted(name for name in leaf_names if before_leaf[name] != after_leaf[name])
              raise RuntimeError('PROJECTION_LEAF_PARITY_MISMATCH:' + ','.join(bad))
          if before_all != after_all:
              bad = sorted(set(before_all) | set(after_all))
              bad = [name for name in bad if before_all.get(name) != after_all.get(name)]
              raise RuntimeError('PROJECTION_PACK_PARITY_MISMATCH:' + ','.join(bad))
          print('SW2_17_RENDERER_PARITY=PASS renderers=22 modules=4')
          PY

      - name: Run focused modularization regressions
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_schema_toolchain.py
          python scripts/selftest_governance_engine.py

      - name: Commit only source refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/generate_project_docs.py \
            scripts/project_truth_projection_common.py \
            scripts/project_truth_projection_state.py \
            scripts/project_truth_projection_code.py \
            scripts/project_truth_projection_governance.py \
            scripts/project_truth_projection_contracts.py \
            scripts/project_truth_impact.py \
            scripts/governance_engine.py \
            scripts/selftest_project_truth_compiler.py
          git commit -m 'SW2-17: modularize Project Truth projection renderers'
          git push origin HEAD:work/sw2-17-generator-modularization
