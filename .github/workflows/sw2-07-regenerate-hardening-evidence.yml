name: SW2-07 Regenerate Hardening Evidence

on:
  push:
    branches:
      - work/sw2-07-public-project-hardening

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_HEAD: "5ee3fe862760ccae46b68cbad0e9ea49ca5e6f12"
      ACCEPTED_MAIN: "f391fe9dc5d208803118090bbe6a174e8f6c7c63"
      BRANCH: "work/sw2-07-public-project-hardening"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-07-public-project-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact source lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD
          test "$(git diff --name-only "$SOURCE_HEAD"..HEAD)" = ".github/workflows/sw2-07-regenerate-hardening-evidence.yml"

      - name: Rebind authority and hardening evidence contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          accepted = "f391fe9dc5d208803118090bbe6a174e8f6c7c63"
          branch = "work/sw2-07-public-project-hardening"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )

          release_doc = Path("docs/handbook/reference/release-process.md")
          text = release_doc.read_text(encoding="utf-8")
          text = text.replace("`governance_engine.py --mode finalize`", "`scripts/governance_engine.py --mode finalize`")
          text = text.replace("runs `release_preflight.py`", "runs `scripts/release_preflight.py`")
          release_doc.write_text(text, encoding="utf-8", newline="\n")

          repo_doc = Path("docs/handbook/reference/repository-governance.md")
          text = repo_doc.read_text(encoding="utf-8")
          text = text.replace("`validate_github_ruleset.py`", "`scripts/validate_github_ruleset.py`")
          repo_doc.write_text(text, encoding="utf-8", newline="\n")

          state = load(".workflow/state.json")
          state["last_accepted_branch"] = "main"
          state["last_accepted_sha"] = accepted
          state["working_branch"] = branch
          proof = (
              "SW2-07 phase-open authority is accepted on main f391fe9dc5d208803118090bbe6a174e8f6c7c63: "
              "the squash-merged tree e2b32ed45a98a2b2bf79f7824e278ca0136f9136 equals tested PR-head 80b3aa5e1f7a2f8aca7ed315e3192c1a653758c0, "
              "and post-merge Self Governance 37112092243, Governance Selftest 37112092289 on Ubuntu and Windows, "
              "SW2 Sequence Evidence 37112092314, SW2 Engine Performance 37112092222, and SW2 Consumer Engine Performance 37112092263 all succeeded."
          )
          if proof not in state["proven"]:
              state["proven"].append(proof)
          state["blockers"] = [
              "Owner-approved public license decision is still required before SW2-07-R1 can PASS.",
              "Live GitHub ruleset 24406662 lacks required_status_checks for the six permanent acceptance checks, so SW2-07-R3 remains NOT_PROVEN."
          ]
          state["not_proven"] = [
              "SW2-07 repository health files exist, but an Owner-approved public license is still NOT_PROVEN.",
              "SW2-07 security and contribution paths are implemented but not yet accepted on a clean exact candidate.",
              "SW2-07 live GitHub ruleset enforcement does not yet require the six permanent acceptance checks.",
              "SW2-07 release preflight is implemented but not yet accepted on a clean exact candidate."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          by_id = {item["id"]: item for item in acceptance["requirements"]}
          by_id["SW2-07-R1"]["evidence"] = (
              "Repository health files are implemented and guarded by validate_repository_health.py, but no Owner-approved license decision/file exists; remains NOT_PROVEN."
          )
          by_id["SW2-07-R2"]["evidence"] = (
              "CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, README navigation, and repository-health validation are implemented; clean exact-candidate acceptance is still pending."
          )
          by_id["SW2-07-R3"]["evidence"] = (
              "Live ruleset 24406662 is active on the default branch and enforces PR+squash, deletion protection, and non-fast-forward protection, but lacks required_status_checks; remains NOT_PROVEN."
          )
          by_id["SW2-07-R4"]["evidence"] = (
              "Read-only exact-head release preflight, manual workflow, stable SW2-09 boundary, and regression tests are implemented; clean exact-candidate acceptance is still pending."
          )
          assert all(item["status"] == "NOT_PROVEN" for item in acceptance["requirements"])
          acceptance["test_commands"] = [
              "python -m compileall -q scripts",
              "python scripts/validate_schema_toolchain.py --root .",
              "python scripts/selftest_analyzer_contract.py",
              "python scripts/selftest_governance_engine.py",
              "python scripts/selftest_project_truth_compiler.py",
              "python scripts/selftest_strict_project_workflow.py",
              "python scripts/selftest_public_docs.py",
              "python scripts/validate_public_docs.py --root .",
              "python scripts/selftest_repository_health.py",
              "python scripts/validate_repository_health.py --root .",
              "python scripts/selftest_github_ruleset.py",
              "python scripts/selftest_release_preflight.py",
              "python scripts/validate_sequence_sessions.py --root .",
              "python scripts/validate_handoff.py --root .",
              "python scripts/governance_engine.py --root . --base f391fe9dc5d208803118090bbe6a174e8f6c7c63 --mode finalize --expected-head <EXACT_HEAD>"
          ]
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          claim_by_id = {item["id"]: item for item in claims["claims"]}
          health = claim_by_id["TRUTH-SW2-PUBLIC-REPO-HEALTH"]
          health["source_owners"] = [
              "README.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md",
              "scripts/validate_public_docs.py", "scripts/validate_repository_health.py"
          ]
          health["tests"] = ["scripts/selftest_public_docs.py", "scripts/selftest_repository_health.py"]
          health["status"] = "NOT_PROVEN"

          merge = claim_by_id["TRUTH-SW2-MERGE-ENFORCEMENT"]
          merge["source_owners"] = [
              "docs/handbook/reference/repository-governance.md",
              "scripts/validate_github_ruleset.py",
              ".github/workflows/ruleset-audit.yml"
          ]
          merge["tests"] = ["scripts/selftest_github_ruleset.py"]
          merge["runtime_evidence"] = [
              "Live ruleset 24406662 audit at SW2-07 implementation time: active default-branch PR+squash/deletion/non-fast-forward rules present, required_status_checks absent; claim remains NOT_PROVEN."
          ]
          merge["status"] = "NOT_PROVEN"

          release = claim_by_id["TRUTH-SW2-RELEASE-GOVERNANCE"]
          release["source_owners"] = [
              "docs/handbook/reference/release-process.md",
              "scripts/release_preflight.py",
              ".github/workflows/release-preflight.yml"
          ]
          release["tests"] = ["scripts/selftest_release_preflight.py"]
          release["status"] = "NOT_PROVEN"
          save(".workflow/claims.json", claims)

          session_path = Path("docs/sequence/sessions/SW2-07-GOVERNANCE.json")
          session = load(session_path)
          session["implementation_base_sha"] = accepted
          session["evidence_boundary"] = (
              "SW2-07 DURING static evidence binds public documentation, repository-health/license guarding, live-ruleset policy validation, release preflight, handoff, Project Truth, and governance-engine paths. Owner license approval and compliant live GitHub required-status-check enforcement remain NOT_PROVEN because they require Owner/configuration evidence beyond static source."
          )
          session["actual"]["entries"] = [
              "scripts/validate_public_docs.py::main",
              "scripts/validate_repository_health.py::main",
              "scripts/validate_github_ruleset.py::main",
              "scripts/release_preflight.py::main",
              "scripts/validate_handoff.py::main",
              "scripts/validate_project_truth.py::main",
              "scripts/governance_engine.py::main"
          ]
          session["tests"] = [
              "scripts/selftest_public_docs.py",
              "scripts/selftest_repository_health.py",
              "scripts/selftest_github_ruleset.py",
              "scripts/selftest_release_preflight.py",
              "scripts/selftest_strict_project_workflow.py"
          ]
          save(session_path, session)
          PY

      - name: Generate current sequence evidence and bind digest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('.')
          session_path = root / 'docs/sequence/sessions/SW2-07-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [
              sys.executable, 'scripts/generate_sequence_actual.py',
              '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']
          ]
          for entry in actual['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest

          human = session['human_view']
          subprocess.run([
              sys.executable, 'scripts/sequence_human_view.py',
              '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'],
              '--output-json', human['graph'], '--output-mermaid', human['diagram'],
              '--output-markdown', human['document'], '--session-id', session['session_id']
          ], check=True)
          human_graph = json.loads((root / human['graph']).read_text(encoding='utf-8'))
          assert human_graph['source_digest'] == digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          subprocess.run([
              sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.',
              '--session', session_path.as_posix(), '--report', session['acceptance_report']
          ], check=True)
          subprocess.run([
              sys.executable, 'scripts/validate_sequence_human_view.py', '--root', '.',
              '--session', session_path.as_posix()
          ], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_sessions.py', '--root', '.'], check=True)

          acceptance_path = root / '.workflow/acceptance.json'
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['sequence_sync_status'] = 'PASS'
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Regenerate deterministic Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Validate hardening source before commit
        shell: bash
        run: |
          python scripts/validate_public_docs.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/selftest_repository_health.py
          python scripts/selftest_github_ruleset.py
          python scripts/selftest_release_preflight.py
          python scripts/validate_schema_toolchain.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
          python - <<'PY'
          import json
          a=json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert all(x['status']=='NOT_PROVEN' for x in a['requirements'])
          s=json.load(open('.workflow/state.json', encoding='utf-8'))
          assert s['last_accepted_sha']=='f391fe9dc5d208803118090bbe6a174e8f6c7c63'
          assert s['working_branch']=='work/sw2-07-public-project-hardening'
          assert len(s['blockers'])==2
          print('SW2_07_REMAINS_FAIL_CLOSED=PASS')
          PY

      - name: Commit regenerated governed evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs artifacts/sequence
          git diff --cached --quiet && { echo "FAIL NO_REGENERATION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-07): sync public hardening evidence"

      - name: Validate clean committed candidate read only
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base "$ACCEPTED_MAIN" --mode verify --expected-head "$expected"
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated regeneration
        shell: bash
        run: git push origin HEAD:"$BRANCH"
