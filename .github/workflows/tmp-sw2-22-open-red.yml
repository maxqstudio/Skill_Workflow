name: tmp-sw2-22-implementation

on:
  push:
    branches:
      - work/sw2-22-consumer-toolchain-provenance-upgrade

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-22-consumer-toolchain-provenance-upgrade
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Implement and run targeted SW2-22 gates
        run: python scripts/tmp_sw2_22_implement.py
      - name: Commit synchronized implementation state
        run: |
          git add .workflow docs artifacts/sequence scripts references
          git diff --cached --quiet && { echo "NO_CHANGES"; exit 1; }
          git commit -m "SW2-22: synchronize implementation evidence"
          git push origin HEAD:work/sw2-22-consumer-toolchain-provenance-upgrade
