name: tmp-sw2-22-open-red

on:
  push:
    branches:
      - work/sw2-22-consumer-toolchain-provenance-upgrade

permissions:
  contents: write

jobs:
  open-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-22-consumer-toolchain-provenance-upgrade
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Open phase and prove RED
        run: python scripts/tmp_sw2_22_open_red_v2.py
      - name: Commit phase-open RED state
        run: |
          git add .workflow docs artifacts/sequence scripts
          git diff --cached --quiet && { echo "NO_CHANGES"; exit 1; }
          git commit -m "SW2-22: open consumer toolchain provenance RED"
          git push origin HEAD:work/sw2-22-consumer-toolchain-provenance-upgrade
