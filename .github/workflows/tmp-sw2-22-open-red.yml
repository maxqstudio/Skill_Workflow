name: tmp-sw2-22-implementation

on:
  push:
    branches:
      - work/sw2-22-consumer-toolchain-provenance-upgrade

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-22-consumer-toolchain-provenance-upgrade
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Implement and run targeted SW2-22 gates
        shell: bash
        run: |
          set +e
          python scripts/tmp_sw2_22_implement.py 2>&1 | tee "$RUNNER_TEMP/sw2-22-impl.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -q 'DOCUMENTATION_COVERAGE_REPORT_STALE:.workflow/generated/documentation_coverage.json' "$RUNNER_TEMP/sw2-22-impl.log"
            python scripts/validate_documentation_contract.py --root . --write-report
            python scripts/validate_documentation_contract.py --root .
            python scripts/selftest_public_docs.py
            python scripts/validate_public_docs.py --root .
            python scripts/selftest_cross_document_regressions.py
            python - <<'PY'
          import json
          from pathlib import Path
          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['status'] = 'SW2_22_IMPLEMENTED_PENDING_ACCEPTANCE'
          state['next_authorized_actions'] = [
              'Run the permanent exact-head matrix on the helper-free SW2-22 implementation candidate.',
              'Promote R1-R4 only from exact candidate evidence; R5 remains pending merge and post-merge revalidation.',
              'Do not begin SW2-23 or publish a new release without separate Owner authorization.'
          ]
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
            python scripts/sync_project_truth.py --root .
            python scripts/validate_project_docs.py --root .
            echo 'SW2_22_TARGETED_IMPLEMENTATION=PASS repaired=documentation_coverage_ordering'
          fi
      - name: Commit synchronized implementation state
        run: |
          git add .workflow docs artifacts/sequence scripts references
          git diff --cached --quiet && { echo "NO_CHANGES"; exit 1; }
          git commit -m "SW2-22: synchronize implementation evidence"
          git push origin HEAD:work/sw2-22-consumer-toolchain-provenance-upgrade
