name: TEMP SW2-09 R3 Truth Promotion

on:
  push:
    branches:
      - work/sw2-09-v2-stable-release

permissions:
  contents: write

jobs:
  promote-r3-truth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ACCEPTED_BASE: 8d0fbfd7177128774a0f321b8c95e6befdaaf659
      EVIDENCE_HEAD: aef29794d2f94bd6066410408ad948882ccf10ef
      EVIDENCE_TREE: f26e6ca1d3bc41a38504cfe750e65dc9977260a5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-09-v2-stable-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit exact accepted evidence head lineage
        shell: bash
        run: |
          test "$(git rev-parse ${EVIDENCE_HEAD}^{tree})" = "$EVIDENCE_TREE"
          git merge-base --is-ancestor "$ACCEPTED_BASE" "$EVIDENCE_HEAD"
          test "$(git diff --name-only ${EVIDENCE_HEAD}..HEAD)" = ".github/workflows/tmp-sw2-09-r3-truth-promote.yml"
      - name: Reprove changed SW2-09 contracts
        run: |
          python scripts/selftest_release_preflight.py
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/selftest_github_ruleset.py
          python scripts/validate_schema_toolchain.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
      - name: Audit claim traceability and changed semantic authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          claims = json.loads((root / '.workflow' / 'claims.json').read_text(encoding='utf-8'))['claims']
          if not claims:
              raise SystemExit('claim ledger empty')
          bad = []
          for claim in claims:
              status = claim.get('status')
              if status not in {'PASS', 'NOT_APPLICABLE'}:
                  bad.append(f"{claim.get('id')}:status={status}")
                  continue
              if status == 'PASS':
                  for field in ('documents', 'source_owners', 'tests'):
                      values = claim.get(field)
                      if not isinstance(values, list) or not values:
                          bad.append(f"{claim.get('id')}:{field}=missing")
          if bad:
              raise SystemExit('claim traceability audit failed: ' + '; '.join(bad))

          release = next((c for c in claims if c.get('id') == 'TRUTH-SW2-RELEASE-GOVERNANCE'), None)
          if release is None:
              raise SystemExit('release-governance claim missing')
          required_sources = {
              'docs/handbook/reference/release-process.md',
              'scripts/release_preflight.py',
              '.github/workflows/release-preflight.yml',
          }
          if not required_sources.issubset(set(release.get('source_owners', []))):
              raise SystemExit('release-governance claim source mapping incomplete')
          if 'scripts/selftest_release_preflight.py' not in release.get('tests', []):
              raise SystemExit('release-governance claim test mapping incomplete')

          migration = next((c for c in claims if c.get('id') == 'TRUTH-SW2-SCHEMA-MIGRATION'), None)
          if migration is None or migration.get('status') != 'PASS':
              raise SystemExit('schema-migration claim not accepted')

          merge_boundary = next((c for c in claims if c.get('id') == 'TRUTH-SW2-MERGE-ENFORCEMENT'), None)
          if merge_boundary is None or merge_boundary.get('status') != 'PASS':
              raise SystemExit('repository governance boundary claim not accepted')
          if 'no GitHub ruleset is configured' not in merge_boundary.get('claim', ''):
              raise SystemExit('repository governance boundary claim is stale')

          print(f'CLAIMS_AUDITED={len(claims)}')
          print('RELEASE_SEMANTIC_TRACEABILITY=PASS')
          print('MIGRATION_SEMANTIC_TRACEABILITY=PASS')
          print('REPOSITORY_BOUNDARY_SEMANTIC_TRACEABILITY=PASS')
          PY
      - name: Remove temporary workflow from final tree
        run: rm -f .github/workflows/tmp-sw2-09-r3-truth-promote.yml
      - name: Promote R3 and proven truth gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          acceptance_path = root / '.workflow' / 'acceptance.json'
          state_path = root / '.workflow' / 'state.json'
          claims_path = root / '.workflow' / 'claims.json'
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))
          claims = json.loads(claims_path.read_text(encoding='utf-8'))

          evidence_head = 'aef29794d2f94bd6066410408ad948882ccf10ef'
          r3_evidence = (
              'Published V2 migration and rollback guidance is accepted on exact tree-equivalent evidence head '
              f'{evidence_head}. Governance Selftest run 37184136532 passed on Ubuntu and Windows including '
              'release-preflight, public-documentation, cross-document, Project Truth, verify-read-only, adoption-profile, '
              'and STRICT workflow regressions. Self Governance 37184136545, SW2 Sequence Evidence 37184136523, '
              'Governance Engine Performance 37184136533, and Consumer Engine Performance 37184136502 all succeeded. '
              'Public-doc validation requires explicit migration rollback and immutable stable-release rollback guidance; '
              'release preflight regression proves stable publication may leave only SW2-09-R4 publication-pending while all '
              'other requirements remain fail-closed.'
          )
          found = False
          for requirement in acceptance['requirements']:
              if requirement.get('id') == 'SW2-09-R3':
                  requirement['status'] = 'PASS'
                  requirement['evidence'] = r3_evidence
                  found = True
          if not found:
              raise SystemExit('SW2-09-R3 requirement missing')

          gates = acceptance['truth_gates']
          for gate in (
              'SOURCE_TESTS',
              'PROVENANCE_SYNC',
              'REFERENCE_SYNC',
              'STRUCTURAL_SYNC',
              'SEMANTIC_SYNC',
              'CROSS_DOCUMENT_CONSISTENCY',
              'DOC_SOURCE_TRACEABILITY',
              'DOC_TEST_TRACEABILITY',
          ):
              gates[gate] = 'PASS'
          gates['PROJECT_STATE_SYNC'] = 'PASS'

          release_claim = next(c for c in claims['claims'] if c.get('id') == 'TRUTH-SW2-RELEASE-GOVERNANCE')
          current_evidence = list(release_claim.get('runtime_evidence', []))
          new_evidence = (
              f'Exact SW2-09 evidence head {evidence_head} passed release-preflight regression on Ubuntu and Windows in '
              'Governance Selftest 37184136532. Stable SW2-09 strict preflight semantics permit only R4=NOT_PROVEN as '
              'publication-pending; R3 NOT_PROVEN, R4 FAIL, missing R4, dirty worktree, failed finalize, wrong phase, and '
              'stable evidence-only paths are rejected.'
          )
          if new_evidence not in current_evidence:
              current_evidence.append(new_evidence)
          release_claim['runtime_evidence'] = current_evidence

          state['not_proven'] = [
              item for item in state.get('not_proven', [])
              if not item.startswith('SW2-09 migration and rollback guidance publication is NOT_PROVEN')
          ]
          proven = (
              f'SW2-09-R3 migration/rollback guidance and synchronized Project Truth are accepted on exact tree-equivalent '
              f'evidence head {evidence_head}: all six permanent checks succeeded; Governance Selftest 37184136532 passed '
              'Ubuntu/Windows; all canonical claims are PASS with document/source/test traceability; changed release, migration, '
              'and repository-governance semantics were explicitly audited against their source owners and regression tests.'
          )
          if proven not in state.get('proven', []):
              state.setdefault('proven', []).append(proven)
          state['next_authorized_actions'] = [
              'Run complete permanent CI on the clean post-R3 promotion candidate and require all six checks PASS.',
              'If that exact candidate passes, promote SW2-09-R2 release-candidate acceptance without publishing.',
              'After R2 is PASS on a fresh exact candidate, run strict v2.0.0 publication-ready preflight; create no tag/release before publication_authority=true.'
          ]

          for path, data in ((acceptance_path, acceptance), (state_path, state), (claims_path, claims)):
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Synchronize promoted Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit promotion locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SW2-09: accept migration rollback and synchronized truth"
      - name: Validate clean promoted candidate
        run: |
          python scripts/selftest_release_preflight.py
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root .
          python scripts/validate_schema_toolchain.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_BASE" --require-base
          python scripts/validate_project_truth.py --root . --project-docs-already-validated
      - name: Push clean promoted candidate
        run: git push origin HEAD:work/sw2-09-v2-stable-release
