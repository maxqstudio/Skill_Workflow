name: TEMP SW2-15 Smart DAG Implementation V3

on:
  push:
    branches: [work/sw2-15-smart-validation-dag]
    paths: [.github/workflows/tmp-sw2-15-smart-dag-impl-v3.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch planner and adversarial regression
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('scripts/governance_engine.py')
          text = p.read_text(encoding='utf-8')
          marker = ')\n\n\ndef git(root: Path, *args: str) -> str:'
          if marker not in text:
              raise RuntimeError('CONSTANT_INSERTION_MARKER')
          addition = ''' )\n\nDEVELOP_NODE_ORDER = (\n    "compile_scripts",\n    "engine_regression",\n    "sequence_regression",\n    "cross_document_regression",\n    "compiler_selftest",\n    "sync_project_truth",\n    "validate_project_docs",\n    "validate_cross_document_consistency",\n    "impact_only",\n)\nDEVELOP_DEPENDENCIES = {\n    "compile_scripts": (),\n    "engine_regression": ("compile_scripts",),\n    "sequence_regression": ("compile_scripts",),\n    "cross_document_regression": ("compile_scripts",),\n    "compiler_selftest": ("compile_scripts",),\n    "sync_project_truth": (),\n    "validate_project_docs": (),\n    "validate_cross_document_consistency": ("sync_project_truth",),\n    "impact_only": (),\n}\nVERIFY_NODE_ORDER = VERIFY_NODE_NAMES + ("impact_only",)\nVERIFY_DEPENDENCIES = {\n    "compile_scripts": (),\n    "engine_regression": ("compile_scripts",),\n    "sequence_regression": ("compile_scripts",),\n    "cross_document_regression": ("compile_scripts",),\n    "compiler_selftest": ("compile_scripts",),\n    "validate_project_docs": (),\n    "validate_human_comprehension": ("validate_project_docs",),\n    "validate_sequence_sessions": (),\n    "validate_handoff": ("validate_project_docs",),\n    "validate_cross_document_consistency": ("validate_human_comprehension", "validate_handoff"),\n    "impact_only": (),\n}\nVERIFY_BROAD_IMPACTS = frozenset({"broad_source", "template", "ci"})\nVERIFY_IMPACT_NODE_SEEDS = {\n    "engine": ("engine_regression", "validate_cross_document_consistency"),\n    "sequence": ("sequence_regression", "validate_sequence_sessions", "validate_cross_document_consistency"),\n    "compiler": ("compiler_selftest", "validate_cross_document_consistency"),\n    "cross_document": ("cross_document_regression", "validate_cross_document_consistency"),\n    "governance": ("validate_sequence_sessions", "validate_cross_document_consistency"),\n    "documentation": ("validate_cross_document_consistency",),\n    "source": ("validate_sequence_sessions", "validate_cross_document_consistency"),\n    "benchmark": (),\n}\n\ndef dependency_closure(seed_names, dependencies, order):\n    selected = set()\n    visiting = set()\n    def visit(name):\n        if name in selected:\n            return\n        if name in visiting:\n            raise ValueError(f"PLANNER_DAG_CYCLE:{name}")\n        if name not in dependencies:\n            raise ValueError(f"UNKNOWN_PLANNER_NODE:{name}")\n        visiting.add(name)\n        for dep in dependencies[name]:\n            if dep not in dependencies:\n                raise ValueError(f"UNKNOWN_PLANNER_DEPENDENCY:{name}:{dep}")\n            visit(dep)\n        visiting.remove(name)\n        selected.add(name)\n    for seed in seed_names:\n        visit(seed)\n    missing = selected.difference(order)\n    if missing:\n        raise ValueError("PLANNER_ORDER_MISSING:" + ",".join(sorted(missing)))\n    return tuple(name for name in order if name in selected)\n\ndef verify_seed_node_names(paths, impacts):\n    impact_set = set(impacts)\n    if impact_set.intersection(VERIFY_BROAD_IMPACTS):\n        return VERIFY_NODE_NAMES\n    if "unknown" in impact_set:\n        raise ValueError("VERIFY_UNKNOWN_IMPACT_REQUIRES_FINALIZE")\n    handled = set(VERIFY_IMPACT_NODE_SEEDS) | {"targeted_test"}\n    unhandled = impact_set.difference(handled)\n    if unhandled:\n        raise ValueError("UNMAPPED_VERIFY_IMPACT:" + ",".join(sorted(unhandled)))\n    seeds = set()\n    for impact in sorted(impact_set):\n        seeds.update(VERIFY_IMPACT_NODE_SEEDS.get(impact, ()))\n    if "targeted_test" in impact_set:\n        mapped = {node for path, node in DEVELOP_TEST_MAP.items() if path in set(paths)}\n        if not mapped:\n            raise ValueError("TARGETED_TEST_WITHOUT_VERIFY_NODE")\n        seeds.update(mapped)\n        seeds.add("validate_cross_document_consistency")\n    if not seeds:\n        seeds.add("impact_only")\n    return tuple(name for name in VERIFY_NODE_ORDER if name in seeds)\n\ndef verify_node_names(paths, impacts):\n    return dependency_closure(verify_seed_node_names(paths, impacts), VERIFY_DEPENDENCIES, VERIFY_NODE_ORDER)\n\n\ndef git(root: Path, *args: str) -> str:'''
          text = text.replace(marker, addition, 1)

          new_develop = '''def develop_node_names(paths, impacts):\n    names = set()\n    path_set = set(paths)\n    if any(path.startswith("scripts/") for path in path_set):\n        names.add("compile_scripts")\n    if path_set.intersection(ENGINE_DEVELOP_FILES):\n        names.add("engine_regression")\n    if path_set.intersection(SEQUENCE_DEVELOP_FILES) or any(path.startswith("docs/sequence/") for path in path_set):\n        names.add("sequence_regression")\n    if path_set.intersection(COMPILER_DEVELOP_FILES):\n        names.add("compiler_selftest")\n    if path_set.intersection(CROSSDOC_DEVELOP_FILES):\n        names.add("cross_document_regression")\n    for path, node_name in DEVELOP_TEST_MAP.items():\n        if path in path_set:\n            names.add(node_name)\n    impact_set = set(impacts)\n    if impact_set.intersection({"governance", "documentation", "source"}):\n        names.add("sync_project_truth")\n    if "documentation" in impact_set:\n        names.add("validate_cross_document_consistency")\n    if "benchmark" in impact_set and not names:\n        names.add("impact_only")\n    if not names:\n        names.add("impact_only")\n    seeds = tuple(name for name in DEVELOP_NODE_ORDER if name in names)\n    return dependency_closure(seeds, DEVELOP_DEPENDENCIES, DEVELOP_NODE_ORDER)\n\n'''
          text, n = re.subn(r'def develop_node_names\(.*?\n(?=def planned_node_names\()', new_develop, text, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('DEVELOP_FUNCTION_REPLACE')

          new_planned = '''def planned_node_names(requested, effective, paths, impacts):\n    if effective == "finalize":\n        return FINALIZE_NODE_NAMES\n    if effective == "verify":\n        return verify_node_names(paths, impacts)\n    return develop_node_names(paths, impacts)\n\n'''
          text, n = re.subn(r'def planned_node_names\(.*?\n(?=def governed_status\()', new_planned, text, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('PLANNED_FUNCTION_REPLACE')
          p.write_text(text, encoding='utf-8', newline='\n')

          t = Path('scripts/selftest_governance_engine.py')
          tests = t.read_text(encoding='utf-8')
          tests = tests.replace('    collect_changed_paths,\n    develop_node_names,', '    collect_changed_paths,\n    dependency_closure,\n    develop_node_names,', 1)
          smart = '''def smart_validation_dag_contract() -> None:\n    seq_paths = ("docs/sequence/sessions/SW2-15-GOVERNANCE.json",)\n    seq_nodes = planned_node_names("develop", "develop", seq_paths, classify_changed_paths(seq_paths))\n    require(seq_nodes == ("compile_scripts", "sequence_regression"), f"develop closure drifted: {seq_nodes}")\n    print("SMART_DEVELOP_IMPACT_SELECTION=PASS")\n\n    doc_paths = ("references/governance-and-project-truth.md",)\n    doc_nodes = planned_node_names("verify", "verify", doc_paths, classify_changed_paths(doc_paths))\n    require(set(doc_nodes) == {"validate_project_docs", "validate_human_comprehension", "validate_handoff", "validate_cross_document_consistency"}, f"doc verify closure drifted: {doc_nodes}")\n    require(len(doc_nodes) < len(VERIFY_NODE_NAMES), "known documentation verify did not reduce work")\n    print("SMART_VERIFY_DEPENDENCY_CLOSURE=PASS")\n\n    broad_paths = ("scripts/new_future_validator.py",)\n    broad_nodes = planned_node_names("develop", "verify", broad_paths, classify_changed_paths(broad_paths))\n    require(broad_nodes == VERIFY_NODE_NAMES, f"broad verify narrowed unsafely: {broad_nodes}")\n\n    cases = (\n        (("child",), {"child": ("missing",)}, ("child",), "UNKNOWN_PLANNER_DEPENDENCY"),\n        (("a",), {"a": ("b",), "b": ("a",)}, ("a", "b"), "PLANNER_DAG_CYCLE"),\n        (("ghost",), {"known": ()}, ("known",), "UNKNOWN_PLANNER_NODE"),\n    )\n    for seeds, deps, order, marker in cases:\n        try:\n            dependency_closure(seeds, deps, order)\n        except ValueError as exc:\n            require(marker in str(exc), f"wrong planner failure: {exc}")\n        else:\n            raise AssertionError(marker + " did not fail closed")\n    print("SMART_PLANNER_FAIL_CLOSED=PASS")\n\n    final_nodes = planned_node_names("finalize", "finalize", ("scripts/governance_engine.py",), ("engine",))\n    require(final_nodes == FINALIZE_NODE_NAMES, f"finalize DAG narrowed: {final_nodes}")\n    print("SMART_FINALIZE_EXHAUSTIVE=PASS")\n\n\n'''
          if tests.count('def changed_path_collection_contract() -> None:\n') != 1:
              raise RuntimeError('SELFTEST_INSERTION')
          tests = tests.replace('def changed_path_collection_contract() -> None:\n', smart + 'def changed_path_collection_contract() -> None:\n', 1)
          tests = tests.replace('    mode_planning_contract()\n    changed_path_collection_contract()', '    mode_planning_contract()\n    smart_validation_dag_contract()\n    changed_path_collection_contract()', 1)
          t.write_text(tests, encoding='utf-8', newline='\n')
          PY
      - name: Focused regressions
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts
          python scripts/selftest_governance_engine.py
          python scripts/selftest_project_truth_compiler.py
      - name: Regenerate on helper-free working tree
        shell: bash
        run: |
          rm -f .github/workflows/tmp-sw2-15-smart-dag-impl-v3.yml
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path('.').resolve(); sp=root/'docs/sequence/sessions/SW2-15-GOVERNANCE.json'; s=json.loads(sp.read_text())
          a=s['actual']; cmd=[sys.executable,'scripts/generate_sequence_actual.py','--root','.','--output-json',a['graph'],'--output-mermaid',a['diagram']]
          for e in a['entries']: cmd += ['--entry',e]
          subprocess.run(cmd,check=True); g=json.loads((root/a['graph']).read_text()); d=g['source_digest']; s['actual']['source_digest']=d; s['human_view']['source_digest']=d; sp.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          h=s['human_view']; subprocess.run([sys.executable,'scripts/sequence_human_view.py','--root','.','--actual-json',a['graph'],'--actual-mermaid',a['diagram'],'--output-json',h['graph'],'--output-mermaid',h['diagram'],'--output-markdown',h['document'],'--session-id',s['session_id']],check=True)
          subprocess.run([sys.executable,'scripts/validate_sequence_contract.py','--root','.','--session',str(sp.relative_to(root))],check=True)
          PY
          python scripts/sync_project_truth.py --root .
      - name: Prove helper-free candidate
        shell: bash
        run: |
          python scripts/selftest_governance_engine.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/governance_engine.py --root . --base 71c0269a5f2cf7fc98cf05e79c5c9494a32dfae4 --mode verify --expected-head "$HEAD_SHA" --report /tmp/sw2-15-verify.json
          test ! -e .github/workflows/tmp-sw2-15-smart-dag-impl-v3.yml
      - name: Commit non-workflow implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/governance_engine.py scripts/selftest_governance_engine.py .workflow docs artifacts/sequence
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'SW2-15: implement Smart Validation DAG'
          git push origin HEAD:work/sw2-15-smart-validation-dag
