name: SW2-12 Closure Repair

on:
  push:
    branches:
      - work/sw2-12-repository-hygiene

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-12-repository-hygiene
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove repair helper from clean candidate
        shell: bash
        run: rm .github/workflows/sw2-12-closure-repair.yml

      - name: Promote accepted SW2-12 authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = '9fdf530d46eeee297e8c784044369ac2342f5c60'
          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          for item in acceptance['requirements']:
              if item['id'] == 'SW2-12-R4':
                  item['status'] = 'PASS'
                  item['evidence'] = (
                      'PASS on exact candidate 9fdf530d46eeee297e8c784044369ac2342f5c60: '
                      'Self Governance 37203995211, Governance Selftest 37203995235 on Ubuntu and Windows, '
                      'SW2 Sequence Evidence 37203995267, Governance Engine Performance 37203995219, and '
                      'Consumer Engine Performance 37203995252 all succeeded.'
                  )
          for gate in list(acceptance['truth_gates']):
              acceptance['truth_gates'][gate] = (
                  'NOT_APPLICABLE' if gate in {'BEHAVIORAL_SYNC', 'RUNTIME_E2E', 'TEST_RUNTIME_TRACEABILITY'} else 'PASS'
              )
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          claim = (
              'SW2-12 Repository Hygiene & Dead Artifact Cleanup is accepted on exact implementation candidate '
              '9fdf530d46eeee297e8c784044369ac2342f5c60: Self Governance 37203995211, Governance Selftest '
              '37203995235 on Ubuntu and Windows, SW2 Sequence Evidence 37203995267, Governance Engine Performance '
              '37203995219, and Consumer Engine Performance 37203995252 all succeeded. The obsolete one-shot '
              'SW2-09 publication workflow was removed, tracked tmp-* workflows now fail closed, and historical '
              'audit evidence/remote branches were preserved unless deletion safety was proven.'
          )
          proven = list(state.get('proven', []))
          if claim not in proven:
              proven.append(claim)
          state.update({
              'status': 'SW2_12_REPOSITORY_HYGIENE_ACCEPTED',
              'working_branch': 'main',
              'blockers': [],
              'proven': proven,
              'not_proven': [
                  'Deletion safety for historical remote branches remains intentionally NOT_PROVEN; they are preserved for auditability.',
                  'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.'
              ],
              'next_authorized_actions': [
                  'Treat tracked .github/workflows/tmp-* files as repository-health failures and remove one-shot helpers before acceptance.',
                  'Preserve historical acceptance/release evidence and remote branches unless deletion safety is explicitly proven.',
                  'Open SW2-13 Skill Core / Reference Split as a separate governed phase before changing skill/reference packaging.'
              ],
              'blocked_actions': [
                  'Do not move, retarget, delete-and-recreate, or silently replace the stable v2.0.0 tag.',
                  'Do not weaken accepted V2 governance guarantees or the mandatory root AGENTS.md contract.',
                  'Do not delete historical evidence or remote branches merely for cosmetic cleanup when deletion safety is NOT_PROVEN.',
                  'Do not allow tracked .github/workflows/tmp-* files in an accepted repository state.',
                  'Do not begin SW2-13 implementation without opening its governed acceptance boundary.'
              ]
          })
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          session_path = Path('docs/sequence/sessions/SW2-12-GOVERNANCE.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          session['status'] = 'COMPLETE'
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          report_path = Path('artifacts/sw2-12-repository-hygiene.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['implementation_candidate_sha'] = candidate
          report['permanent_matrix'] = {
              'result': 'PASS',
              'self_governance_run': 37203995211,
              'governance_selftest_run': 37203995235,
              'governance_selftest_platforms': ['ubuntu-latest', 'windows-latest'],
              'sequence_run': 37203995267,
              'engine_performance_run': 37203995219,
              'consumer_performance_run': 37203995252
          }
          for branch in report.get('remote_branches', []):
              if branch.get('name') == 'work/sw2-12-repository-hygiene':
                  branch['sha'] = candidate
                  branch['rationale'] = 'Active governed branch as observed at the exact accepted implementation candidate before closure promotion.'
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Regenerate governed closure artifacts
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/SW2-12-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-12-GOVERNANCE.actual.mmd \
            --entry scripts/validate_repository_health.py::main \
            --entry scripts/validate_project_docs.py::main \
            --entry scripts/validate_cross_document_consistency.py::main \
            --entry scripts/sync_project_truth.py::main \
            --entry scripts/validate_sequence_sessions.py::main \
            --entry scripts/governance_engine.py::main
          python - <<'PY'
          import json
          from pathlib import Path
          session_path = Path('docs/sequence/sessions/SW2-12-GOVERNANCE.json')
          actual_path = Path('docs/sequence/generated/SW2-12-GOVERNANCE.actual.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = json.loads(actual_path.read_text(encoding='utf-8'))
          digest = actual['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/sequence_human_view.py --root . \
            --actual-json docs/sequence/generated/SW2-12-GOVERNANCE.actual.json \
            --actual-mermaid docs/sequence/generated/SW2-12-GOVERNANCE.actual.mmd \
            --output-json docs/sequence/generated/SW2-12-GOVERNANCE.human.json \
            --output-mermaid docs/sequence/generated/SW2-12-GOVERNANCE.human.mmd \
            --output-markdown docs/sequence/views/SW2-12-GOVERNANCE.md \
            --session-id SW2-12-GOVERNANCE
          python scripts/validate_sequence_contract.py --root . \
            --session docs/sequence/sessions/SW2-12-GOVERNANCE.json \
            --report artifacts/sequence/SW2-12-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-12-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_repository_health.py --root . --require-owner-approved-license

      - name: Commit exact clean closure candidate
        id: candidate
        shell: bash
        run: |
          git config user.name maxqstudio
          git config user.email jackson.cendana@gmail.com
          git add -A
          git status --short
          git commit -m "SW2-12: promote accepted closure"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Exact finalize with schema-v2 provenance
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          head="${{ steps.candidate.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$head"
          python -m compileall -q scripts
          python scripts/selftest_repository_health.py
          python scripts/validate_repository_health.py --root . --require-owner-approved-license
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base 2fc16cce4c7753ad103bac401d1825a9bd8bd3a1 --require-base
          python scripts/governance_engine.py --root . --base 2fc16cce4c7753ad103bac401d1825a9bd8bd3a1 --mode finalize --expected-head "$head" --report "$RUNNER_TEMP/final-governance.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'final-governance.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS', report
          assert report['final_acceptance_authority'] is True, report
          assert report['expected_head'] == report['snapshot']['git_head'], report
          print('SW2_12_EXACT_CLOSURE_FINALIZE=PASS')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push proven clean closure candidate
        shell: bash
        run: git push origin HEAD:work/sw2-12-repository-hygiene
