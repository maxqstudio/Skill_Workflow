name: SW2 Cross Document Repair

on:
  push:
    branches:
      - work/sw2-00-baseline-self-governance
    paths:
      - .github/workflows/sw2-cross-doc-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/work/sw2-00-baseline-self-governance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Patch minimum cross-document defects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/generate_project_docs.py')
          text = generator.read_text(encoding='utf-8')
          anchor = '''def auth_lookup(specs: dict[str, dict], concern: str) -> dict:\n'''
          helper = '''def claim_backlink_comment(specs: dict[str, dict], doc_name: str) -> str:\n    claim_ids: list[str] = []\n    for item in specs["claims.json"].get("claims", []):\n        declared = {Path(clean(value)).name for value in item.get("documents", []) if clean(value)}\n        claim_id = clean(item.get("id"))\n        if claim_id and doc_name in declared:\n            claim_ids.append(claim_id)\n    if not claim_ids:\n        return ""\n    return "\\n<!-- CLAIM_BACKLINKS: " + " ".join(sorted(set(claim_ids))) + " -->\\n"\n\n\n'''
          if 'def claim_backlink_comment(' not in text:
              if anchor not in text:
                  raise SystemExit('generator helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          old = '        result[name] = normalize_markdown(head + renderer())\n'
          new = '        result[name] = normalize_markdown(\n            head + renderer() + claim_backlink_comment(specs, name)\n        )\n'
          if old not in text:
              raise SystemExit('generator result anchor missing')
          text = text.replace(old, new, 1)
          generator.write_text(text, encoding='utf-8', newline='\n')

          validator = Path('scripts/validate_cross_document_consistency.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '''def all_docs(root: Path) -> list[Path]:\n'''
          helper = '''def is_template_document(root: Path, doc: Path) -> bool:\n    try:\n        return "templates" in doc.relative_to(root).parts\n    except ValueError:\n        return False\n\n\n'''
          if 'def is_template_document(' not in text:
              if anchor not in text:
                  raise SystemExit('validator helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          old = '''        for match in PATH_SYMBOL_RE.finditer(unfenced):\n            path_ref = match.group("path").replace("\\\\", "/")\n            symbol = match.group("symbol")\n            refs_checked += 1\n            source = root / path_ref\n            if not source.is_file():\n                failures.append("BROKEN_PATH_SYMBOL_FILE:" + relative + ":" + path_ref + "::" + symbol)\n            elif not source_has_symbol(source, symbol):\n                failures.append("UNRESOLVED_PATH_SYMBOL:" + relative + ":" + path_ref + "::" + symbol)\n'''
          new = '''        if not is_template_document(root, doc):\n            for match in PATH_SYMBOL_RE.finditer(unfenced):\n                path_ref = match.group("path").replace("\\\\", "/")\n                symbol = match.group("symbol")\n                refs_checked += 1\n                source = root / path_ref\n                if not source.is_file():\n                    failures.append("BROKEN_PATH_SYMBOL_FILE:" + relative + ":" + path_ref + "::" + symbol)\n                elif not source_has_symbol(source, symbol):\n                    failures.append("UNRESOLVED_PATH_SYMBOL:" + relative + ":" + path_ref + "::" + symbol)\n'''
          if old not in text:
              raise SystemExit('validator path-symbol block missing')
          text = text.replace(old, new, 1)
          validator.write_text(text, encoding='utf-8', newline='\n')

          regression = Path('scripts/selftest_cross_document_regressions.py')
          regression.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nfrom generate_project_docs import claim_backlink_comment\nfrom validate_cross_document_consistency import is_template_document\n\n\ndef main() -> int:\n    specs = {\n        "claims.json": {\n            "claims": [\n                {\n                    "id": "TRUTH-TEST-BACKLINK",\n                    "documents": ["SYSTEM_OVERVIEW.md", "docs/ROADMAP.md"],\n                }\n            ]\n        }\n    }\n    overview = claim_backlink_comment(specs, "SYSTEM_OVERVIEW.md")\n    roadmap = claim_backlink_comment(specs, "ROADMAP.md")\n    other = claim_backlink_comment(specs, "CURRENT_STATE.md")\n    if "TRUTH-TEST-BACKLINK" not in overview or "TRUTH-TEST-BACKLINK" not in roadmap:\n        raise RuntimeError("declared claim backlink was not projected")\n    if other:\n        raise RuntimeError("claim backlink leaked into undeclared document")\n\n    root = Path("/repo")\n    if not is_template_document(root, root / "templates" / "PROJECT_TRUTH_SYNC.md"):\n        raise RuntimeError("template document was not recognized")\n    if is_template_document(root, root / "docs" / "PROJECT_TRUTH_SYNC.md"):\n        raise RuntimeError("canonical document was misclassified as template")\n\n    print("CLAIM_BACKLINK_PROJECTION=PASS")\n    print("TEMPLATE_PATH_SYMBOL_SCOPE=PASS")\n    print("CROSS_DOCUMENT_REGRESSION=PASS")\n    return 0\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''', encoding='utf-8', newline='\n')

          for workflow_path in [
              Path('.github/workflows/governance-selftest.yml'),
              Path('.github/workflows/self-governance.yml'),
          ]:
              w = workflow_path.read_text(encoding='utf-8')
              if workflow_path.name == 'governance-selftest.yml':
                  anchor = '''      - name: Project Truth Compiler self-test\n        run: python scripts/selftest_project_truth_compiler.py\n'''
                  addition = '''      - name: Cross-document regression\n        run: python scripts/selftest_cross_document_regressions.py\n\n'''
                  if 'Cross-document regression' not in w:
                      if anchor not in w:
                          raise SystemExit('governance selftest anchor missing')
                      w = w.replace(anchor, addition + anchor, 1)
              else:
                  anchor = '''      - name: Generate synchronized self-governance state\n        run: python scripts/sync_project_truth.py --root .\n'''
                  addition = '''      - name: Remove compile artifacts\n        shell: bash\n        run: find scripts -type d -name __pycache__ -prune -exec rm -rf {} +\n\n      - name: Cross-document regression\n        run: python scripts/selftest_cross_document_regressions.py\n\n'''
                  if 'Cross-document regression' not in w:
                      if anchor not in w:
                          raise SystemExit('self-governance anchor missing')
                      w = w.replace(anchor, addition + anchor, 1)
              workflow_path.write_text(w, encoding='utf-8', newline='\n')
          PY

      - name: Run targeted regressions
        run: |
          python -m compileall -q scripts
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/selftest_cross_document_regressions.py

      - name: Commit repair
        shell: bash
        run: |
          git add scripts/generate_project_docs.py scripts/validate_cross_document_consistency.py scripts/selftest_cross_document_regressions.py .github/workflows/governance-selftest.yml .github/workflows/self-governance.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sw2): close cross-document acceptance gaps"
          git push origin HEAD:work/sw2-00-baseline-self-governance
