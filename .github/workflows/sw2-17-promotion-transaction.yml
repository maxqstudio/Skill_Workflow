name: SW2-17 Promotion Transaction

on:
  push:
    branches:
      - work/sw2-17-generator-modularization
    paths:
      - .github/workflows/sw2-17-promotion-transaction.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-17-generator-modularization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote exact-candidate evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          CANDIDATE = 'd1e6f62b490a83874a0cd1f686c09289818ad70d'
          SELF_GOV = '37294490948'
          SELFTEST = '37294490997'
          SEQUENCE = '37294491094'
          ENGINE = '37294491102'
          CONSUMER = '37294491100'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def write(path, data):
              Path(path).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = load('.workflow/acceptance.json')
          evidence = {
              'SW2-17-R1': f'PASS on exact candidate {CANDIDATE}: Governance Selftest {SELFTEST} passed Ubuntu and Windows; Project Truth Compiler self-test reported PROJECTION_MODULE_CONTRACT=PASS modules=4 renderers=22, proving narrow extracted projection modules and complete renderer mapping without a plugin/config framework.',
              'SW2-17-R2': f'PASS on exact candidate {CANDIDATE}: Governance Selftest {SELFTEST} passed Ubuntu and Windows with INCREMENTAL_FULL_PARITY=PASS; synchronized Project Truth preserved canonical generated-document parity after modularization.',
              'SW2-17-R3': f'PASS on exact candidate {CANDIDATE}: Governance Selftest {SELFTEST} passed Ubuntu and Windows; selftest_project_truth_compiler.py directly exercises the projection-module contract across all 4 projection modules and all 22 renderer mappings with fail-closed mapping checks.',
              'SW2-17-R4': f'PASS on exact candidate {CANDIDATE}: Governance Selftest {SELFTEST} passed Ubuntu and Windows, Sequence {SEQUENCE}, Engine Performance {ENGINE}, and Consumer Performance {CONSUMER} succeeded. Self Governance {SELF_GOV} executed exhaustive finalize prerequisites and stopped only at the intentionally unpromoted Project Truth gate on a clean worktree.',
          }
          seen = set()
          for req in acceptance.get('requirements', []):
              rid = req.get('id')
              if rid in evidence:
                  req['status'] = 'PASS'
                  req['evidence'] = evidence[rid]
                  seen.add(rid)
          if seen != set(evidence):
              raise RuntimeError(f'SW2_17_REQUIREMENT_SET_MISMATCH:{sorted(set(evidence)-seen)}')
          for gate, status in list(acceptance.get('truth_gates', {}).items()):
              if status != 'NOT_APPLICABLE':
                  acceptance['truth_gates'][gate] = 'PASS'
          acceptance['sequence_sync_status'] = 'PASS'
          write('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          state['not_proven'] = [x for x in state.get('not_proven', []) if not x.startswith('SW2-17 ')]
          proven = list(state.get('proven', []))
          statements = [
              f'SW2-17 Generator Modularization feature evidence is proven on exact candidate {CANDIDATE}: Governance Selftest {SELFTEST} passed Ubuntu and Windows with PROJECTION_MODULE_CONTRACT=PASS modules=4 renderers=22 and INCREMENTAL_FULL_PARITY=PASS; Sequence {SEQUENCE}, Engine Performance {ENGINE}, and Consumer Performance {CONSUMER} succeeded.',
              f'SW2-17 pre-promotion Self Governance {SELF_GOV} traversed exhaustive finalize prerequisites on exact candidate {CANDIDATE} with clean governed state and stopped only at the intentionally unpromoted Project Truth gate; post-promotion 6/6 remains mandatory before merge.',
          ]
          for statement in statements:
              if statement not in proven:
                  proven.append(statement)
          state['proven'] = proven
          state['status'] = 'IN_PROGRESS'
          state['next_authorized_actions'] = [
              'Require all six permanent checks to pass on the exact clean SW2-17 post-promotion candidate.',
              'If exact-head acceptance is green, update PR #27 evidence, mark ready, and squash-merge with expected-head protection.',
              'After merge, verify main tree equivalence and post-merge 6/6 before opening SW2-18.',
          ]
          write('.workflow/state.json', state)
          PY

      - name: Regenerate promoted Project Truth
        shell: bash
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/sync_project_truth.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_governance_engine.py
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .

      - name: Commit promoted authority locally
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs artifacts/sequence
          git commit -m 'SW2-17: promote generator modularization acceptance'

      - name: Validate clean promoted commit
        shell: bash
        run: |
          python scripts/validate_cross_document_consistency.py --root . --base 7e2c5e4669655764e24ec821cefc0c96e2886133 --require-base
          python scripts/validate_project_truth.py --root . --project-docs-already-validated
          python scripts/validate_repository_health.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push promoted authority
        shell: bash
        run: git push origin HEAD:work/sw2-17-generator-modularization
