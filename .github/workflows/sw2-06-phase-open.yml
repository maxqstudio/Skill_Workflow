name: SW2-06 Phase Open

on:
  push:
    branches:
      - work/sw2-05-schema-toolchain-versioning

permissions:
  contents: write

jobs:
  transition:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ACCEPTED_MAIN: "733cf7dcb6def0fc1adc36cee7cc5243b8eaf060"
      SW2_05_CLOSURE: "aa93514462e505483673a8d2a5e1248096be0407"

    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-05-schema-toolchain-versioning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact closure lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$SW2_05_CLOSURE"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD

      - name: Transition SW2-05 to SW2-06 fail closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          closure = "aa93514462e505483673a8d2a5e1248096be0407"

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, value):
              Path(path).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
                  newline="\n",
              )

          roadmap = load(".workflow/roadmap.json")
          assert roadmap["current_phase"] == "SW2-05"
          for phase in roadmap["phases"]:
              if phase["id"] == "SW2-05":
                  assert phase["status"] == "CURRENT"
                  phase["status"] = "COMPLETE"
              elif phase["id"] == "SW2-06":
                  assert phase["status"] == "PLANNED"
                  phase["status"] = "CURRENT"
          roadmap["current_phase"] = "SW2-06"
          save(".workflow/roadmap.json", roadmap)

          state = load(".workflow/state.json")
          closure_proof = (
              f"SW2-05 Schema & Toolchain Versioning is accepted on exact clean closure candidate {closure}: "
              "Self Governance 37101621016, Governance Selftest 37101621006 on Ubuntu and Windows, "
              "SW2 Sequence Evidence 37101621062, SW2 Engine Performance 37101621007, and "
              "SW2 Consumer Engine Performance 37101621079 all succeeded after tracked Python bytecode was removed and ignore policy was enforced."
          )
          if closure_proof not in state["proven"]:
              state["proven"].append(closure_proof)
          state["phase"] = "SW2-06"
          state["status"] = "IN_PROGRESS"
          state["not_proven"] = [
              "SW2-06 language-independent analyzer contract is not proven.",
              "SW2-06 Python and JS/TS analyzer regression coverage under the new contract is not proven.",
              "SW2-06 generic fallback behavior is not proven explicit and fail-safe.",
              "SW2-06 unsupported dynamic behavior remains NOT_PROVEN unless stronger evidence exists.",
              "Repository merge enforcement is still absent on main; actual alignment remains a SW2-07 exit criterion."
          ]
          state["next_authorized_actions"] = [
              "Audit current parser/analyzer coupling without redesigning accepted governance semantics.",
              "Define the smallest language-independent analyzer contract that preserves existing Python and JS/TS evidence.",
              "Add regression and negative-path evidence for Python, JS/TS, and generic fail-safe fallback behavior.",
              "Keep dynamic dispatch, reflection, framework magic, dependency injection, and unresolved calls NOT_PROVEN unless stronger evidence is added."
          ]
          state["blocked_actions"] = [
              "Do not claim the SW2-06 analyzer abstraction is proven before dedicated implementation evidence passes.",
              "Do not weaken accepted Python or JS/TS regression behavior while introducing analyzer interfaces.",
              "Do not turn generic fallback or unresolved dynamic behavior into false structural certainty.",
              "Do not address repository merge/ruleset enforcement in SW2-06; that remains SW2-07 scope."
          ]
          save(".workflow/state.json", state)

          acceptance = load(".workflow/acceptance.json")
          acceptance["evidence_boundary"] = (
              "SW2-06 acceptance covers Cross-Language Analyzer Architecture only: a language-independent analyzer contract, preserved Python and JS/TS regression coverage, explicit fail-safe generic fallback behavior, and conservative handling of unsupported dynamic behavior. Accepted SW2-01 through SW2-05 governance, performance, sequence, documentation, schema, migration, and toolchain guarantees remain inherited authority and must not be weakened."
          )
          acceptance["requirements"] = [
              {"id": "SW2-06-R1", "requirement": "Analyzer contract is language-independent.", "evidence": "Phase-open baseline only; dedicated analyzer-interface evidence is not yet accepted.", "status": "NOT_PROVEN"},
              {"id": "SW2-06-R2", "requirement": "Python and JS/TS remain fully regression-covered.", "evidence": "Existing analyzers are preserved at phase opening, but regression coverage under the new contract is not yet accepted.", "status": "NOT_PROVEN"},
              {"id": "SW2-06-R3", "requirement": "Generic fallback behavior is explicit and fail-safe.", "evidence": "No accepted generic fallback contract exists at phase opening.", "status": "NOT_PROVEN"},
              {"id": "SW2-06-R4", "requirement": "Unsupported dynamic behavior remains NOT_PROVEN unless stronger evidence exists.", "evidence": "Phase-open evidence records current static-analysis limitations; dedicated negative-path proof is not yet accepted.", "status": "NOT_PROVEN"}
          ]
          acceptance["sequence_session"] = "SW2-06-GOVERNANCE"
          acceptance["sequence_mode"] = "DURING"
          acceptance["sequence_sync_status"] = "NOT_PROVEN"
          if "python scripts/selftest_sequence_call_resolution.py" not in acceptance["test_commands"]:
              acceptance["test_commands"].insert(3, "python scripts/selftest_sequence_call_resolution.py")
          save(".workflow/acceptance.json", acceptance)

          claims = load(".workflow/claims.json")
          ids = {item["id"] for item in claims["claims"]}
          if "TRUTH-SW2-ANALYZER-CONTRACT" not in ids:
              claims["claims"].append({
                  "id": "TRUTH-SW2-ANALYZER-CONTRACT",
                  "claim": "Structural analyzers expose a language-independent contract while preserving accepted Python and JS/TS structural evidence and fail-safe fallback behavior.",
                  "documents": ["ROADMAP.md", "SEQUENCE_CONTRACTS.md", "PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["scripts/extract_project_facts.py", "scripts/generate_sequence_actual.py", "scripts/project_snapshot.py"],
                  "tests": ["scripts/selftest_sequence_call_resolution.py"],
                  "runtime_evidence": [],
                  "status": "NOT_PROVEN"
              })
          if "TRUTH-SW2-DYNAMIC-EVIDENCE" not in ids:
              claims["claims"].append({
                  "id": "TRUTH-SW2-DYNAMIC-EVIDENCE",
                  "claim": "Unsupported dynamic dispatch, reflection, framework magic, dependency injection, callbacks, and unresolved cross-language behavior remain NOT_PROVEN unless stronger runtime or semantic evidence exists.",
                  "documents": ["ROADMAP.md", "SEQUENCE_CONTRACTS.md", "PROJECT_TRUTH_SYNC.md"],
                  "source_owners": ["scripts/generate_sequence_actual.py", "scripts/validate_sequence_contract.py"],
                  "tests": ["scripts/selftest_sequence_call_resolution.py"],
                  "runtime_evidence": [],
                  "status": "NOT_PROVEN"
              })
          save(".workflow/claims.json", claims)

          old_session_path = Path("docs/sequence/sessions/SW2-05-GOVERNANCE.json")
          old_session = load(old_session_path)
          old_session["scope"] = "HISTORICAL"
          old_session["status"] = "COMPLETE"
          save(old_session_path, old_session)

          new_session = {
              "schema_version": 1,
              "session_id": "SW2-06-GOVERNANCE",
              "phase": "SW2-06",
              "mode": "DURING",
              "scope": "CURRENT",
              "critical": True,
              "status": "IN_PROGRESS",
              "implementation_base_sha": closure,
              "evidence_boundary": "SW2-06 phase-opening static evidence binds the current Python AST, JS/TS HTTP scan, shared source inventory, and sequence generation surfaces before analyzer-interface work. A language-independent analyzer contract, generic fallback semantics, and stronger evidence for dynamic behavior remain NOT_PROVEN.",
              "plan": {"required": False, "contract": "", "frozen": False, "frozen_commit": "", "sha256": "", "diagram": ""},
              "actual": {
                  "graph": "docs/sequence/generated/SW2-06-GOVERNANCE.actual.json",
                  "diagram": "docs/sequence/generated/SW2-06-GOVERNANCE.actual.mmd",
                  "source_digest": "",
                  "entries": [
                      "scripts/generate_sequence_actual.py::collect_python",
                      "scripts/generate_sequence_actual.py::collect_js_http",
                      "scripts/generate_sequence_actual.py::main",
                      "scripts/sequence_contract.py::source_files",
                      "scripts/project_snapshot.py::discover_source_paths"
                  ]
              },
              "human_view": {
                  "graph": "docs/sequence/generated/SW2-06-GOVERNANCE.human.json",
                  "diagram": "docs/sequence/generated/SW2-06-GOVERNANCE.human.mmd",
                  "document": "docs/sequence/views/SW2-06-GOVERNANCE.md",
                  "granularity": "module",
                  "policy_id": "module-collapse-v1",
                  "source_digest": ""
              },
              "test_traceability_required": True,
              "tests": ["scripts/selftest_sequence_call_resolution.py", "scripts/selftest_governance_engine.py"],
              "runtime_trace": {"required": False, "graph": ""},
              "acceptance_report": "artifacts/sequence/SW2-06-GOVERNANCE.acceptance.json"
          }
          save("docs/sequence/sessions/SW2-06-GOVERNANCE.json", new_session)
          print("SW2_06_PHASE_TRANSITION_PATCH=PASS")
          PY

      - name: Generate SW2-06 sequence baseline and Project Truth
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py --root . --output-json docs/sequence/generated/SW2-06-GOVERNANCE.actual.json --output-mermaid docs/sequence/generated/SW2-06-GOVERNANCE.actual.mmd --entry scripts/generate_sequence_actual.py::collect_python --entry scripts/generate_sequence_actual.py::collect_js_http --entry scripts/generate_sequence_actual.py::main --entry scripts/sequence_contract.py::source_files --entry scripts/project_snapshot.py::discover_source_paths
          python scripts/sequence_human_view.py --root . --actual-json docs/sequence/generated/SW2-06-GOVERNANCE.actual.json --actual-mermaid docs/sequence/generated/SW2-06-GOVERNANCE.actual.mmd --output-json docs/sequence/generated/SW2-06-GOVERNANCE.human.json --output-mermaid docs/sequence/generated/SW2-06-GOVERNANCE.human.mmd --output-markdown docs/sequence/views/SW2-06-GOVERNANCE.md --session-id SW2-06-GOVERNANCE
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.load(open('docs/sequence/generated/SW2-06-GOVERNANCE.actual.json', encoding='utf-8'))
          human = json.load(open('docs/sequence/generated/SW2-06-GOVERNANCE.human.json', encoding='utf-8'))
          session_path = Path('docs/sequence/sessions/SW2-06-GOVERNANCE.json')
          session = json.loads(session_path.read_text(encoding='utf-8'))
          assert human['source_digest'] == actual['source_digest']
          session['actual']['source_digest'] = actual['source_digest']
          session['human_view']['source_digest'] = actual['source_digest']
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY
          python scripts/sync_project_truth.py --root .
          python scripts/validate_schema_toolchain.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-06-GOVERNANCE.json --report artifacts/sequence/SW2-06-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . --session docs/sequence/sessions/SW2-06-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .

      - name: Assert SW2-06 remains fail closed
        run: |
          python - <<'PY'
          import json
          roadmap = json.load(open('.workflow/roadmap.json', encoding='utf-8'))
          assert roadmap['current_phase'] == 'SW2-06'
          statuses = {item['id']: item['status'] for item in roadmap['phases']}
          assert statuses['SW2-05'] == 'COMPLETE'
          assert statuses['SW2-06'] == 'CURRENT'
          state = json.load(open('.workflow/state.json', encoding='utf-8'))
          assert state['phase'] == 'SW2-06' and state['status'] == 'IN_PROGRESS'
          acceptance = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          assert {item['id']: item['status'] for item in acceptance['requirements']} == {f'SW2-06-R{i}': 'NOT_PROVEN' for i in range(1, 5)}
          claims = json.load(open('.workflow/claims.json', encoding='utf-8'))
          cmap = {item['id']: item['status'] for item in claims['claims']}
          assert cmap['TRUTH-SW2-ANALYZER-CONTRACT'] == 'NOT_PROVEN'
          assert cmap['TRUTH-SW2-DYNAMIC-EVIDENCE'] == 'NOT_PROVEN'
          print('SW2_06_FAIL_CLOSED=PASS')
          PY

      - name: Commit phase-open candidate locally
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .workflow docs artifacts/sequence/SW2-06-GOVERNANCE.acceptance.json
          git diff --cached --quiet && { echo "NO_PHASE_TRANSITION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-06): close SW2-05 and open analyzer architecture fail closed"

      - name: Validate clean committed transition
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/validate_schema_toolchain.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/validate_project_truth.py --root .
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SW2_06_PHASE_OPEN_VALIDATION=PASS"

      - name: Push validated phase-open candidate
        shell: bash
        run: git push origin HEAD:work/sw2-05-schema-toolchain-versioning
