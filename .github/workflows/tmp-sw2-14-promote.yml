name: TEMP SW2-14 Promote Acceptance

on:
  push:
    branches:
      - work/sw2-14-incremental-project-truth
    paths:
      - .github/workflows/tmp-sw2-14-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-14-incremental-project-truth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote SW2-14 evidence authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          acceptance_path = Path('.workflow/acceptance.json')
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))
          evidence = {
              'SW2-14-R1': (
                  'PASS: exact repaired feature candidate 7e1bc15b9868224b42fd095e70ba5eadf7c12ef7 '
                  'passed Governance Selftest run 37219195065 on Ubuntu and Windows. The permanent '
                  'Project Truth Compiler self-test proved INCREMENTAL_IMPACT_GRAPH=PASS, and the '
                  'Governance Engine regression proved deterministic changed-path classification '
                  'with normative references mapped to documentation rather than unknown impact.'
              ),
              'SW2-14-R2': (
                  'PASS: Governance Selftest run 37219195065 passed Project Truth Compiler self-test '
                  'and Verify mode is read-only on both Ubuntu and Windows for exact candidate '
                  '7e1bc15b9868224b42fd095e70ba5eadf7c12ef7. Regression evidence includes '
                  'INCREMENTAL_SELECTIVE_WRITE=PASS and INCREMENTAL_FACT_SELECTIVITY=PASS: '
                  'governance-only changes reuse facts, source changes refresh facts, and byte-identical '
                  'unaffected tracked projections are not rewritten.'
              ),
              'SW2-14-R3': (
                  'PASS: exact candidate 7e1bc15b9868224b42fd095e70ba5eadf7c12ef7 passed '
                  'INCREMENTAL_UNKNOWN_BROADENING=PASS and Governance Engine mode-planning regression '
                  'on Ubuntu and Windows in run 37219195065. Unknown/ambiguous impact broadens to the '
                  'complete projection set and unknown verify impact escalates fail-closed rather than '
                  'silently narrowing acceptance.'
              ),
              'SW2-14-R4': (
                  'PASS for feature promotion: exact candidate 7e1bc15b9868224b42fd095e70ba5eadf7c12ef7 '
                  'passed INCREMENTAL_FULL_PARITY=PASS in Governance Selftest run 37219195065 on Ubuntu '
                  'and Windows, SW2 Sequence Evidence run 37219195086, Governance Engine Performance '
                  'run 37219195153, and Consumer Engine Performance run 37219195072. Pre-promotion Self '
                  'Governance run 37219195078 executed the exhaustive finalize path with compiler, strict '
                  'workflow, Project Truth sync, cross-document consistency, sequence, handoff, and '
                  'clean-worktree nodes PASS; it stopped only at the intentionally unpromoted Project '
                  'Truth status gate. Full post-promotion 6/6 permanent acceptance remains required '
                  'before merge/closure.'
              ),
          }
          requirements = acceptance.get('requirements', [])
          observed = {item.get('id') for item in requirements}
          expected = set(evidence)
          if observed != expected:
              raise RuntimeError(f'REQUIREMENT_SET_MISMATCH:{sorted(observed)}')
          for item in requirements:
              item['status'] = 'PASS'
              item['evidence'] = evidence[item['id']]

          acceptance['sequence_sync_status'] = 'PASS'
          gates = acceptance.setdefault('truth_gates', {})
          for name in (
              'SOURCE_TESTS',
              'PROVENANCE_SYNC',
              'REFERENCE_SYNC',
              'STRUCTURAL_SYNC',
              'SEMANTIC_SYNC',
              'CROSS_DOCUMENT_CONSISTENCY',
              'HUMAN_COMPREHENSION',
              'SEQUENCE_SYNC',
              'ROADMAP_SYNC',
              'DOC_LAYOUT',
              'PROJECT_DOCS_NORMALIZED',
              'DOC_READABILITY',
              'PROJECT_DOCS_SYNC',
              'DOC_SOURCE_TRACEABILITY',
              'DOC_TEST_TRACEABILITY',
              'PROJECT_STATE_SYNC',
          ):
              gates[name] = 'PASS'
          gates['BEHAVIORAL_SYNC'] = 'NOT_APPLICABLE'
          gates['RUNTIME_E2E'] = 'NOT_APPLICABLE'
          gates['TEST_RUNTIME_TRACEABILITY'] = 'NOT_APPLICABLE'
          acceptance_path.write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          state_path = Path('.workflow/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          remove = {
              'SW2-14 deterministic Project Truth impact graph is not yet proven.',
              'SW2-14 selective regeneration and unchanged-projection preservation are not yet proven.',
              'SW2-14 unknown-impact fail-closed escalation is not yet proven.',
              'SW2-14 finalize parity with exhaustive accepted regeneration is not yet proven.',
          }
          state['not_proven'] = [item for item in state.get('not_proven', []) if item not in remove]
          remaining_removed = remove.intersection(state.get('not_proven', []))
          if remaining_removed:
              raise RuntimeError('STATE_NOT_PROVEN_CLEANUP_FAILED')
          proven = state.setdefault('proven', [])
          statements = [
              'SW2-14 deterministic incremental Project Truth impact planning is feature-proven on exact candidate 7e1bc15b9868224b42fd095e70ba5eadf7c12ef7: Governance Selftest 37219195065 passed Ubuntu and Windows with INCREMENTAL_IMPACT_GRAPH, selective-write, fact-selectivity, unknown-broadening, and exhaustive-parity regressions.',
              'SW2-14 preserves verify read-only safety on exact candidate 7e1bc15b9868224b42fd095e70ba5eadf7c12ef7: Governance Selftest 37219195065 passed Verify mode is read-only on both Ubuntu and Windows after normative references were correctly classified as documentation impact.',
              'SW2-14 feature-level parity evidence is green on exact candidate 7e1bc15b9868224b42fd095e70ba5eadf7c12ef7: SW2 Sequence Evidence 37219195086, Governance Engine Performance 37219195153, and Consumer Engine Performance 37219195072 succeeded; pre-promotion Self Governance 37219195078 reached only the intentionally unpromoted Project Truth gate.',
          ]
          for statement in statements:
              if statement not in proven:
                  proven.append(statement)
          state['next_authorized_actions'] = [
              'Run the complete permanent acceptance matrix on the post-promotion exact candidate.',
              'If all six permanent contexts pass, ready and squash-merge PR #22 with exact-head locking.',
              'After merge, verify merged-tree identity and the complete post-merge main matrix before declaring SW2-14 accepted.',
          ]
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Regenerate Project Truth from promoted authority
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_governance_engine.py
      - name: Refresh current SW2-14 sequence acceptance
        shell: bash
        run: |
          python scripts/validate_sequence_sessions.py --root .
      - name: Remove helper and validate promotion tree
        shell: bash
        run: |
          rm .github/workflows/tmp-sw2-14-promote.yml
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_sequence_sessions.py --root .
      - name: Commit promoted authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "SW2-14: promote incremental Project Truth acceptance"
          git push origin HEAD:work/sw2-14-incremental-project-truth
