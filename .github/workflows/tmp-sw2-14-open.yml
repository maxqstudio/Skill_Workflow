name: SW2-14 Phase Open

on:
  push:
    branches:
      - work/sw2-14-incremental-project-truth
    paths:
      - .github/workflows/tmp-sw2-14-open.yml

permissions:
  contents: write

jobs:
  open-phase:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ACCEPTED_MAIN_SHA: 4d0c3efb7bfcb8d22bf80c336e86a2a4054e49ef
      BRANCH: work/sw2-14-incremental-project-truth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-14-incremental-project-truth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open governed SW2-14 boundary
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-sw2-14-open.yml
          rm "$helper"

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          accepted = '4d0c3efb7bfcb8d22bf80c336e86a2a4054e49ef'

          roadmap_path = root / '.workflow' / 'roadmap.json'
          roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
          if roadmap.get('current_phase') != 'SW2-13':
              raise SystemExit('EXPECTED_SW2_13_CURRENT')
          found13 = found14 = False
          for phase in roadmap.get('phases', []):
              if phase.get('id') == 'SW2-13':
                  phase['status'] = 'COMPLETE'; found13 = True
              elif phase.get('id') == 'SW2-14':
                  phase['status'] = 'CURRENT'; found14 = True
          if not (found13 and found14):
              raise SystemExit('ROADMAP_PHASE_MISSING')
          roadmap['current_phase'] = 'SW2-14'
          roadmap_path.write_text(json.dumps(roadmap, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          state_path = root / '.workflow' / 'state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['phase'] = 'SW2-14'
          state['last_accepted_branch'] = 'main'
          state['last_accepted_sha'] = accepted
          state['blockers'] = []
          state['next_authorized_actions'] = [
              'Map current Project Truth generation inputs, projections, and dependency relationships before changing regeneration behavior.',
              'Define a deterministic fail-closed impact graph from changed authority/source inputs to affected generated facts and projections.',
              'Implement incremental develop/verify regeneration only after negative-path tests prove unknown impact broadens validation and unchanged projections are not rewritten.',
              'Keep finalize exhaustive and require parity against the accepted full regeneration path before SW2-14 closure.',
          ]
          state['blocked_actions'] = [
              'Do not skip or weaken exhaustive finalize validation.',
              'Do not treat cache state or timestamps as semantic acceptance authority.',
              'Do not suppress regeneration when impact classification is unknown or ambiguous; unknown impact must broaden work fail-closed.',
              'Do not rewrite unchanged tracked projections in develop/verify merely to refresh timestamps or formatting.',
              'Do not begin SW2-15 implementation until SW2-14 is accepted on main.',
          ]
          state['not_proven'] = [
              'SW2-14 deterministic Project Truth impact graph is not yet proven.',
              'SW2-14 selective regeneration and unchanged-projection preservation are not yet proven.',
              'SW2-14 unknown-impact fail-closed escalation is not yet proven.',
              'SW2-14 finalize parity with exhaustive accepted regeneration is not yet proven.',
              'Automatic GitHub merge protection and required-check enforcement remain intentionally NOT_PROVEN because no repository ruleset is configured; this remains non-blocking.',
          ]
          proven = state.setdefault('proven', [])
          closure = (
              'SW2-13 Skill Core / Reference Split is accepted on main ' + accepted + ' with merged tree '
              '8d1ad6cc0c635954f06f66d1bf4a639532073e23 equal to exact tested post-promotion candidate tree; post-merge Self Governance 37208968898, Governance Selftest 37208968830 on Ubuntu and Windows, SW2 Sequence Evidence 37208968839, Governance Engine Performance 37208968906, and Consumer Engine Performance 37208968813 all succeeded.'
          )
          if closure not in proven:
              proven.append(closure)
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          acceptance = {
              'schema_version': 1,
              'evidence_boundary': 'SW2-14 covers Incremental Project Truth Compiler only: deterministic fail-closed impact analysis, selective develop/verify regeneration, preservation of unchanged projections, unknown-impact escalation, and exhaustive finalize parity. It must not weaken accepted Project Truth authority, schema/toolchain identity, sequence evidence, exact-head acceptance, or any prior V2 guarantee.',
              'human_comprehension_status': 'PASS',
              'human_comprehension_questions': {
                  'What is the project and what problem does it solve?': 'PASS',
                  'Who uses it and what are the primary outcomes?': 'PASS',
                  'What are the major components and how do they relate?': 'PASS',
                  'How does important data flow through the system?': 'PASS',
                  'What are the main user/domain workflows?': 'PASS',
                  'What are the important lifecycle states and transitions?': 'PASS',
                  'Who/what is authoritative for important decisions?': 'PASS',
                  'What is mutable and what is immutable?': 'PASS',
                  'How does failure/recovery behave?': 'PASS',
                  'What is the current project state?': 'PASS',
                  'What is proven and what is not proven?': 'PASS',
                  'What may happen next and what is blocked?': 'PASS',
              },
              'requirements': [
                  {'id': 'SW2-14-R1', 'requirement': 'Project Truth impact graph is deterministic, dependency-aware, and fail-closed.', 'status': 'NOT_PROVEN', 'evidence': 'NOT_PROVEN until the current full regeneration pipeline is mapped, impact edges are explicit/deterministic, and ambiguous or unsupported impact cannot silently narrow work.'},
                  {'id': 'SW2-14-R2', 'requirement': 'Develop/verify regenerate only affected facts and projections and do not rewrite unchanged tracked projections.', 'status': 'NOT_PROVEN', 'evidence': 'NOT_PROVEN until selective regeneration is implemented with byte/digest evidence proving unaffected projections remain untouched.'},
                  {'id': 'SW2-14-R3', 'requirement': 'Unknown or ambiguous impact broadens regeneration and validation rather than permitting a false PASS.', 'status': 'NOT_PROVEN', 'evidence': 'NOT_PROVEN until adversarial negative paths prove unknown inputs and dependency gaps escalate fail-closed to a broader safe path.'},
                  {'id': 'SW2-14-R4', 'requirement': 'Finalize remains exhaustive and produces governance-equivalent canonical outputs to the accepted full regeneration path across platforms and the permanent matrix.', 'status': 'NOT_PROVEN', 'evidence': 'NOT_PROVEN until exhaustive finalize parity, exact-head cleanliness, Ubuntu/Windows governance, sequence evidence, engine performance, and real-consumer acceptance all pass on the final candidate.'},
              ],
              'runtime_checks': [],
              'runtime_status': 'NOT_APPLICABLE',
              'sequence_mode': 'DURING',
              'sequence_session': 'SW2-14-GOVERNANCE',
              'sequence_sync_status': 'NOT_PROVEN',
              'test_commands': [
                  'python scripts/selftest_project_truth_compiler.py',
                  'python scripts/selftest_governance_engine.py',
                  'python scripts/selftest_cross_document_regressions.py',
                  'python scripts/selftest_strict_project_workflow.py',
                  'python scripts/validate_project_docs.py --root .',
                  'python scripts/validate_sequence_sessions.py --root .',
                  'python scripts/governance_engine.py --root . --base 4d0c3efb7bfcb8d22bf80c336e86a2a4054e49ef --mode finalize --expected-head <EXACT_HEAD>',
              ],
              'truth_gates': {
                  'BEHAVIORAL_SYNC': 'NOT_APPLICABLE',
                  'CROSS_DOCUMENT_CONSISTENCY': 'NOT_PROVEN',
                  'DOC_LAYOUT': 'PASS',
                  'DOC_READABILITY': 'PASS',
                  'DOC_SOURCE_TRACEABILITY': 'NOT_PROVEN',
                  'DOC_TEST_TRACEABILITY': 'NOT_PROVEN',
                  'HUMAN_COMPREHENSION': 'PASS',
                  'PROJECT_DOCS_NORMALIZED': 'PASS',
                  'PROJECT_DOCS_SYNC': 'NOT_PROVEN',
                  'PROJECT_STATE_SYNC': 'NOT_PROVEN',
                  'PROVENANCE_SYNC': 'NOT_PROVEN',
                  'REFERENCE_SYNC': 'NOT_PROVEN',
                  'ROADMAP_SYNC': 'NOT_PROVEN',
                  'RUNTIME_E2E': 'NOT_APPLICABLE',
                  'SEMANTIC_SYNC': 'NOT_PROVEN',
                  'SEQUENCE_SYNC': 'NOT_PROVEN',
                  'SOURCE_TESTS': 'NOT_PROVEN',
                  'STRUCTURAL_SYNC': 'NOT_PROVEN',
                  'TEST_RUNTIME_TRACEABILITY': 'NOT_APPLICABLE',
              },
          }
          (root / '.workflow' / 'acceptance.json').write_text(json.dumps(acceptance, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          prior_path = root / 'docs' / 'sequence' / 'sessions' / 'SW2-13-GOVERNANCE.json'
          prior = json.loads(prior_path.read_text(encoding='utf-8'))
          prior['scope'] = 'HISTORICAL'
          prior['status'] = 'COMPLETE'
          prior_path.write_text(json.dumps(prior, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          session = {
              'schema_version': 1,
              'session_id': 'SW2-14-GOVERNANCE',
              'phase': 'SW2-14',
              'mode': 'DURING',
              'scope': 'CURRENT',
              'status': 'IN_PROGRESS',
              'critical': True,
              'implementation_base_sha': accepted,
              'evidence_boundary': 'SW2-14 sequence evidence covers current full Project Truth synchronization, deterministic document generation/validation, governance orchestration, cross-document consistency, and sequence validation as the baseline for incremental regeneration. Static structure does not by itself prove selective-regeneration correctness or runtime ordering.',
              'plan': {'required': False, 'frozen': False, 'contract': '', 'diagram': '', 'frozen_commit': '', 'sha256': ''},
              'actual': {
                  'entries': [
                      'scripts/sync_project_truth.py::main',
                      'scripts/generate_project_docs.py::main',
                      'scripts/validate_project_docs.py::main',
                      'scripts/governance_engine.py::main',
                      'scripts/validate_cross_document_consistency.py::main',
                      'scripts/validate_sequence_sessions.py::main',
                  ],
                  'graph': 'docs/sequence/generated/SW2-14-GOVERNANCE.actual.json',
                  'diagram': 'docs/sequence/generated/SW2-14-GOVERNANCE.actual.mmd',
                  'source_digest': '',
              },
              'human_view': {
                  'policy_id': 'module-collapse-v1',
                  'granularity': 'module',
                  'graph': 'docs/sequence/generated/SW2-14-GOVERNANCE.human.json',
                  'diagram': 'docs/sequence/generated/SW2-14-GOVERNANCE.human.mmd',
                  'document': 'docs/sequence/views/SW2-14-GOVERNANCE.md',
                  'source_digest': '',
              },
              'runtime_trace': {'required': False, 'graph': ''},
              'test_traceability_required': True,
              'tests': [
                  'scripts/selftest_project_truth_compiler.py',
                  'scripts/selftest_governance_engine.py',
                  'scripts/selftest_cross_document_regressions.py',
                  'scripts/selftest_strict_project_workflow.py',
              ],
              'acceptance_report': 'artifacts/sequence/SW2-14-GOVERNANCE.acceptance.json',
          }
          session_path = root / 'docs' / 'sequence' / 'sessions' / 'SW2-14-GOVERNANCE.json'
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          p = Path('docs/sequence/sessions/SW2-14-GOVERNANCE.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          a = s['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', a['graph'], '--output-mermaid', a['diagram']]
          for entry in a['entries']:
              cmd.extend(['--entry', entry])
          subprocess.run(cmd, check=True)
          generated = json.loads(Path(a['graph']).read_text(encoding='utf-8'))
          digest = generated.get('source_digest', '')
          if not digest:
              raise SystemExit('SOURCE_DIGEST_MISSING')
          s['actual']['source_digest'] = digest
          s['human_view']['source_digest'] = digest
          p.write_text(json.dumps(s, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          h = s['human_view']
          subprocess.run([sys.executable, 'scripts/sequence_human_view.py', '--root', '.', '--actual-json', a['graph'], '--actual-mermaid', a['diagram'], '--output-json', h['graph'], '--output-mermaid', h['diagram'], '--output-markdown', h['document'], '--session-id', s['session_id']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.', '--session', p.as_posix(), '--report', s['acceptance_report']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_human_view.py', '--root', '.', '--session', p.as_posix()], check=True)
          PY

          python scripts/sync_project_truth.py
          python scripts/validate_project_docs.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/validate_sequence_sessions.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .

          git restore "$helper"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs artifacts/sequence
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'SW2-14: open incremental Project Truth phase'
          git push origin "HEAD:$BRANCH"
