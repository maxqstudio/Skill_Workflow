name: tmp-sw2-25-final-evidence-sync
on:
  push:
    branches: [work/sw2-25-reproducible-release-bundle]
permissions:
  contents: write
jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-25-reproducible-release-bundle
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Synchronize promoted SW2-25 source, acceptance and generated documentation
        shell: bash
        run: |
          python scripts/validate_sequence_contract.py --root . --session docs/sequence/sessions/SW2-25-GOVERNANCE.json --no-write-report
          python scripts/validate_sequence_sessions.py --root .
          python scripts/sync_project_truth.py --root .
          git add .workflow docs artifacts/sequence
          python scripts/validate_documentation_contract.py --root . --write-report
          git add .workflow/generated/documentation_coverage.json
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "SW2-25: synchronize R1-R5 accepted evidence and Project Truth"
          python scripts/validate_documentation_contract.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_handoff.py --root .
          python scripts/validate_human_comprehension.py --root . --require-pass
          python scripts/validate_project_truth.py --root .
          git diff --exit-code -- .workflow docs artifacts/sequence
          git push origin HEAD:work/sw2-25-reproducible-release-bundle
