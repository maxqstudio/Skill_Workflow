name: TEMP SW2-09 Publish V2.0.0

on:
  push:
    branches:
      - release/sw2-09-v2.0.0-publication

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_SHA: d61d216f1c9b29d6bdd90e1a929cd4199c8e93f6
      VERSION: v2.0.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tested main release target
        uses: actions/checkout@v4
        with:
          ref: d61d216f1c9b29d6bdd90e1a929cd4199c8e93f6
          fetch-depth: 0

      - name: Verify exact release target and clean state
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD^{tree})" = "b57951a255bbd5a6cca3a17635c401eb2520565b"
          test -z "$(git ls-remote --tags origin refs/tags/${VERSION})"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile governance scripts outside repository
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q scripts

      - name: Run exact-main final governance authority
        shell: bash
        run: |
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          python scripts/governance_engine.py \
            --root . \
            --base "$base" \
            --mode finalize \
            --expected-head "$TARGET_SHA" \
            --report "$RUNNER_TEMP/governance.json"

      - name: Run strict stable release preflight
        shell: bash
        run: |
          python scripts/release_preflight.py \
            --root . \
            --expected-head "$TARGET_SHA" \
            --version "$VERSION" \
            --governance-report "$RUNNER_TEMP/governance.json" \
            --report "$RUNNER_TEMP/release-preflight.json"

      - name: Assert exact publication authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-preflight.json').read_text(encoding='utf-8'))
          assert report['result'] == 'PASS', report
          assert report['publication_authority'] is True, report
          assert report['stable'] is True, report
          assert report['evidence_only'] is False, report
          assert report['expected_head'] == os.environ['TARGET_SHA'], report
          assert report['observed_head'] == os.environ['TARGET_SHA'], report
          assert report['version'] == os.environ['VERSION'], report
          assert report.get('pending_publication_requirements') == ['SW2-09-R4'], report
          assert report['failures'] == [], report
          print('STRICT_STABLE_PUBLICATION_AUTHORITY=PASS')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare immutable release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Skill Workflow V2.0.0

          Stable V2 release produced by SW2-09 governance.

          - Release target: `d61d216f1c9b29d6bdd90e1a929cd4199c8e93f6`
          - Release tree: `b57951a255bbd5a6cca3a17635c401eb2520565b`
          - SW2-00 through SW2-08: accepted
          - SW2-09 R1-R3: PASS before publication
          - SW2-09 R4: publication-pending until this tag/release target is verified
          - Migration and rollback guidance: published in the V2 handbook
          - Repository ruleset: intentionally not configured by Owner decision; no automatic merge-enforcement claim is made

          Compatibility contract: schema v1 with explicit deterministic migration for legacy unversioned governance state. Unknown future schemas fail closed. Stable release rollback is repair-forward; this tag must never be moved or retargeted.
          EOF

      - name: Publish exact stable GitHub release
        shell: bash
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Skill Workflow V2.0.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

      - name: Verify immutable tag and release target
        shell: bash
        run: |
          tag_target="$(git ls-remote origin "refs/tags/${VERSION}" | awk '{print $1}')"
          test "$tag_target" = "$TARGET_SHA"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,url,publishedAt \
            > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text(encoding='utf-8'))
          assert release['tagName'] == os.environ['VERSION'], release
          assert release['isDraft'] is False, release
          assert release['isPrerelease'] is False, release
          assert release['targetCommitish'] == os.environ['TARGET_SHA'], release
          assert release['publishedAt'], release
          print('TAG_TARGET_IDENTITY=PASS')
          print('GITHUB_RELEASE_TARGET_IDENTITY=PASS')
          PY

      - name: Record publication evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          runner = Path(os.environ['RUNNER_TEMP'])
          preflight = json.loads((runner / 'release-preflight.json').read_text(encoding='utf-8'))
          release = json.loads((runner / 'release.json').read_text(encoding='utf-8'))
          evidence = {
              'schema_version': 1,
              'result': 'PASS',
              'version': os.environ['VERSION'],
              'target_sha': os.environ['TARGET_SHA'],
              'target_tree': 'b57951a255bbd5a6cca3a17635c401eb2520565b',
              'publication_authority': preflight['publication_authority'],
              'pending_before_publication': preflight.get('pending_publication_requirements'),
              'tag_target_verified': True,
              'release_target_verified': True,
              'release_url': release['url'],
              'publication_run_id': os.environ['GITHUB_RUN_ID'],
          }
          out = Path('publication-evidence.json')
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload stable publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: sw2-09-v2.0.0-publication-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/governance.json
            ${{ runner.temp }}/release-preflight.json
            ${{ runner.temp }}/release.json
            publication-evidence.json
          if-no-files-found: error
          retention-days: 90
