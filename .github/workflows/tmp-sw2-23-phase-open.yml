name: tmp-sw2-23-phase-open
on:
  push:
    branches:
      - work/sw2-23-multi-consumer-adoption
permissions:
  contents: write
jobs:
  open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-23-multi-consumer-adoption
          fetch-depth: 0
      - name: Configure bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Open phase and verify freeze
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .github/scripts/tmp_sw2_23_phase_open.py
