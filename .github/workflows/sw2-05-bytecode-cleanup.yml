name: SW2-05 Bytecode Cleanup

on:
  push:
    branches:
      - work/sw2-05-schema-toolchain-versioning

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-05-schema-toolchain-versioning
          fetch-depth: 0

      - name: Remove tracked Python bytecode only
        shell: bash
        run: |
          tracked="$(git ls-files 'scripts/__pycache__/*' '*.pyc')"
          test -n "$tracked"
          printf '%s\n' "$tracked"
          git rm -r scripts/__pycache__
          test -z "$(git ls-files 'scripts/__pycache__/*' '*.pyc')"

      - name: Verify ignore policy
        shell: bash
        run: |
          mkdir -p scripts/__pycache__
          : > scripts/__pycache__/probe.cpython-312.pyc
          git check-ignore -q scripts/__pycache__/probe.cpython-312.pyc
          rm -rf scripts/__pycache__
          test -z "$(git ls-files 'scripts/__pycache__/*' '*.pyc')"
          deletions="$(git diff --cached --name-only --diff-filter=D -- 'scripts/__pycache__/*')"
          test -n "$deletions"

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git status --short
          git commit -m "fix(sw2-05): remove tracked Python bytecode"
          git push origin HEAD:work/sw2-05-schema-toolchain-versioning
