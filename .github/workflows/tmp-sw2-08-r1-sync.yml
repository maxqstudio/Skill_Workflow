name: TEMP SW2-08 R1 Sync

on:
  push:
    branches:
      - work/sw2-08-regression-adoption-validation

permissions:
  contents: write

jobs:
  validate-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-08-regression-adoption-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove LITE and STANDARD fixtures
        run: python scripts/selftest_adoption_profiles.py
      - name: Regenerate current sequence
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.')
          acceptance = json.loads((root/'.workflow/acceptance.json').read_text(encoding='utf-8'))
          sid = acceptance['sequence_session']
          session_path = root/'docs/sequence/sessions'/f'{sid}.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable,'scripts/generate_sequence_actual.py','--root','.','--output-json',actual['graph'],'--output-mermaid',actual['diagram']]
          for entry in actual['entries']:
              cmd += ['--entry',entry]
          subprocess.run(cmd,check=True)
          human = session.get('human_view') or {}
          if human:
              subprocess.run([sys.executable,'scripts/sequence_human_view.py','--root','.','--actual-json',actual['graph'],'--actual-mermaid',actual['diagram'],'--output-json',human['graph'],'--output-mermaid',human['diagram'],'--output-markdown',human['document'],'--session-id',sid],check=True)
          subprocess.run([sys.executable,'scripts/validate_sequence_contract.py','--root','.','--session',session_path.as_posix(),'--report',session['acceptance_report']],check=True)
          subprocess.run([sys.executable,'scripts/validate_sequence_sessions.py','--root','.'],check=True)
          PY
      - name: Synchronize Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit deterministic projections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow/acceptance.json .workflow/generated docs artifacts/sequence PROJECT_PROFILE.yaml
          if git diff --cached --quiet; then
            echo "NO_GENERATED_DRIFT"
            exit 0
          fi
          git commit -m "SW2-08: synchronize R1 adoption evidence"
          git push origin HEAD:work/sw2-08-regression-adoption-validation
