name: TEMP SW2-15 Phase Open Repair

on:
  push:
    branches:
      - work/sw2-15-smart-validation-dag
    paths:
      - .github/workflows/tmp-sw2-15-phase-open-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-15-smart-validation-dag
          fetch-depth: 0

      - name: Repair cleanup assertion and remove repair helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-sw2-15-phase-open.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          test -z "$(git status --porcelain --untracked-files=all -- .github/workflows | grep 'tmp-sw2-15-phase-open' || true)"\n'''
          new = '''          test ! -e .github/workflows/tmp-sw2-15-phase-open.yml\n'''
          if text.count(old) != 1:
              raise RuntimeError('PHASE_OPEN_CLEANUP_ASSERTION_ANCHOR')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          Path('.github/workflows/tmp-sw2-15-phase-open-repair.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SW2-15: repair phase-open helper cleanup assertion'
          git push origin HEAD:work/sw2-15-smart-validation-dag
