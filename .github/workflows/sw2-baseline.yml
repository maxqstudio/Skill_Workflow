name: SW2 Engine Performance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance-performance:
    name: Governance Engine Performance (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate provenance
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$expected"
          echo "ACTUAL_HEAD=$actual"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure Governance Engine V2 against accepted baseline
        run: >-
          python scripts/benchmark_governance.py
          --root .
          --tool-root .
          --repeats 3
          --include-selftests
          --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"
          --baseline benchmarks/baselines/sw2-00-self-linux.json
          --label "SW2-01 Skill Workflow Engine V2"
          --output artifacts/performance/sw2-01-self-engine.json

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw2-01-self-engine-performance
          path: artifacts/performance/sw2-01-self-engine.json
          if-no-files-found: error
          retention-days: 14
