name: TEMP SW2-10 Finalize Documentation

on:
  push:
    branches:
      - work/sw2-10-docs-polish

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-10-docs-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic documentation transaction
        shell: bash
        run: |
          python scripts/tmp_sw2_10_docs_polish.py
          rm scripts/tmp_sw2_10_docs_polish.py

      - name: Generate current sequence evidence
        shell: bash
        run: |
          python scripts/generate_sequence_actual.py --root . \
            --output-json docs/sequence/generated/SW2-10-GOVERNANCE.actual.json \
            --output-mermaid docs/sequence/generated/SW2-10-GOVERNANCE.actual.mmd \
            --entry scripts/validate_public_docs.py::main \
            --entry scripts/sync_project_truth.py::main \
            --entry scripts/validate_project_docs.py::main \
            --entry scripts/validate_cross_document_consistency.py::main \
            --entry scripts/validate_sequence_sessions.py::main \
            --entry scripts/governance_engine.py::main
          python scripts/sequence_human_view.py --root . \
            --actual-json docs/sequence/generated/SW2-10-GOVERNANCE.actual.json \
            --actual-mermaid docs/sequence/generated/SW2-10-GOVERNANCE.actual.mmd \
            --output-json docs/sequence/generated/SW2-10-GOVERNANCE.human.json \
            --output-mermaid docs/sequence/generated/SW2-10-GOVERNANCE.human.mmd \
            --output-markdown docs/sequence/views/SW2-10-GOVERNANCE.md \
            --session-id SW2-10-GOVERNANCE
          python scripts/validate_sequence_contract.py --root . \
            --session docs/sequence/sessions/SW2-10-GOVERNANCE.json \
            --report artifacts/sequence/SW2-10-GOVERNANCE.acceptance.json
          python scripts/validate_sequence_human_view.py --root . \
            --session docs/sequence/sessions/SW2-10-GOVERNANCE.json
          python scripts/validate_sequence_sessions.py --root .

      - name: Regenerate Project Truth
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/generate_symbol_index.py --root .
          python scripts/generate_module_map.py --root .

      - name: Validate dirty-worktree-safe documentation gates
        shell: bash
        run: |
          python -m compileall -q scripts
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          python scripts/selftest_public_docs.py
          python scripts/validate_public_docs.py --root . --report artifacts/public_docs_report.json
          python scripts/validate_project_docs.py --root .
          python scripts/validate_project_truth.py --root .
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/selftest_strict_project_workflow.py
          python scripts/validate_sequence_sessions.py --root .

      - name: Commit exact candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SW2-10: polish documentation and discoverability'

      - name: Exact-head governance finalize
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          base="$(python -c 'import json; print(json.load(open(".workflow/state.json", encoding="utf-8"))["last_accepted_sha"])')"
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/validate_public_docs.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_cross_document_consistency.py --root .
          python scripts/validate_project_truth.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/governance_engine.py --root . --base "$base" --mode finalize --expected-head "$expected"
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs scripts)"

      - name: Push accepted candidate
        shell: bash
        run: git push origin HEAD:work/sw2-10-docs-polish
