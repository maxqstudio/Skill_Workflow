name: TEMP SW2-16 Acceptance Promotion

on:
  push:
    branches: [work/sw2-16-historical-evidence-freeze]
    paths: [.github/workflows/tmp-sw2-16-promote.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-16-historical-evidence-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote SW2-16 requirements and truth gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          CANDIDATE='fb440f2ac505f8e813c56a70dda6b10e7a42058e'
          RUN_SELF='37262481610'
          RUN_GOV='37262481595'
          RUN_SEQ='37262481699'
          RUN_ENGINE='37262481631'
          RUN_CONSUMER='37262481608'
          RECONCILE='37261538934'
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def write(p,d): Path(p).write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')

          a=load('.workflow/acceptance.json')
          evidence={
            'SW2-16-R1': f'PASS on exact clean candidate {CANDIDATE}: historical identity is content-addressed from Git object bytes; tamper, dirty-worktree, frozen-commit mismatch, manifest determinism, and squash provenance regressions passed in Governance Selftest {RUN_GOV} on Ubuntu and Windows.',
            'SW2-16-R2': f'PASS on exact clean candidate {CANDIDATE}: normal historical validation is identity-only and no-rewrite; Governance Selftest {RUN_GOV} passed Historical Evidence Freeze and Verify mode is read-only on Ubuntu and Windows.',
            'SW2-16-R3': f'PASS: explicit authorized reconciliation/re-freeze transaction {RECONCILE} succeeded, while selftest_historical_evidence proves migration requires authorization, rejects ambiguous/incompatible identity fail-closed, and records deterministic frozen provenance.',
            'SW2-16-R4': f'PASS pending final post-promotion confirmation: exact candidate {CANDIDATE} passed Governance Selftest {RUN_GOV} on Ubuntu/Windows, Sequence {RUN_SEQ}, Engine {RUN_ENGINE}, and Consumer {RUN_CONSUMER}; Self Governance {RUN_SELF} reached only the expected Project Truth promotion boundary after all other finalize nodes passed. Final post-promotion 6/6 is required before merge.',
          }
          for r in a['requirements']:
              rid=r['id']
              if rid in evidence:
                  r['status']='PASS'; r['evidence']=evidence[rid]
          a['sequence_sync_status']='PASS'
          for k in list(a['truth_gates']):
              if a['truth_gates'][k] != 'NOT_APPLICABLE':
                  a['truth_gates'][k]='PASS'
          write('.workflow/acceptance.json',a)

          s=load('.workflow/state.json')
          s['status']='IN_PROGRESS'
          s['blockers']=[]
          s['not_proven']=[x for x in s.get('not_proven',[]) if not x.startswith('SW2-16 ')]
          proof=(f'SW2-16 Historical Evidence Freeze pre-promotion is proven on exact clean candidate {CANDIDATE}: Governance Selftest {RUN_GOV} passed Ubuntu and Windows including squash provenance, historical freeze, read-only verify and STRICT; Sequence {RUN_SEQ}, Engine {RUN_ENGINE}, and Consumer {RUN_CONSUMER} succeeded. Git-object identity preserves exact repository bytes across platform checkout transforms while staged/unstaged tamper remains fail-closed. Self Governance {RUN_SELF} failed only at the expected Project Truth promotion boundary.')
          proven=list(s.get('proven',[]))
          if proof not in proven: proven.append(proof)
          s['proven']=proven
          s['next_authorized_actions']=[
            'Run the complete permanent matrix on the post-promotion exact candidate and require 6/6 SUCCESS.',
            'If post-promotion acceptance is green, record closure evidence, mark SW2-16 accepted, and squash-merge PR #24 with expected-head protection.',
            'Do not begin SW2-17 until SW2-16 is accepted on main and post-merge main is green.'
          ]
          write('.workflow/state.json',s)
          PY
      - name: Regenerate Project Truth
        run: python scripts/sync_project_truth.py --root .
      - name: Commit promotion before clean validation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow docs artifacts/sequence
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git commit -m 'SW2-16: promote historical evidence acceptance'
      - name: Prove clean promoted authority
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/selftest_historical_evidence.py
          python scripts/selftest_sequence_squash_provenance.py
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_public_docs.py --root .
          python scripts/governance_engine.py --root . --base 9ac09b2acd0bdf25ea05157be7711da852173ab8 --mode finalize --expected-head "$HEAD_SHA" --report /tmp/sw2-16-finalize.json
          test -z "$(git status --porcelain --untracked-files=all -- PROJECT_PROFILE.yaml .workflow docs artifacts/sequence scripts references templates)"
      - name: Push promoted authority
        run: git push origin HEAD:work/sw2-16-historical-evidence-freeze
