name: SW2-07 Promote R1

on:
  push:
    branches:
      - work/sw2-07-public-project-hardening

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_PARENT: "d0e6aabbfd772630c9362b5005c40e6dabffc115"
      ACCEPTED_MAIN: "f391fe9dc5d208803118090bbe6a174e8f6c7c63"
      BRANCH: "work/sw2-07-public-project-hardening"

    steps:
      - name: Checkout promotion trigger
        uses: actions/checkout@v4
        with:
          ref: work/sw2-07-public-project-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert exact validated parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          git merge-base --is-ancestor "$ACCEPTED_MAIN" HEAD

      - name: Revalidate Owner-approved MIT license
        run: python scripts/validate_repository_health.py --root . --require-owner-approved-license

      - name: Promote R1 and refresh live R3 boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
                  newline='\n',
              )

          r1_evidence = (
              'Owner selected the MIT License; SW2-ADR-010 is ACCEPTED and LICENSE contains the MIT text. '
              'Exact candidate d0e6aabbfd772630c9362b5005c40e6dabffc115 passed Self Governance run 37130848992, '
              'Governance Selftest run 37130848954 on Ubuntu and Windows, SW2 Sequence Evidence run 37130849015, '
              'Governance Engine Performance run 37130849009, and Consumer Engine Performance run 37130848995; '
              'repository-health regression passed on both operating systems.'
          )
          r3_evidence = (
              'Live ruleset 24406662 targets the default branch but is currently enforcement=disabled during Owner repair; '
              'its payload also still lacks required_status_checks for the six permanent acceptance checks. R3 remains NOT_PROVEN.'
          )

          acceptance = load('.workflow/acceptance.json')
          req = {item['id']: item for item in acceptance['requirements']}
          assert req['SW2-07-R1']['status'] == 'NOT_PROVEN'
          assert req['SW2-07-R2']['status'] == 'PASS'
          assert req['SW2-07-R3']['status'] == 'NOT_PROVEN'
          assert req['SW2-07-R4']['status'] == 'PASS'
          req['SW2-07-R1']['status'] = 'PASS'
          req['SW2-07-R1']['evidence'] = r1_evidence
          req['SW2-07-R2']['evidence'] = (
              'Exact clean candidate 7d80c427619ccad4bee2fec1545847e1b3ca52ba: Self Governance 37113203365, '
              'Governance Selftest 37113203386 on Ubuntu and Windows, SW2 Sequence Evidence 37113203376, '
              'Governance Engine Performance 37113203374, and Consumer Engine Performance 37113203358 all succeeded. '
              'Governance Selftest included blocking public-documentation, repository-health, cross-document, read-only verify, '
              'and STRICT regressions on both operating systems.'
          )
          req['SW2-07-R3']['evidence'] = r3_evidence
          save('.workflow/acceptance.json', acceptance)

          state = load('.workflow/state.json')
          state['blockers'] = [
              'Live GitHub ruleset 24406662 is currently disabled and lacks required_status_checks for the six permanent acceptance checks, so SW2-07-R3 remains NOT_PROVEN.'
          ]
          state['not_proven'] = [
              'SW2-07 live GitHub ruleset enforcement is currently disabled and does not yet require the six permanent acceptance checks.'
          ]
          proof = 'SW2-07-R1 public license is accepted: ' + r1_evidence
          if proof not in state['proven']:
              state['proven'].append(proof)
          state['next_authorized_actions'] = [
              'Re-enable and repair live GitHub ruleset 24406662 so it requires all six permanent acceptance checks, then audit the live payload.',
              'After R3 PASS, run final exact-head acceptance and close SW2-07 without creating the stable V2 release reserved for SW2-09.'
          ]
          state['blocked_actions'] = [
              'Do not change the Owner-approved MIT license or SW2-ADR-010 without explicit Owner approval.',
              'Do not claim merge/ruleset enforcement from workflow files alone; actual GitHub repository configuration must be evidenced.',
              'Do not create the V2 stable release/tag in SW2-07; stable release remains SW2-09 scope.',
              'Do not weaken accepted SW2-01 through SW2-06 governance guarantees while hardening public repository operations.'
          ]
          save('.workflow/state.json', state)

          claims = load('.workflow/claims.json')
          public_health = next(item for item in claims['claims'] if item['id'] == 'TRUTH-SW2-PUBLIC-REPO-HEALTH')
          public_health['status'] = 'PASS'
          public_health['runtime_evidence'] = [r1_evidence]
          for source in ('LICENSE', '.workflow/decisions.json'):
              if source not in public_health['source_owners']:
                  public_health['source_owners'].append(source)

          merge = next(item for item in claims['claims'] if item['id'] == 'TRUTH-SW2-MERGE-ENFORCEMENT')
          merge['status'] = 'NOT_PROVEN'
          merge['runtime_evidence'] = [r3_evidence]
          save('.workflow/claims.json', claims)
          PY

      - name: Regenerate deterministic Project Truth
        run: python scripts/sync_project_truth.py --root .

      - name: Commit promotion candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs
          git diff --cached --quiet && { echo "FAIL NO_PROMOTION_CHANGES"; exit 1; }
          git commit -m "gov(sw2-07): accept MIT repository health"

      - name: Validate promoted exact head
        shell: bash
        run: |
          expected="$(git rev-parse HEAD)"
          python scripts/validate_repository_health.py --root . --require-owner-approved-license
          python scripts/validate_public_docs.py --root .
          python scripts/validate_cross_document_consistency.py --root . --base "$ACCEPTED_MAIN" --require-base
          python scripts/validate_project_truth.py --root .
          python scripts/governance_engine.py --root . --base "$ACCEPTED_MAIN" --mode finalize --expected-head "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Assert only R3 remains blocked
        shell: bash
        run: |
          python - <<'PY'
          import json
          a=json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          status={x['id']:x['status'] for x in a['requirements']}
          assert status == {
              'SW2-07-R1':'PASS',
              'SW2-07-R2':'PASS',
              'SW2-07-R3':'NOT_PROVEN',
              'SW2-07-R4':'PASS',
          }, status
          s=json.load(open('.workflow/state.json', encoding='utf-8'))
          assert len(s['blockers']) == 1, s['blockers']
          assert 'ruleset' in s['blockers'][0].lower()
          print('R1_PROMOTED_R3_ONLY_BLOCKER=PASS')
          PY

      - name: Push validated R1 promotion
        shell: bash
        run: git push origin HEAD:"$BRANCH"
