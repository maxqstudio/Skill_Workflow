name: tmp-sw2-21-authorize

on:
  push:
    branches:
      - work/sw2-21-authorized-closure-defect-lifecycle

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-21-authorized-closure-defect-lifecycle
          fetch-depth: 0

      - name: Reconstruct authorized SW2-21 from terminal main
        shell: bash
        run: |
          set -euo pipefail
          BASE='8723bf0315a1e6cee005198affbc9ec1576e8ba7'
          OLD='work/sw2-21-closure-defect-lifecycle'
          BRANCH='work/sw2-21-authorized-closure-defect-lifecycle'

          git fetch origin "${OLD}:${OLD}"

          files=(
            .workflow/acceptance.json
            .workflow/historical_evidence.json
            .workflow/known_defects.json
            .workflow/roadmap.json
            .workflow/state.json
            artifacts/sequence/SW2-21-GOVERNANCE.acceptance.json
            docs/sequence/generated/SW2-21-GOVERNANCE.actual.json
            docs/sequence/generated/SW2-21-GOVERNANCE.actual.mmd
            docs/sequence/generated/SW2-21-GOVERNANCE.human.json
            docs/sequence/generated/SW2-21-GOVERNANCE.human.mmd
            docs/sequence/sessions/SW2-20-GOVERNANCE.json
            docs/sequence/sessions/SW2-21-GOVERNANCE.json
            docs/sequence/views/SW2-21-GOVERNANCE.md
            scripts/selftest_closure_defect_lifecycle.py
            scripts/selftest_cross_document_regressions.py
            scripts/validate_closure_defect_lifecycle.py
          )
          git checkout "${OLD}" -- "${files[@]}"

          python - <<'PY'
          import json
          from pathlib import Path

          BASE = '8723bf0315a1e6cee005198affbc9ec1576e8ba7'
          BRANCH = 'work/sw2-21-authorized-closure-defect-lifecycle'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, obj):
              Path(path).write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')

          state = load('.workflow/state.json')
          state['last_accepted_branch'] = 'main'
          state['last_accepted_sha'] = BASE
          state['working_branch'] = BRANCH
          state['status'] = 'IN_PROGRESS'
          state['next_authorized_actions'] = [
              'Reconcile closure-state and known-defect lifecycle semantics only within SW2-21 scope.',
              'Run targeted lifecycle regression and regenerate deterministic Project Truth/sequence evidence.',
              'Require the complete exact-head permanent matrix before SW2-21 merge.',
              'After merge, require post-merge main revalidation before closure.'
          ]
          write('.workflow/state.json', state)

          acceptance = load('.workflow/acceptance.json')
          acceptance['test_commands'] = [
              'python scripts/selftest_governance_engine.py',
              'python scripts/selftest_closure_defect_lifecycle.py',
              'python scripts/selftest_cross_document_regressions.py',
              'python scripts/validate_closure_defect_lifecycle.py --root . --expected-base ' + BASE,
              'python scripts/validate_project_docs.py --root .',
              'python scripts/validate_sequence_sessions.py --root .',
              'python scripts/governance_engine.py --root . --base ' + BASE + ' --mode finalize --expected-head <EXACT_HEAD>'
          ]
          write('.workflow/acceptance.json', acceptance)

          session_path = Path('docs/sequence/sessions/SW2-21-GOVERNANCE.json')
          session = load(session_path)
          session['implementation_base_sha'] = BASE
          write(session_path, session)

          ref_path = Path('references/execution-and-acceptance.md')
          text = ref_path.read_text(encoding='utf-8')
          old = 'Use CONFIRMED, STRONG_INFERENCE, UNVERIFIED.'
          new = ('Use CONFIRMED, STRONG_INFERENCE, and UNVERIFIED for diagnostic certainty while investigating. '
                 'These are not lifecycle states in `.workflow/known_defects.json`. The governed defect ledger uses '
                 '`OPEN`, `FIXED/ACCEPTED`, `HISTORICAL`, or `NOT_PROVEN`; resolved entries require accepted resolution evidence.')
          if old not in text:
              raise SystemExit('expected defect-handling sentence not found')
          ref_path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

          python scripts/validate_closure_defect_lifecycle.py --root . --expected-base "${BASE}"
          python scripts/selftest_closure_defect_lifecycle.py
          python scripts/selftest_cross_document_regressions.py
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add . ':!.github/workflows/tmp-sw2-21-authorize.yml'
          git diff --cached --check
          git commit -m 'SW2-21: open authorized closure and defect lifecycle phase'
          git push origin HEAD:"${BRANCH}"
