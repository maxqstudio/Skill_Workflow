name: SW2-02 Promote R2

on:
  push:
    branches:
      - work/sw2-02-fast-development-workflow

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-02-fast-development-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote R2 authority only
        run: python .github/sw2-02-promote-r2.txt
      - name: Regenerate deterministic project truth
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_project_docs.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/validate_handoff.py --root .
      - name: Assert R3 remains not proven
        shell: bash
        run: |
          python - <<'PY'
          import json
          a = json.load(open('.workflow/acceptance.json', encoding='utf-8'))
          req = {x['id']: x for x in a['requirements']}
          assert req['SW2-02-R2']['status'] == 'PASS', req['SW2-02-R2']
          assert req['SW2-02-R3']['status'] == 'NOT_PROVEN', req['SW2-02-R3']
          c = json.load(open('.workflow/claims.json', encoding='utf-8'))
          claims = {x['id']: x for x in c['claims']}
          assert claims['TRUTH-SW2-MODE-SAFETY']['status'] == 'NOT_PROVEN', claims['TRUTH-SW2-MODE-SAFETY']
          print('R2_ONLY_PROMOTION=PASS')
          PY
      - name: Commit governed promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow docs
          git diff --cached --quiet && { echo "NO_PROMOTION_DIFF"; exit 0; }
          git commit -m "chore(sw2): promote verify evidence"
          git push origin HEAD:work/sw2-02-fast-development-workflow
