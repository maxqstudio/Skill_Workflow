name: Governance CI

on:
  push:
    branches:
      - ops/sw2-19-phase-open
    paths:
      - .github/workflows/governance-ci.yml
      - ops/sw2_19_phase_open.py

permissions:
  contents: write

jobs:
  phase-open:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-19-performance-budget-v2.1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load ops transaction script
        shell: bash
        run: git show origin/ops/sw2-19-phase-open:ops/sw2_19_phase_open.py > "$RUNNER_TEMP/sw2_19_phase_open.py"
      - name: Execute governed SW2-19 phase-open transaction
        shell: bash
        run: python "$RUNNER_TEMP/sw2_19_phase_open.py"
