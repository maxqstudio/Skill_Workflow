name: SW2-13 Implement Core Reference Split

on:
  push:
    branches:
      - work/sw2-13-skill-core-reference-split
    paths:
      - .github/workflows/tmp-sw2-13-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/sw2-13-skill-core-reference-split
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exclude permanent workflow edits from runner transaction
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('.github/scripts/tmp_sw2_13_implement_once.py'); t=p.read_text(encoding='utf-8'); a=t.index('# Add permanent CI gates.'); b=t.index('# Clarify the installed contract'); p.write_text(t[:a]+t[b:], encoding='utf-8')"

      - name: Execute one-shot governed implementation
        shell: bash
        run: python .github/scripts/tmp_sw2_13_implement_once.py
