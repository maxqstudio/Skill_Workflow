name: TEMP SW2-17 Resync

on:
  push:
    branches:
      - work/sw2-17-generator-modularization
    paths:
      - .github/workflows/tmp-sw2-17-resync.yml

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sw2-17-generator-modularization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove helper from source view and run focused regressions
        shell: bash
        run: |
          rm -f .github/workflows/tmp-sw2-17-resync.yml
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          python -m compileall -q scripts .github/scripts
          python scripts/selftest_project_truth_compiler.py
          python scripts/selftest_schema_toolchain.py
          python scripts/selftest_governance_engine.py
      - name: Regenerate current SW2-17 sequence evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path('.').resolve()
          session_path = root / 'docs/sequence/sessions/SW2-17-GOVERNANCE.json'
          session = json.loads(session_path.read_text(encoding='utf-8'))
          actual = session['actual']
          cmd = [sys.executable, 'scripts/generate_sequence_actual.py', '--root', '.', '--output-json', actual['graph'], '--output-mermaid', actual['diagram']]
          for entry in actual['entries']:
              cmd += ['--entry', entry]
          subprocess.run(cmd, check=True)
          graph = json.loads((root / actual['graph']).read_text(encoding='utf-8'))
          digest = graph['source_digest']
          session['actual']['source_digest'] = digest
          session['human_view']['source_digest'] = digest
          session_path.write_text(json.dumps(session, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          human = session['human_view']
          subprocess.run([sys.executable, 'scripts/sequence_human_view.py', '--root', '.', '--actual-json', actual['graph'], '--actual-mermaid', actual['diagram'], '--output-json', human['graph'], '--output-mermaid', human['diagram'], '--output-markdown', human['document'], '--session-id', session['session_id']], check=True)
          subprocess.run([sys.executable, 'scripts/validate_sequence_contract.py', '--root', '.', '--session', str(session_path.relative_to(root))], check=True)
          PY
      - name: Regenerate Project Truth and validate helper-free tree
        shell: bash
        run: |
          python scripts/sync_project_truth.py --root .
          python scripts/validate_sequence_sessions.py --root .
          python scripts/selftest_historical_evidence.py
          python scripts/validate_project_docs.py --root .
          python .github/scripts/validate_skill_reference_split.py --root .
          python scripts/validate_repository_health.py --root .
          python scripts/validate_public_docs.py --root .
          test ! -e .github/workflows/tmp-sw2-17-resync.yml
      - name: Commit regenerated evidence only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow/generated docs artifacts/sequence/SW2-17-GOVERNANCE.acceptance.json
          if ! git diff --cached --quiet; then
            git commit -m 'SW2-17: resync modularized projection evidence'
            git push origin HEAD:work/sw2-17-generator-modularization
          fi
