# Skill Workflow governance profile
#
# Profiles:
#   lite     - small/low-complexity projects
#   standard - default for normal multi-session development
#   strict   - high-risk, multi-agent, financial, ML/research, hardware,
#              production infrastructure, or audit-sensitive projects
#
# Contract values:
#   required
#   optional
#   not_applicable
#
# SYSTEM_OVERVIEW.md is mandatory for every profile.
# STRICT requires explicit required/not_applicable decisions for the critical
# contract categories checked by the validator.

profile: standard

contracts:
  api_contracts: optional
  data_contracts: optional
  ui_information_architecture: optional
  runbook: optional
  decisions: optional
  known_defects: optional
  glossary: optional
  changelog: optional

runtime:
  e2e_required: true

notes:
  profile_reason: replace-me
